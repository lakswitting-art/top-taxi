<!DOCTYPE html>
<html lang="zh-TW">

<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>TOP Taxi｜24H 專人預約系統</title>

<!-- LINE LIFF SDK -->
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

<style>

/* =========================================
   TOP Taxi Design System
========================================= */

:root {

    --red: #ff1f2d;
    --red-dark: #c90012;
    --red-deep: #8e0010;

    --black: #08080a;
    --black-2: #101014;
    --black-3: #18181d;

    --white: #ffffff;

    --gray-1: #f4f5f7;
    --gray-2: #e5e5e8;
    --gray-3: #a4a4aa;
    --gray-4: #6d6d73;

    --green: #06C755;

}


/* =========================================
   RESET
========================================= */

* {
    box-sizing: border-box;
}

html {
    background: var(--black);
}

body {

    margin: 0;

    min-height: 100vh;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans TC",
        "PingFang TC",
        Arial,
        sans-serif;

    color: #222;

    background:

        radial-gradient(
            circle at 50% 0%,
            rgba(255, 31, 45, 0.22),
            transparent 33%
        ),

        linear-gradient(
            180deg,
            #070709 0%,
            #101014 40%,
            #f2f3f5 40%,
            #f2f3f5 100%
        );

}


/* =========================================
   HERO
========================================= */

.hero {

    position: relative;

    text-align: center;

    padding:
        max(16px, env(safe-area-inset-top))
        18px
        24px;

    color: white;

    overflow: hidden;

}




/* =========================================
   LOGO
========================================= */

.logo-wrap {

    position: relative;

    display: inline-flex;

    justify-content: center;
    align-items: center;

    margin-bottom: 10px;

}


.logo-glow {

    position: absolute;

    width: 132px;
    height: 132px;

    border-radius: 50%;

    background:
        rgba(255, 20, 35, .16);

    filter: blur(24px);

}


.logo {

    position: relative;

    width: 120px;
    height: 120px;

    object-fit: cover;

    border-radius: 24px;

    border:
        1px solid rgba(255,255,255,.12);

    background: #050506;

    box-shadow:

        0 0 0 1px
        rgba(255, 30, 45, .35),

        0 12px 35px
        rgba(255, 0, 25, .22);

}


/* =========================================
   BRAND
========================================= */

.brand {

    margin: 0;

    font-size: 28px;

    line-height: 1.2;

    font-weight: 900;

    letter-spacing: .5px;

}


.brand-red {
    color: var(--red);
}


.system-name {

    margin-top: 4px;

    color: #f3f3f4;

    font-size: 15px;

    font-weight: 700;

    letter-spacing: 2px;

}


.hero-description {

    margin-top: 9px;

    color: #a8a8ae;

    font-size: 12px;

    line-height: 1.8;

}


/* =========================================
   CONTAINER
========================================= */

.page {

    width: 100%;

    max-width: 560px;

    margin: -6px auto 0;

    padding:

        0 14px

        max(
            34px,
            env(safe-area-inset-bottom)
        );

}


/* =========================================
   CARD
========================================= */

.booking-card {

    background:
        rgba(255,255,255,.98);

    border-radius: 22px;

    padding: 22px 18px;

    box-shadow:

        0 18px 50px
        rgba(0,0,0,.18);

    border:
        1px solid rgba(255,255,255,.7);

}


/* =========================================
   LOGIN STATUS
========================================= */

.line-user {

    display: none;

    margin-bottom: 14px;

    padding: 11px 13px;

    border-radius: 11px;

    background: #effff4;

    border: 1px solid #ccefd8;

    color: #087e3b;

    font-size: 13px;

    line-height: 1.5;

}


.connection-status {

    margin-bottom: 12px;

    display: flex;

    align-items: center;

    gap: 7px;

    color: #8d8d94;

    font-size: 12px;

}


.status-dot {

    width: 7px;
    height: 7px;

    border-radius: 50%;

    background: #aaa;

}


.connection-status.ready
.status-dot {

    background: var(--green);

    box-shadow:
        0 0 0 4px
        rgba(6,199,85,.10);

}


.connection-status.ready {

    color: #4d8c63;

}


/* =========================================
   SECTION
========================================= */

.form-header {

    display: flex;

    justify-content: space-between;

    align-items: center;

    margin-bottom: 15px;

}


.form-title {

    font-size: 16px;

    font-weight: 900;

    color: #1d1d20;

}


.form-label-small {

    color: #aaa;

    font-size: 11px;

    letter-spacing: 1px;

}


/* =========================================
   FORM
========================================= */

.row {

    display: flex;

    gap: 18px;

}


.input-group {

    flex: 1;

    margin-bottom: 15px;

}


label {

    display: block;

    margin-bottom: 8px;

    font-size: 15px;

    color: #26262a;

    font-weight: 800;

}


input,
select {

    width: 100%;

    min-height: 46px;

    padding: 0 11px;

    border:
        1px solid var(--gray-2);

    border-radius: 12px;

    background: #fafafa;

    color: #222;

    font-size: 16px;

    outline: none;

    appearance: auto;

    transition:

        border .15s,

        background .15s,

        box-shadow .15s;

}


input:focus,
select:focus {

    border-color:
        var(--red);

    background:
        white;

    box-shadow:

        0 0 0 3px
        rgba(255,31,45,.08),
        0 6px 18px rgba(255,31,45,.06);

}


input::placeholder {

    color: #b1b1b6;

}



/* 日期 / 時間欄位：手機上更精緻，並保留清楚間距 */
#bookDate,
#bookTime {
    min-height: 42px;
    height: 42px;
    font-size: 14px;
    padding: 0 9px;
}

.row .input-group {
    min-width: 0;
}

/* =========================================
   SUBMIT
========================================= */

.submit-btn {

    width: 100%;

    min-height: 54px;

    margin-top: 6px;

    border: none;

    border-radius: 15px;

    background:

        linear-gradient(
            135deg,
            #ff3341,
            #e10019
        );

    color: white;

    font-size: 17px;

    font-weight: 900;

    letter-spacing: .3px;

    cursor: pointer;

    position: relative;
    overflow: hidden;

    box-shadow:

        0 11px 27px
        rgba(210, 0, 22, .24);

    transition:
        transform .12s,
        opacity .12s,
        filter .16s,
        box-shadow .16s;

}


.submit-btn:active {

    transform:
        scale(.985);

}



.submit-btn:hover {
    filter: brightness(1.04);
    box-shadow: 0 13px 30px rgba(210, 0, 22, .30);
    transform: translateY(-1px);
}

.submit-btn::after {
    content: "";
    position: absolute;
    top: -45%;
    left: -28%;
    width: 28%;
    height: 190%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.25), transparent);
    transform: rotate(18deg);
    transition: left .45s ease;
}

.submit-btn:hover::after {
    left: 116%;
}

.submit-btn:disabled {

    opacity: .55;

    cursor:
        not-allowed;

}


/* =========================================
   NOTES
========================================= */

.notice {

    margin-top: 18px;

    padding-top: 16px;

    border-top:
        1px solid #eee;

    text-align: center;

    color: #8e8e94;

    font-size: 12px;

    line-height: 1.8;

}


/* =========================================
   STATUS MESSAGE
========================================= */

.message-box {

    display: none;

    margin-top: 18px;

    border-radius: 13px;

    padding: 14px;

    text-align: center;

    font-size: 14px;

    line-height: 1.65;

}


.message-box.success {

    display: block;

    color: #087c39;

    background: #effff4;

    border: 1px solid #caefd6;

}


.message-box.error {

    display: block;

    color: #bb2632;

    background: #fff0f1;

    border: 1px solid #ffd2d5;

}


/* =========================================
   SPINNER
========================================= */

.spinner {

    display: inline-block;

    width: 17px;
    height: 17px;

    margin-right: 8px;

    vertical-align: -3px;

    border-radius: 50%;

    border:
        2px solid rgba(255,255,255,.35);

    border-top-color:
        white;

    animation:
        spin .7s linear infinite;

}


@keyframes spin {

    to {
        transform: rotate(360deg);
    }

}


/* =========================================
   FOOTER
========================================= */

.footer {

    text-align: center;

    margin-top: 19px;

    color: #999;

    font-size: 10px;

    line-height: 1.7;

}



@keyframes fadeDown {
    from { opacity: 0; transform: translateY(-8px); }
    to   { opacity: 1; transform: translateY(0); }
}

@keyframes cardUp {
    from { opacity: 0; transform: translateY(14px) scale(.99); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
}

@keyframes successPop {
    0%   { opacity: 0; transform: scale(.96); }
    70%  { opacity: 1; transform: scale(1.02); }
    100% { transform: scale(1); }
}

@keyframes logoFloat {
    0%,100% { transform: translateY(0); }
    50%     { transform: translateY(-3px); }
}

.logo-wrap { animation: logoFloat 3.2s ease-in-out infinite; }
.brand,
.system-name,
.hero-description { animation: fadeDown .55s ease both; }
.booking-card { animation: cardUp .5s cubic-bezier(.2,.8,.2,1) both; }
.message-box.success { animation: successPop .42s cubic-bezier(.2,.8,.2,1) both; }

/* =========================================
   MOBILE
========================================= */

@media (
    max-width: 520px
) {

    .hero {
        padding:
            max(12px, env(safe-area-inset-top))
            14px
            18px;
    }


    .logo {

        width: 100px;
        height: 100px;

        border-radius:
            20px;

    }


    .logo-glow {

        width: 112px;
        height: 112px;

    }


    .brand {

        font-size:
            25px;

    }


    .system-name {

        font-size:
            15px;

    }


    .booking-card {

        padding:
            19px 15px;

        border-radius:
            20px;

    }


    .row {

        gap:
            16px;

    }


    input,
    select {
        font-size: 15px;
    }


    #bookDate,
    #bookTime {
        height: 40px;
        min-height: 40px;
        font-size: 13px;
        padding: 0 7px;
    }

}


/* 小手機 */
@media (max-width: 370px) {
    .row { gap: 10px; }

    #bookDate,
    #bookTime {
        font-size: 12px;
    }
}

</style>

</head>


<body>


<!-- =========================================
     HERO
========================================= -->

<header class="hero">

    <div class="logo-wrap">

        <div class="logo-glow"></div>

        <img
            src="logo.png"
            alt="TOP Taxi Logo"
            class="logo"
        >

    </div>


    <h1 class="brand">

        <span class="brand-red">
            TOP
        </span>

        Taxi

    </h1>


    <div class="system-name">

        24H 專人預約系統

    </div>


    <div class="hero-description">

        365 天全年無休｜專業叫車・機場接送・預約接送・包車服務

    </div>

</header>



<!-- =========================================
     CONTENT
========================================= -->

<main class="page">


<div class="booking-card">


    <!-- LINE 狀態 -->

    <div
        id="connectionStatus"
        class="connection-status"
    >

        <span class="status-dot"></span>

        <span id="connectionText">
            LINE 系統連線中...
        </span>

    </div>


    <div
        id="lineUser"
        class="line-user"
    ></div>



    <!-- FORM HEADER -->

    <div class="form-header">

        <div class="form-title">

            🚕 預約叫車

        </div>


        <div class="form-label-small">

            TOP TAXI BOOKING

        </div>

    </div>



    <!-- FORM -->

    <form id="bookingForm">


        <!-- DATE / TIME -->

        <div class="row">


            <div class="input-group">

                <label for="bookDate">

                    📅 預約日期

                </label>


                <input
                    type="date"
                    id="bookDate"
                    required
                >

            </div>



            <div class="input-group">

                <label for="bookTime">

                    ⏰ 預約時間

                </label>


                <input
                    type="time"
                    id="bookTime"
                    required
                >

            </div>


        </div>



        <!-- PEOPLE / LUGGAGE -->

        <div class="row">


            <div class="input-group">

                <label for="passengerCount">

                    👥 乘車人數

                </label>


                <select id="passengerCount">


                    <option
                        value="1人"
                        selected
                    >
                        1 人
                    </option>


                    <option value="2人">
                        2 人
                    </option>


                    <option value="3人">
                        3 人
                    </option>


                    <option value="4人">
                        4 人
                    </option>


                    <option value="5人以上">
                        5 人以上
                    </option>


                </select>

            </div>



            <div class="input-group">

                <label for="luggageCount">

                    🧳 行李件數

                </label>


                <select id="luggageCount">


                    <option
                        value="無行李"
                        selected
                    >
                        無行李
                    </option>


                    <option value="1-2件大行李">
                        1-2 件大行李
                    </option>


                    <option value="3-4件大行李">
                        3-4 件大行李
                    </option>


                    <option value="5件以上">
                        5 件以上
                    </option>


                </select>

            </div>


        </div>



        <!-- PICKUP -->

        <div class="input-group">

            <label for="pickup">

                📍 上車地點

            </label>


            <input
                type="text"
                id="pickup"
                placeholder="請輸入完整地址或地標名稱"
                autocomplete="street-address"
                required
            >

        </div>



        <!-- DROPOFF -->

        <div class="input-group">

            <label for="dropoff">

                🏁 下車地點

            </label>


            <input
                type="text"
                id="dropoff"
                placeholder="請輸入完整地址或地標名稱"
                required
            >

        </div>



        <!-- MEMO -->

        <div class="input-group">

            <label for="memo">

                💡 特殊需求備註（選填）

            </label>


            <input
                type="text"
                id="memo"
                placeholder="例如：兒童安全座椅、寵物、輪椅..."
            >

        </div>



        <!-- BUTTON -->

        <button
            type="button"
            id="submitBtn"
            class="submit-btn"
            onclick="sendBooking()"
        >

            立即預約 →

        </button>


    </form>



    <div class="notice">

        ※ 送出後預約內容會直接傳送至 TOP Taxi 客服。<br>

        ※ 系統會同步建立預約紀錄。<br>

        ※ 預約是否成立，仍以客服最終確認為準。

    </div>



    <div
        id="messageBox"
        class="message-box"
    ></div>


</div>



<div class="footer">

    TOP Taxi<br>Professional Transportation<br>24H Service

</div>


</main>



<script>


/* ======================================================
   TOP Taxi Configuration
====================================================== */


const LIFF_ID =
    "2011008197-NjirAoUX";


const WEBHOOK_URL =
    "https://lakswitting.app.n8n.cloud/webhook/96798dda-c12a-4552-bcaa-e51a1166a1a8";


let lineDisplayName =
    "";


let lineUserId =
    "";


let liffInitialized =
    false;



/* ======================================================
   UI
====================================================== */


function setConnectionStatus(
    ready,
    text
) {

    const element =
        document.getElementById(
            "connectionStatus"
        );


    const textElement =
        document.getElementById(
            "connectionText"
        );


    textElement.textContent =
        text;


    if (ready) {

        element.classList.add(
            "ready"
        );

    } else {

        element.classList.remove(
            "ready"
        );

    }

}



function showMessage(
    message,
    type
) {

    const box =
        document.getElementById(
            "messageBox"
        );


    box.innerHTML =
        message;


    box.className =
        "message-box " + type;

}



/* ======================================================
   DATE
====================================================== */


const dateInput =
    document.getElementById(
        "bookDate"
    );


const timeInput =
    document.getElementById(
        "bookTime"
    );



function localDate() {

    const now =
        new Date();


    const year =
        now.getFullYear();


    const month =
        String(
            now.getMonth() + 1
        ).padStart(
            2,
            "0"
        );


    const day =
        String(
            now.getDate()
        ).padStart(
            2,
            "0"
        );


    return (
        year +
        "-" +
        month +
        "-" +
        day
    );

}



const today =
    localDate();


dateInput.value =
    today;


dateInput.min =
    today;



/* ======================================================
   HTML ESCAPE
====================================================== */


function escapeHtml(
    value
) {

    const element =
        document.createElement(
            "div"
        );


    element.textContent =
        value;


    return element.innerHTML;

}



/* ======================================================
   LIFF
====================================================== */


async function initializeLiff() {


    try {


        if (
            typeof liff === "undefined"
        ) {

            throw new Error(
                "LIFF_SDK_NOT_LOADED"
            );

        }



        await liff.init({

            liffId:
                LIFF_ID

        });



        liffInitialized =
            true;



        setConnectionStatus(

            true,

            "LINE 系統已連線"

        );



        /*
        外部瀏覽器開啟 LIFF URL 時，
        如果尚未登入則進行 LINE Login。
        */

        if (
            !liff.isLoggedIn()
        ) {

            liff.login();

            return;

        }



        /*
        取得使用者資料
        */

        try {


            const profile =
                await liff.getProfile();



            lineDisplayName =
                profile.displayName || "";


            lineUserId =
                profile.userId || "";



            if (
                lineDisplayName
            ) {


                const box =
                    document.getElementById(
                        "lineUser"
                    );


                box.innerHTML =
                    "🟢 已登入 LINE<br><strong>" +
                    escapeHtml(lineDisplayName) +
                    "</strong>";


                box.style.display =
                    "block";


            }


        } catch (
            profileError
        ) {


            console.warn(

                "LINE Profile Error",

                profileError

            );


        }



    } catch (
        error
    ) {


        console.error(

            "LIFF INIT ERROR:",

            error

        );



        setConnectionStatus(

            false,

            "LINE 系統尚未連線"

        );



        showMessage(

            "LINE 系統初始化失敗。<br>" +
            "請從 TOP Taxi 官方帳號的「預約叫車」重新開啟。",

            "error"

        );


    }

}



/* ======================================================
   VALIDATION
====================================================== */


function validateBookingTime() {


    if (

        !dateInput.value ||

        !timeInput.value

    ) {

        return true;

    }



    const selected =
        new Date(

            dateInput.value +
            "T" +
            timeInput.value

        );



    const now =
        new Date();



    if (
        selected <= now
    ) {


        alert(

            "請選擇目前時間之後的預約時間。"

        );


        return false;

    }



    return true;

}



/* ======================================================
   SEND BOOKING
====================================================== */


async function sendBooking() {

    try {
        if (navigator.vibrate) navigator.vibrate(20);
    } catch (e) {}

    const button =
        document.getElementById(
            "submitBtn"
        );



    const bookDate =
        dateInput.value;



    const bookTime =
        timeInput.value;



    const passengerCount =
        document.getElementById(
            "passengerCount"
        ).value;



    const luggageCount =
        document.getElementById(
            "luggageCount"
        ).value;



    const pickup =
        document.getElementById(
            "pickup"
        ).value.trim();



    const dropoff =
        document.getElementById(
            "dropoff"
        ).value.trim();



    const memo =
        document.getElementById(
            "memo"
        ).value.trim()
        ||
        "無";



    /* -----------------------------------------
       REQUIRED
    ----------------------------------------- */


    if (

        !bookDate ||

        !bookTime ||

        !pickup ||

        !dropoff

    ) {


        alert(

            "請完整填寫預約日期、時間、上車地點與下車地點。"

        );


        return;

    }



    if (
        !validateBookingTime()
    ) {

        return;

    }



    if (
        !liffInitialized
    ) {


        showMessage(

            "LINE 系統尚未完成連線，請稍候幾秒後再試。",

            "error"

        );


        return;

    }



    if (
        !liff.isInClient()
    ) {


        showMessage(

            "請從 TOP Taxi LINE 官方帳號的「預約叫車」進入本頁後再送出。",

            "error"

        );


        return;

    }



    button.disabled =
        true;



    button.innerHTML =

        '<span class="spinner"></span>' +

        "正在送出預約";



    /* -----------------------------------------
       LINE MESSAGE
    ----------------------------------------- */


    const lineMessage =

`🚕 TOP Taxi｜24H 預約系統

📅 預約日期：${bookDate}
⏰ 預約時間：${bookTime}

👥 乘車人數：${passengerCount}
🧳 行李件數：${luggageCount}

📍 上車地點
${pickup}

🏁 下車地點
${dropoff}

💡 特殊需求
${memo}

━━━━━━━━━━━━━━
請客服協助確認此筆預約，謝謝！`;



    /* -----------------------------------------
       DATA FOR N8N
    ----------------------------------------- */


    const bookingData = {


        source:
            "TOP Taxi LIFF Booking",


        lineDisplayName:
            lineDisplayName,


        lineUserId:
            lineUserId,


        bookDate:
            bookDate,


        bookTime:
            bookTime,


        passengerCount:
            passengerCount,


        luggageCount:
            luggageCount,


        pickup:
            pickup,


        dropoff:
            dropoff,


        memo:
            memo,


        submittedAt:
            new Date().toISOString()


    };



    try {


        /* =====================================
           STEP 1
           客人的 LINE 直接送出預約
        ===================================== */


        await liff.sendMessages([


            {

                type:
                    "text",

                text:
                    lineMessage

            }


        ]);



        /*
        到這裡代表客服已經收到 LINE 訊息。

        即使後面的 Sheets 暫時失敗，
        我們也不應該讓客人重新送第二次。
        */



        /* =====================================
           STEP 2
           N8N → GOOGLE SHEETS
        ===================================== */


        try {


            const response =
                await fetch(


                    WEBHOOK_URL,


                    {


                        method:
                            "POST",


                        headers: {


                            "Content-Type":
                                "application/json"


                        },


                        body:
                            JSON.stringify(
                                bookingData
                            )


                    }


                );



            if (
                !response.ok
            ) {


                console.warn(

                    "n8n HTTP:",

                    response.status

                );


            }



        } catch (
            n8nError
        ) {


            console.error(

                "N8N ERROR:",

                n8nError

            );


        }



        /* =====================================
           SUCCESS
        ===================================== */


        button.innerHTML =
            "✅ 預約已送出";



        showMessage(

            "✅ 預約已成功傳送給客服。<br>" +

            "TOP Taxi 客服將盡快與您確認。",

            "success"

        );

        try {
            if (navigator.vibrate) navigator.vibrate([30,40,30]);
        } catch (e) {}



        /*
        成功後 2 秒自動關閉 LIFF
        */


        setTimeout(

            function () {


                try {


                    if (
                        liff.isInClient()
                    ) {


                        liff.closeWindow();


                    }


                } catch (
                    closeError
                ) {


                    console.warn(
                        closeError
                    );


                }


            },

            2000

        );



    } catch (
        error
    ) {


        console.error(

            "SEND MESSAGE ERROR:",

            error

        );



        button.disabled =
            false;



        button.innerHTML =
            "立即預約 →";



        showMessage(

            "預約尚未送出。<br>" +

            "請稍後再試，或直接透過 LINE 聯絡 TOP Taxi 客服。",

            "error"

        );


    }

}



/* ======================================================
   START
====================================================== */


window.addEventListener(

    "DOMContentLoaded",

    function () {


        initializeLiff();


    }

);


</script>
