<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TOP Taxi｜線上預約叫車</title>

<style>
:root {
    --primary-color: #06C755;
    --bg-color: #f4f6f9;
    --card-bg: #ffffff;
    --text-color: #333333;
}

* {
    box-sizing: border-box;
}

body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        Helvetica, Arial, sans-serif;

    background-color: var(--bg-color);
    color: var(--text-color);

    margin: 0;
    padding: 20px;

    display: flex;
    justify-content: center;
    align-items: center;

    min-height: 100vh;
}

.container {
    background-color: var(--card-bg);

    border-radius: 16px;

    box-shadow: 0 4px 20px rgba(0,0,0,0.08);

    padding: 30px;

    width: 100%;
    max-width: 480px;
}

h2 {
    text-align: center;
    color: #222;

    margin-top: 0;
    margin-bottom: 5px;

    font-size: 24px;
}

.subtitle {
    text-align: center;

    color: #666;

    font-size: 14px;

    margin-bottom: 25px;
}

.input-group {
    margin-bottom: 20px;
}

label {
    display: block;

    margin-bottom: 8px;

    font-weight: bold;

    font-size: 15px;
}

input,
select {
    width: 100%;

    padding: 12px;

    border: 1px solid #ddd;

    border-radius: 8px;

    font-size: 16px;

    outline: none;

    background-color: #fff;
}

input:focus,
select:focus {
    border-color: var(--primary-color);
}

.row {
    display: flex;
    gap: 10px;
}

.row .input-group {
    flex: 1;
}

.line-btn {
    width: 100%;

    background-color: var(--primary-color);

    color: white;

    padding: 15px;

    font-size: 16px;

    font-weight: bold;

    border-radius: 8px;

    border: none;

    cursor: pointer;

    box-shadow: 0 4px 10px rgba(6,199,85,0.3);

    margin-top: 10px;
}

.line-btn:hover {
    opacity: 0.9;
}

.line-btn:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}

.notice {
    font-size: 12px;

    color: #888;

    margin-top: 15px;

    text-align: center;

    line-height: 1.6;
}

.success-message {
    display: none;

    background: #ecfff3;

    color: #087a37;

    padding: 15px;

    border-radius: 8px;

    margin-top: 18px;

    text-align: center;

    font-weight: bold;
}

@media (max-width: 520px) {
    body {
        padding: 12px;
        align-items: flex-start;
    }

    .container {
        padding: 22px 18px;
        margin-top: 10px;
    }

    .row {
        flex-direction: column;
        gap: 0;
    }
}
</style>

</head>

<body>

<div class="container">

<h2>🚕 TOP Taxi 預約叫車</h2>

<div class="subtitle">
填寫以下資料，送出後客服將盡快為您確認預約
</div>

<form id="bookingForm">

    <div class="row">

        <div class="input-group">

            <label for="bookDate">
                預約日期
            </label>

            <input
                type="date"
                id="bookDate"
                required
            >

        </div>


        <div class="input-group">

            <label for="bookTime">
                預約時間
            </label>

            <input
                type="time"
                id="bookTime"
                required
            >

        </div>

    </div>


    <div class="row">

        <div class="input-group">

            <label for="passengerCount">
                👥 乘車人數
            </label>

            <select id="passengerCount">

                <option value="1人" selected>
                    1 人
                </option>

                <option value="2人">
                    2 人
                </option>

                <option value="3人">
                    3 人
                </option>

                <option value="4人">
                    4 人
                </option>

                <option value="5人以上">
                    5 人以上
                </option>

            </select>

        </div>


        <div class="input-group">

            <label for="luggageCount">
                🧳 行李件數
            </label>

            <select id="luggageCount">

                <option value="無行李" selected>
                    無行李
                </option>

                <option value="1-2件大行李">
                    1-2 件大行李
                </option>

                <option value="3-4件大行李">
                    3-4 件大行李
                </option>

                <option value="5件以上">
                    5 件以上
                </option>

            </select>

        </div>

    </div>


    <div class="input-group">

        <label for="pickup">
            📍 上車地點
        </label>

        <input
            type="text"
            id="pickup"
            placeholder="請輸入完整地址或地標名稱"
            required
        >

    </div>


    <div class="input-group">

        <label for="dropoff">
            🏁 下車地點
        </label>

        <input
            type="text"
            id="dropoff"
            placeholder="請輸入完整地址或地標名稱"
            required
        >

    </div>


    <div class="input-group">

        <label for="memo">
            💡 特殊需求備註（選填）
        </label>

        <input
            type="text"
            id="memo"
            placeholder="例如：兒童安全座椅、寵物、輪椅..."
        >

    </div>


    <button
        type="button"
        id="submitBtn"
        class="line-btn"
        onclick="sendBooking()"
    >
        🚕 送出預約
    </button>

</form>


<div class="notice">

※ 送出後預約資料會直接傳送至 TOP Taxi 客服系統。<br>

※ 預約是否成立，仍以客服最終確認為準。

</div>


<div
    id="successMessage"
    class="success-message"
>
    ✅ 預約資料已送出，客服將盡快為您確認。
</div>

</div>


<script>

/* ==============================
   n8n Production Webhook
   ↓↓↓ 請把這裡換成你的正式網址
================================ */

const WEBHOOK_URL =
"https://lakswitting.app.n8n.cloud/webhook-test/96798dda-c12a-4552-bcaa-e51a1166a1a8";


/* ==============================
   日期與時間設定
================================ */

const dateInput =
document.getElementById("bookDate");

const timeInput =
document.getElementById("bookTime");


function getTodayString(){

    const today =
    new Date();

    const yyyy =
    today.getFullYear();

    const mm =
    String(
        today.getMonth() + 1
    ).padStart(2,"0");

    const dd =
    String(
        today.getDate()
    ).padStart(2,"0");

    return `${yyyy}-${mm}-${dd}`;
}


const todayString =
getTodayString();


dateInput.value =
todayString;

dateInput.min =
todayString;


dateInput.addEventListener(
    "change",
    validateTimeLimit
);

timeInput.addEventListener(
    "change",
    validateTimeLimit
);


function validateTimeLimit(){

    if(
        !dateInput.value ||
        !timeInput.value
    ){
        return true;
    }


    const now =
    new Date();


    const selectedDateTime =
    new Date(
        `${dateInput.value}T${timeInput.value}`
    );


    if(
        selectedDateTime < now
    ){

        alert(
            "預約時間不能選擇已經過去的時間。"
        );

        timeInput.value =
        "";

        return false;

    }


    return true;

}


/* ==============================
   送出預約
================================ */

async function sendBooking(){

    const bookDate =
    dateInput.value;

    const bookTime =
    timeInput.value;

    const passengerCount =
    document.getElementById(
        "passengerCount"
    ).value;

    const luggageCount =
    document.getElementById(
        "luggageCount"
    ).value;

    const pickup =
    document.getElementById(
        "pickup"
    ).value.trim();

    const dropoff =
    document.getElementById(
        "dropoff"
    ).value.trim();

    const memo =
    document.getElementById(
        "memo"
    ).value.trim();


    if(
        !bookDate ||
        !bookTime ||
        !pickup ||
        !dropoff
    ){

        alert(
            "請完整填寫預約日期、時間、上車地點與下車地點。"
        );

        return;

    }


    if(
        !validateTimeLimit()
    ){
        return;
    }


    const bookingData = {

        source:
        "TOP Taxi Booking",

        bookDate:
        bookDate,

        bookTime:
        bookTime,

        passengerCount:
        passengerCount,

        luggageCount:
        luggageCount,

        pickup:
        pickup,

        dropoff:
        dropoff,

        memo:
        memo || "無",

        submittedAt:
        new Date().toISOString()

    };


    const submitBtn =
    document.getElementById(
        "submitBtn"
    );


    submitBtn.disabled =
    true;

    submitBtn.textContent =
    "⏳ 預約送出中...";


    try{

        const response =
        await fetch(
            WEBHOOK_URL,
            {

                method:
                "POST",

                headers:{
                    "Content-Type":
                    "application/json"
                },

                body:
                JSON.stringify(
                    bookingData
                )

            }
        );


        if(
            !response.ok
        ){

            throw new Error(
                `HTTP ${response.status}`
            );

        }


        document.getElementById(
            "successMessage"
        ).style.display =
        "block";


        document.getElementById(
            "bookingForm"
        ).reset();


        dateInput.value =
        getTodayString();


        document.getElementById(
            "passengerCount"
        ).value =
        "1人";


        document.getElementById(
            "luggageCount"
        ).value =
        "無行李";


    }catch(error){

        console.error(
            "Booking error:",
            error
        );


        alert(
            "預約送出失敗，請稍後再試或直接聯絡客服。"
        );

    }finally{

        submitBtn.disabled =
        false;

        submitBtn.textContent =
        "🚕 送出預約";

    }

}

</script>

</body>
</html>
