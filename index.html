<!DOCTYPE html>
<html lang="zh-TW">

<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>TOP Taxi｜24H 預約系統</title>

<!-- LINE LIFF SDK -->
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

<style>

/* =========================================
   TOP Taxi Design System
========================================= */

:root {

    --red: #ff1f2d;
    --red-dark: #c90012;
    --red-deep: #8e0010;

    --black: #08080a;
    --black-2: #101014;
    --black-3: #18181d;

    --white: #ffffff;

    --gray-1: #f4f5f7;
    --gray-2: #e5e5e8;
    --gray-3: #a4a4aa;
    --gray-4: #6d6d73;

    --green: #06C755;

}


/* =========================================
   RESET
========================================= */

* {
    box-sizing: border-box;
}

html {
    background: var(--black);
}

body {

    margin: 0;

    min-height: 100vh;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans TC",
        "PingFang TC",
        Arial,
        sans-serif;

    color: #222;

    background:

        radial-gradient(
            circle at 50% 0%,
            rgba(255, 31, 45, 0.22),
            transparent 33%
        ),

        linear-gradient(
            180deg,
            #070709 0%,
            #101014 40%,
            #f2f3f5 40%,
            #f2f3f5 100%
        );

}


/* =========================================
   HERO
========================================= */

.hero {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    max-width: 560px;
    margin: 0 auto;
    padding:
        max(14px, env(safe-area-inset-top))
        18px
        16px;
    color: white;
    overflow: hidden;
}

.hero-copy {
    min-width: 0;
    flex: 1;
    text-align: center;
}

.hero::after {
    content: "";
    flex: 0 0 70px;
    width: 70px;
}




/* =========================================
   LOGO
========================================= */

.logo-wrap {
    position: relative;
    display: inline-flex;
    justify-content: center;
    align-items: center;
    flex: 0 0 auto;
    margin: 0;
}


.logo-glow {
    position: absolute;
    width: 78px;
    height: 78px;
    border-radius: 50%;
    background: rgba(255, 20, 35, .18);
    filter: blur(18px);
}


.logo {
    position: relative;
    width: 70px;
    height: 70px;
    object-fit: cover;
    border-radius: 16px;
    border: 1px solid rgba(255,255,255,.12);
    background: #050506;
    box-shadow:
        0 0 0 1px rgba(255, 30, 45, .35),
        0 8px 24px rgba(255, 0, 25, .22);
}


/* =========================================
   BRAND
========================================= */

.brand {
    margin: 0;
    font-size: 25px;
    line-height: 1.08;
    font-weight: 900;
    letter-spacing: .4px;
}


.brand-red {
    color: var(--red);
}


.system-name {
    margin-top: 5px;
    color: #f3f3f4;
    font-size: 14px;
    font-weight: 800;
    letter-spacing: 1.5px;
}


.hero-description {
    margin-top: 7px;
    color: #a8a8ae;
    font-size: 11px;
    line-height: 1.45;
    white-space: nowrap;
}


/* =========================================
   CONTAINER
========================================= */

.page {

    width: 100%;

    max-width: 560px;

    margin: 0 auto;

    padding:

        0 14px

        max(
            34px,
            env(safe-area-inset-bottom)
        );

}


/* =========================================
   CARD
========================================= */

.booking-card {

    background:
        rgba(255,255,255,.98);

    border-radius: 22px;

    padding: 22px 18px;

    box-shadow:

        0 18px 50px
        rgba(0,0,0,.18);

    border:
        1px solid rgba(255,255,255,.7);

}


/* =========================================
   LOGIN STATUS
========================================= */

.line-user {

    display: none;

    margin-bottom: 14px;

    padding: 11px 13px;

    border-radius: 11px;

    background: #effff4;

    border: 1px solid #ccefd8;

    color: #087e3b;

    font-size: 13px;

    line-height: 1.5;

}


.connection-status {

    margin-bottom: 12px;

    display: flex;

    align-items: center;

    gap: 7px;

    color: #8d8d94;

    font-size: 12px;

}


.status-dot {

    width: 7px;
    height: 7px;

    border-radius: 50%;

    background: #aaa;

}


.connection-status.ready
.status-dot {

    background: var(--green);

    box-shadow:
        0 0 0 4px
        rgba(6,199,85,.10);

}


.connection-status.ready {

    color: #4d8c63;

}


/* =========================================
   SECTION
========================================= */

.form-header {

    display: flex;

    justify-content: space-between;

    align-items: center;

    margin-bottom: 15px;

}


.form-title {

    font-size: 16px;

    font-weight: 900;

    color: #1d1d20;

}


.form-label-small {

    color: #aaa;

    font-size: 11px;

    letter-spacing: 1px;

}

.service-switch {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
    margin-bottom: 18px;
    padding: 6px;
    border: 1px solid var(--gray-2);
    border-radius: 15px;
    background: #f5f5f7;
}

.service-option {
    min-height: 48px;
    padding: 0 10px;
    border: 0;
    border-radius: 11px;
    background: transparent;
    color: #77777d;
    font-size: 15px;
    font-weight: 900;
    cursor: pointer;
    transition: background .18s, color .18s, box-shadow .18s;
}

.service-option.active {
    background: linear-gradient(135deg, #ff3142, #f40020);
    color: #ffffff;
    box-shadow: 0 7px 18px rgba(244, 0, 32, .22);
}

.passenger-options.is-hidden {
    display: none;
}

.fare-estimate {
    display: grid;
    grid-template-columns: 1fr 1fr 1.15fr;
    gap: 8px;
    margin: 2px 0 16px;
    padding: 12px;
    border: 1px solid #f0dfe2;
    border-radius: 15px;
    background: #fff7f8;
}

.fare-estimate[hidden] {
    display: none;
}

.fare-estimate-item {
    min-width: 0;
    text-align: center;
}

.fare-estimate-title {
    grid-column: 1 / -1;
    color: var(--red);
    font-size: 14px;
    font-weight: 900;
}

.fare-estimate-label {
    display: block;
    margin-bottom: 4px;
    color: #929298;
    font-size: 11px;
    font-weight: 700;
}

.fare-estimate-value {
    display: block;
    color: #252529;
    font-size: 14px;
    font-weight: 900;
    white-space: nowrap;
}

.fare-estimate-value.price {
    color: var(--red);
    font-size: 19px;
}

.fare-estimate-status {
    grid-column: 1 / -1;
    padding-top: 8px;
    border-top: 1px solid #f0e3e5;
    color: #99999f;
    font-size: 12px;
    line-height: 1.5;
    text-align: center;
}

.fare-estimate.loading .fare-estimate-status {
    color: #b16c75;
}


/* =========================================
   FORM
========================================= */

.row {

    display: flex;

    gap: 18px;

}


.input-group {

    flex: 1;

    margin-bottom: 15px;

}


label {

    display: block;

    margin-bottom: 8px;

    font-size: 15px;

    color: #26262a;

    font-weight: 800;

}


input,
select {

    width: 100%;

    min-height: 46px;

    padding: 0 11px;

    border:
        1px solid var(--gray-2);

    border-radius: 12px;

    background: #fafafa;

    color: #222;

    font-size: 16px;

    outline: none;

    appearance: auto;

    transition:

        border .15s,

        background .15s,

        box-shadow .15s;

}


input:focus,
select:focus {

    border-color:
        var(--red);

    background:
        white;

    box-shadow:

        0 0 0 3px
        rgba(255,31,45,.08),
        0 6px 18px rgba(255,31,45,.06);

}


input::placeholder {

    color: #b1b1b6;

}

.address-autocomplete {
    position: relative;
    width: 100%;
}

.address-input {
    padding: 0 44px 0 42px;
    color: #222222;
    -webkit-text-fill-color: #222222;
    caret-color: var(--red);
    font-weight: 700;
    appearance: none;
    -webkit-appearance: none;
}

.address-input::placeholder {
    color: #8d8d93;
    -webkit-text-fill-color: #8d8d93;
    font-weight: 500;
    opacity: 1;
}

.address-search-icon {
    position: absolute;
    top: 23px;
    left: 15px;
    z-index: 2;
    transform: translateY(-50%);
    color: #75757b;
    font-size: 17px;
    pointer-events: none;
}

.address-clear-btn {
    position: absolute;
    top: 23px;
    right: 8px;
    z-index: 2;
    width: 32px;
    height: 32px;
    min-height: 32px;
    padding: 0;
    transform: translateY(-50%);
    border: 0;
    border-radius: 50%;
    background: transparent;
    color: #85858b;
    font-size: 19px;
    cursor: pointer;
}

.address-suggestions {
    position: absolute;
    top: calc(100% + 7px);
    left: 0;
    right: 0;
    z-index: 5000;
    display: none;
    max-height: min(330px, 46vh);
    overflow-y: auto;
    border: 1px solid #e1e1e4;
    border-radius: 14px;
    background: #ffffff;
    box-shadow: 0 16px 38px rgba(0, 0, 0, .18);
    -webkit-overflow-scrolling: touch;
}

.address-suggestions.show {
    display: block;
}

.address-suggestion {
    width: 100%;
    display: grid;
    grid-template-columns: 32px minmax(0, 1fr);
    gap: 10px;
    padding: 12px 14px;
    border: 0;
    border-bottom: 1px solid #ededf0;
    background: #ffffff;
    color: #222222;
    text-align: left;
    cursor: pointer;
}

.address-suggestion:active {
    background: #f5f5f7;
}

.address-suggestion-icon {
    width: 32px;
    height: 32px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    background: #f0f0f2;
    font-size: 16px;
}

.address-suggestion-main,
.address-suggestion-secondary {
    display: block;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.address-suggestion-main {
    font-size: 15px;
    font-weight: 800;
    line-height: 1.35;
}

.address-suggestion-secondary {
    margin-top: 3px;
    color: #77777d;
    font-size: 12px;
    font-weight: 500;
    line-height: 1.35;
}

.address-google-attribution {
    padding: 9px 14px;
    color: #66666c;
    font-size: 12px;
    font-weight: 700;
    text-align: right;
}

.address-no-results {
    padding: 15px;
    color: #77777d;
    font-size: 13px;
    text-align: center;
}



/* 日期 / 時間欄位：手機上更精緻，並保留清楚間距 */
#bookDate,
#bookTime {
    min-height: 42px;
    height: 42px;
    font-size: 14px;
    padding: 0 9px;
}

.row .input-group {
    min-width: 0;
}

/* =========================================
   SUBMIT
========================================= */

.submit-btn {

    width: 100%;

    min-height: 54px;

    margin-top: 6px;

    border: none;

    border-radius: 15px;

    background:

        linear-gradient(
            135deg,
            #ff3341,
            #e10019
        );

    color: white;

    font-size: 17px;

    font-weight: 900;

    letter-spacing: .3px;

    cursor: pointer;

    position: relative;
    overflow: hidden;

    box-shadow:

        0 11px 27px
        rgba(210, 0, 22, .24);

    transition:
        transform .12s,
        opacity .12s,
        filter .16s,
        box-shadow .16s;

}


.submit-btn:active {

    transform:
        scale(.985);

}



.submit-btn:hover {
    filter: brightness(1.04);
    box-shadow: 0 13px 30px rgba(210, 0, 22, .30);
    transform: translateY(-1px);
}

.submit-btn::after {
    content: "";
    position: absolute;
    top: -45%;
    left: -28%;
    width: 28%;
    height: 190%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.25), transparent);
    transform: rotate(18deg);
    transition: left .45s ease;
}

.submit-btn:hover::after {
    left: 116%;
}

.submit-btn:disabled {

    opacity: .55;

    cursor:
        not-allowed;

}


/* =========================================
   NOTES
========================================= */

.notice {

    margin-top: 18px;

    padding-top: 16px;

    border-top:
        1px solid #eee;

    text-align: center;

    color: #8e8e94;

    font-size: 12px;

    line-height: 1.8;

}


/* =========================================
   STATUS MESSAGE
========================================= */

.message-box {

    display: none;

    margin-top: 18px;

    border-radius: 13px;

    padding: 14px;

    text-align: center;

    font-size: 14px;

    line-height: 1.65;

}


.message-box.success {

    display: block;

    color: #087c39;

    background: #effff4;

    border: 1px solid #caefd6;

}


.message-box.error {

    display: block;

    color: #bb2632;

    background: #fff0f1;

    border: 1px solid #ffd2d5;

}


/* =========================================
   SPINNER
========================================= */

.spinner {

    display: inline-block;

    width: 17px;
    height: 17px;

    margin-right: 8px;

    vertical-align: -3px;

    border-radius: 50%;

    border:
        2px solid rgba(255,255,255,.35);

    border-top-color:
        white;

    animation:
        spin .7s linear infinite;

}


@keyframes spin {

    to {
        transform: rotate(360deg);
    }

}


/* =========================================
   FOOTER
========================================= */

.footer {

    text-align: center;

    margin-top: 19px;

    color: #999;

    font-size: 10px;

    line-height: 1.7;

}



@keyframes fadeDown {
    from { opacity: 0; transform: translateY(-8px); }
    to   { opacity: 1; transform: translateY(0); }
}

@keyframes cardUp {
    from { opacity: 0; transform: translateY(14px) scale(.99); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
}

@keyframes successPop {
    0%   { opacity: 0; transform: scale(.96); }
    70%  { opacity: 1; transform: scale(1.02); }
    100% { transform: scale(1); }
}

@keyframes logoFloat {
    0%,100% { transform: translateY(0); }
    50%     { transform: translateY(-3px); }
}

.logo-wrap { animation: logoFloat 3.2s ease-in-out infinite; }
.brand,
.system-name,
.hero-description { animation: fadeDown .55s ease both; }
.booking-card { animation: cardUp .5s cubic-bezier(.2,.8,.2,1) both; }
.message-box.success { animation: successPop .42s cubic-bezier(.2,.8,.2,1) both; }

/* =========================================
   MOBILE
========================================= */

@media (max-width: 520px) {

    .hero {
        justify-content: flex-start;
        gap: 18px;
        padding:
            max(10px, env(safe-area-inset-top))
            24px
            12px;
    }

    .logo {
        width: 58px;
        height: 58px;
        border-radius: 14px;
    }

    .logo-glow {
        width: 66px;
        height: 66px;
        filter: blur(16px);
    }

    .hero::after {
        flex-basis: 58px;
        width: 58px;
    }

    .brand {
        font-size: 23px;
    }

    .system-name {
        margin-top: 3px;
        font-size: 13px;
        letter-spacing: 1.25px;
    }

    .hero-description {
        margin-top: 5px;
        max-width: calc(100vw - 125px);
        overflow: hidden;
        font-size: 10.5px;
        font-weight: 600;
        letter-spacing: .2px;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    .booking-card {
        padding:
            17px 15px;
        border-radius:
            20px;
    }

    .form-header {
        margin-bottom: 10px;
    }

    .service-switch {
        margin-bottom: 15px;
    }

    .row {
        gap: 14px;
    }

    input,
    select {
        font-size: 15px;
    }

    #bookDate,
    #bookTime {
        height: 40px;
        min-height: 40px;
        font-size: 13px;
        padding: 0 7px;
    }
}


/* 小手機 */
@media (max-width: 370px) {
    .row { gap: 10px; }

    #bookDate,
    #bookTime {
        font-size: 12px;
    }
    .hero { gap: 13px; padding-left: 18px; padding-right: 18px; }
    .logo { width: 54px; height: 54px; border-radius: 13px; }
    .hero::after { flex-basis: 54px; width: 54px; }
    .hero-description { max-width: calc(100vw - 112px); font-size: 9.5px; }
}



/* =========================================
   SHARED SAVED ADDRESSES - TEST VERSION
========================================= */
.saved-address-panel {
    margin-bottom: 15px;
    padding: 13px;
    border: 1px solid var(--gray-2);
    border-radius: 15px;
    background: #fafafa;
}
.saved-address-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 10px;
}
.saved-address-title {
    font-size: 14px;
    font-weight: 900;
    color: #26262a;
}
.saved-address-edit {
    padding: 0;
    border: 0;
    background: transparent;
    color: var(--red);
    font-size: 12px;
    font-weight: 900;
    cursor: pointer;
}
.saved-address-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
}
.saved-address-chip {
    min-height: 38px;
    padding: 0 12px;
    border: 1px solid var(--gray-2);
    border-radius: 11px;
    background: #ffffff;
    color: #333338;
    font-size: 13px;
    font-weight: 800;
    cursor: pointer;
}
.saved-address-chip:active,
.saved-address-chip.active {
    border-color: var(--red);
    background: #fff1f2;
    color: var(--red);
}
.saved-address-empty {
    color: #99999f;
    font-size: 12px;
}
.saved-address-editor {
    display: grid;
    gap: 10px;
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid var(--gray-2);
}
.saved-address-editor[hidden] { display: none; }
.saved-address-row {
    display: grid;
    grid-template-columns: 92px 1fr;
    gap: 8px;
}
.saved-address-row input {
    min-height: 42px;
    font-size: 13px;
}
.saved-address-note {
    grid-column: 2;
}
.saved-address-save {
    width: 100%;
    min-height: 44px;
    border: 0;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--red), var(--red-dark));
    color: #fff;
    font-size: 14px;
    font-weight: 900;
    cursor: pointer;
}
.pickup-note-helper {
    margin-top: 8px;
}
@media (max-width: 390px) {
    .saved-address-row { grid-template-columns: 82px 1fr; }
}


/* ===== STEP 3：MULTI-STOP + ROUTE MODE ===== */
.booking-waypoints {
    display: grid;
    gap: 10px;
    margin: -2px 0 15px;
}
.booking-waypoint {
    display: grid;
    gap: 8px;
    padding-left: 14px;
    border-left: 2px dashed #dedee2;
}
.booking-waypoint[hidden] { display: none !important; }
.booking-waypoint-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
}
.booking-waypoint-head label { margin: 0; }
.booking-waypoint-remove {
    border: 1px solid var(--gray-2);
    border-radius: 10px;
    background: #fff;
    color: #818187;
    padding: 6px 10px;
    font-size: 12px;
    font-weight: 800;
}
.booking-add-waypoint {
    width: 100%;
    min-height: 44px;
    border: 1px dashed #d4d4d8;
    border-radius: 13px;
    background: #fff;
    color: #56565c;
    font-weight: 850;
}
.booking-add-waypoint[hidden] { display: none !important; }
.booking-waypoint-help {
    color: #99999f;
    font-size: 11px;
    line-height: 1.5;
    text-align: center;
}
.booking-route-switch {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
    margin-bottom: 7px;
    padding: 5px;
    border: 1px solid var(--gray-2);
    border-radius: 14px;
    background: #f5f5f7;
}
.booking-route-option {
    min-height: 43px;
    border: 0;
    border-radius: 10px;
    background: transparent;
    color: #77777d;
    font-size: 13px;
    font-weight: 900;
}
.booking-route-option.active {
    background: #fff;
    color: #222226;
    box-shadow: 0 4px 14px rgba(0,0,0,.08);
}
.booking-route-option.fast.active {
    background: #17171b;
    color: #fff;
}
.booking-route-help {
    color: #96969c;
    font-size: 11px;
    line-height: 1.5;
}
.booking-route-switch-result {
    margin-bottom: 4px;
}
.booking-route-switch-result .booking-route-option {
    min-height: 38px;
    padding: 0 8px;
    font-size: 12px;
}

</style>

</head>


<body>


<!-- =========================================
     HERO
========================================= -->

<header class="hero">

    <div class="logo-wrap">
        <div class="logo-glow"></div>
        <img
            src="logo.png"
            alt="TOP Taxi Logo"
            class="logo"
        >
    </div>

    <div class="hero-copy">
        <h1 class="brand">
            <span class="brand-red">TOP</span> Taxi
        </h1>

        <div class="system-name">
            24H 預約系統
        </div>

        <div class="hero-description">
            24H｜預約接送・機場接送・酒後代駕・長途包車
        </div>
    </div>

</header>



<!-- =========================================
     CONTENT

/* ======================================================
   SHARED SAVED ADDRESSES - SAME STORAGE AS RIDE.HTML
====================================================== */
const SHARED_ADDRESS_KEY = "topTaxiAddresses";

function createEmptyAddressData(name = "") {
    return {
        name: name,
        displayName: "",
        address: "",
        city: "",
        district: "",
        areaLabel: "",
        placeId: "",
        lat: null,
        lng: null,
        pickupNote: ""
    };
}

const SHARED_ADDRESS_DEFAULTS = [
    createEmptyAddressData("住家"),
    createEmptyAddressData("公司"),
    createEmptyAddressData("常用地點 1"),
    createEmptyAddressData("常用地點 2")
];

function getAddressComponent(place, types) {
    const components = place && Array.isArray(place.addressComponents)
        ? place.addressComponents
        : [];

    for (const type of types) {
        const component = components.find(function(item) {
            return Array.isArray(item.types) && item.types.includes(type);
        });

        if (component) {
            return component.longText || component.shortText || "";
        }
    }

    return "";
}

function getPlaceDisplayName(place) {
    if (!place || !place.displayName) return "";
    if (typeof place.displayName === "string") return place.displayName;
    if (typeof place.displayName.toString === "function") return place.displayName.toString();
    return "";
}

function placeToAddressData(place, extra = {}) {
    const city = getAddressComponent(place, [
        "administrative_area_level_1"
    ]);

    const district = getAddressComponent(place, [
        "administrative_area_level_3",
        "administrative_area_level_2",
        "locality"
    ]);

    const lat = place && place.location
        ? (typeof place.location.lat === "function" ? place.location.lat() : (place.location.lat ?? null))
        : null;

    const lng = place && place.location
        ? (typeof place.location.lng === "function" ? place.location.lng() : (place.location.lng ?? null))
        : null;

    return {
        name: extra.name || "",
        displayName: getPlaceDisplayName(place),
        address: (place && place.formattedAddress) || extra.address || "",
        city: city,
        district: district,
        areaLabel: [city, district].filter(Boolean).join(""),
        placeId: (place && place.id) || extra.placeId || "",
        lat: lat,
        lng: lng,
        pickupNote: extra.pickupNote || ""
    };
}

function normalizeAddressData(item = {}, fallback = {}) {
    const city = item.city || "";
    const district = item.district || "";

    return {
        name: item.name ?? fallback.name ?? "",
        displayName: item.displayName || "",
        address: item.address || "",
        city: city,
        district: district,
        areaLabel: item.areaLabel || [city, district].filter(Boolean).join(""),
        placeId: item.placeId || "",
        lat: item.lat ?? null,
        lng: item.lng ?? null,
        pickupNote: item.pickupNote || ""
    };
}


function compactTaiwanAddress(raw = "") {
    let address = String(raw || "").trim();

    // Remove common Taiwan postal codes at the beginning (3, 5, or 6 digits).
    address = address.replace(/^\s*\d{3}(?:\d{2,3})?\s*/, "");

    // Remove village / neighborhood level text that is not useful for riders.
    address = address.replace(/[^縣市區鄉鎮路街段巷弄號\d\s]{1,12}(?:里|村)/g, "");
    address = address.replace(/\d+\s*鄰/g, "");

    // Remove floor / room / unit details from customer-facing text.
    address = address.replace(/[，,、\s-]*(?:地下)?\d+\s*樓(?:之\d+)?(?:\s*\d+\s*室)?$/u, "");
    address = address.replace(/[，,、\s-]*B\d+\s*樓?$/iu, "");
    address = address.replace(/[，,、\s-]*\d+\s*F(?:-\d+)?$/iu, "");
    address = address.replace(/[，,、\s-]*\d+\s*室$/u, "");

    // Normalize spaces.
    address = address.replace(/\s+/g, "");
    return address;
}

function addressDisplayText(item = {}) {
    const name = (item.displayName || "").trim();
    const address = compactTaiwanAddress(item.address || "");

    if (name && address && !address.includes(name)) {
        return name + "｜" + address;
    }

    return name || address;
}

let sharedAddresses = loadSharedAddresses();

function loadSharedAddresses() {
    try {
        const saved = JSON.parse(localStorage.getItem(SHARED_ADDRESS_KEY) || "null");
        if (Array.isArray(saved)) {
            return SHARED_ADDRESS_DEFAULTS.map(function(def, i) {
                return normalizeAddressData(saved[i] || {}, def);
            });
        }
    } catch (e) {}

    return SHARED_ADDRESS_DEFAULTS.map(function(item) {
        return normalizeAddressData({}, item);
    });
}

let sharedAddressAutocompleteInitializer = null;

function renderSharedAddressEditor() {
    const box = document.getElementById("bookingSavedAddressRows");
    if (!box) return;
    box.innerHTML = "";

        const row = document.createElement("div");

            '<div class="address-autocomplete">' +
                '<input type="search" id="sharedAddress'+index+'" aria-label="常用地址" autocomplete="off" placeholder="請輸入地址或地標" value="'+escapeHtml(addressDisplayText(item))+'">' +
                '<div id="sharedAddressSuggestions'+index+'" class="address-suggestions" role="listbox"></div>' +
            '</div>' +
            '<input type="text" id="sharedNote'+index+'" class="saved-address-note" aria-label="上車位置補充" placeholder="上車位置補充（選填）" value="'+escapeHtml(item.pickupNote || "")+'">';
        box.appendChild(row);
    });

    if (typeof sharedAddressAutocompleteInitializer === "function") {
        sharedAddressAutocompleteInitializer();
    }
}

function renderSharedAddressChips() {
    sharedAddresses = loadSharedAddresses();
    const box = document.getElementById("bookingSavedAddressChips");
    if (!box) return;
    box.innerHTML = "";
    let count = 0;
    sharedAddresses.forEach(function(item, index) {
        if (!item.address) return;
        count++;
        const button = document.createElement("button");
        button.type = "button";
        button.className = "saved-address-chip";
        button.textContent = item.name || ("常用地點 " + (index + 1));
        button.addEventListener("click", function(){ useSharedAddress(index, button); });
        box.appendChild(button);
    });
    if (!count) {
        const empty = document.createElement("span");
        empty.className = "saved-address-empty";
        empty.textContent = "尚未設定常用地址；可先在即時叫車設定，這裡會自動同步。";
        box.appendChild(empty);
    }
    renderSharedAddressEditor();
}

async function resolveSharedAddress(item) {
    const placesLib = await google.maps.importLibrary("places");
    if (item.placeId && placesLib.Place) {
        const place = new placesLib.Place({id:item.placeId});
        await place.fetchFields({fields:["id","displayName","formattedAddress","location","addressComponents"]});
        return place;
    }
    const AutocompleteSuggestion = placesLib.AutocompleteSuggestion;
    const AutocompleteSessionToken = placesLib.AutocompleteSessionToken;
    const response = await AutocompleteSuggestion.fetchAutocompleteSuggestions({
        input:item.address,
        includedRegionCodes:["tw"],
        language:"zh-TW",
        region:"TW",
        locationBias:{center:{lat:24.1477,lng:120.6736},radius:70000},
        sessionToken:new AutocompleteSessionToken()
    });
    const prediction = response.suggestions && response.suggestions[0] && response.suggestions[0].placePrediction;
    if (!prediction) throw new Error("找不到常用地址");
    const place = prediction.toPlace();
    await place.fetchFields({fields:["id","displayName","formattedAddress","location","addressComponents"]});
    return place;
}

async function useSharedAddress(index, button) {
    const item = sharedAddresses[index];
    const pickupInput = document.getElementById("pickup");
    const pickupNoteInput = document.getElementById("pickupNote");
    if (!item || !item.address || !pickupInput) return;
    document.querySelectorAll(".saved-address-chip").forEach(function(b){ b.classList.remove("active"); });
    if (button) button.classList.add("active");
    pickupInput.value = addressDisplayText(item);
    if (pickupNoteInput) pickupNoteInput.value = item.pickupNote || "";
    try {
        bookingPickupPlace = await resolveSharedAddress(item);

        const upgradedAddress = placeToAddressData(bookingPickupPlace, {
            name: item.name || "",
            address: item.address || "",
            placeId: item.placeId || "",
            pickupNote: item.pickupNote || ""
        });

        sharedAddresses[index] = normalizeAddressData(upgradedAddress, item);
        localStorage.setItem(SHARED_ADDRESS_KEY, JSON.stringify(sharedAddresses));

        pickupInput.value = addressDisplayText(sharedAddresses[index]) || bookingPickupPlace.formattedAddress || item.address;
        updateFareEstimate();
    } catch (error) {
        bookingPickupPlace = null;
        resetFareEstimate("常用地址需要重新確認，請從地址建議中選擇一次");
    }
}

function saveSharedAddressesFromBooking() {
    const next = sharedAddresses.map(function(oldItem, index) {
        const name = (document.getElementById("sharedName"+index)?.value || "").trim() || ("常用地點 " + (index + 1));
        const address = (document.getElementById("sharedAddress"+index)?.value || "").trim();
        const pickupNote = (document.getElementById("sharedNote"+index)?.value || "").trim();
        const currentItem = sharedAddresses[index] || oldItem;

        if (currentItem.placeId) {
            return normalizeAddressData({
                ...currentItem,
                name: name,
                pickupNote: pickupNote
            });
        }

        return normalizeAddressData({
            ...currentItem,
            name: name,
            address: address,
            pickupNote: pickupNote,
            displayName: "",
            city: "",
            district: "",
            areaLabel: "",
            placeId: "",
            lat: null,
            lng: null
        });
    });
    localStorage.setItem(SHARED_ADDRESS_KEY, JSON.stringify(next));
    sharedAddresses = next;
    renderSharedAddressChips();
    document.getElementById("bookingSavedAddressEditor").hidden = true;
    document.getElementById("toggleSavedAddressEditor").textContent = "＋ 設定常用地址";
}

function validateBookingWaypoints(showError = false) {
    for (let index = 0; index < MAX_BOOKING_WAYPOINTS; index++) {
        if (!bookingWaypointActive[index]) continue;

        const input = document.getElementById("waypoint" + (index + 1));
        const typed = (input?.value || "").trim();

                input?.focus();
            }
            return false;
        }
    }

    return true;
}

function summarizeBookingRoute(route, expectedLegCount) {
    const legs = Array.isArray(route?.legs) ? route.legs : [];

    if (legs.length !== expectedLegCount) {
        throw new Error(
            "Google 路線停靠點驗證失敗：預期 " +
            expectedLegCount +
            " 段，實際 " +
            legs.length +
            " 段"
        );
    }

    const distanceMeters = legs.reduce(function(sum, leg) {
        return sum + Number(leg?.distanceMeters || 0);
    }, 0);

    const durationMillis = legs.reduce(function(sum, leg) {
        return sum + Number(leg?.durationMillis || 0);
    }, 0);

    if (
        !Number.isFinite(distanceMeters) ||
        !Number.isFinite(durationMillis) ||
        distanceMeters <= 0 ||
        durationMillis <= 0
    ) {
        throw new Error("Google 路線分段資料不完整");
    }

    return {
        distanceMeters: distanceMeters,
        durationMillis: durationMillis
    };
}

function selectBookingRouteMode(mode) {
    selectedBookingRouteMode = mode === "SURFACE" ? "SURFACE" : "FAST";

    document.getElementById("bookingSurfaceBtn")?.classList.toggle(
        "active",
        selectedBookingRouteMode === "SURFACE"
    );

    document.getElementById("bookingFastBtn")?.classList.toggle(
        "active",
        selectedBookingRouteMode === "FAST"
    );

    if (bookingRouteOptions[selectedBookingRouteMode]) {
        currentFareEstimate = bookingRouteOptions[selectedBookingRouteMode];
        renderBookingFareEstimate();
    } else if (bookingPickupPlace && bookingDropoffPlace) {
        updateFareEstimate();
    }
}

function renderBookingFareEstimate() {
    if (!currentFareEstimate) return;

    document.getElementById("estimateDistance").textContent =
        currentFareEstimate.distanceKm.toFixed(1) + " km";

    document.getElementById("estimateDuration").textContent =
        currentFareEstimate.minutes + " 分鐘";

    document.getElementById("estimateFare").textContent =
        "$" + currentFareEstimate.fare;

    document.getElementById("fareEstimateStatus").textContent =
        currentFareEstimate.routeMode === "SURFACE"
            ? "平面道路｜優先避開高速／收費道路"
            : "推薦快速｜依 Google 即時交通";

    document.getElementById("fareEstimate").hidden = false;
}

function calculateTaxiFare(distanceKm, minutes) {

    const baseFare = 80;
    const timeFare = minutes * 3;
    const distanceFare = distanceKm <= 20
        ? distanceKm * 15
        : (20 * 15) + ((distanceKm - 20) * 25);

    return Math.floor((baseFare + distanceFare + timeFare) / 10) * 10;

}


function calculateDriverFare(distanceKm, minutes) {

    const baseFare = 60;
    const timeFare = minutes * 3;
    const distanceFare = distanceKm <= 20
        ? distanceKm * 15
        : (20 * 15) + ((distanceKm - 20) * 25);

    const tripFare = baseFare + distanceFare + timeFare;

    return Math.floor(((tripFare * 2) + 320) / 10) * 10;

}


function resetFareEstimate(message) {

    fareRequestNumber++;
    currentFareEstimate = null;
    bookingRouteOptions = { FAST: null, SURFACE: null };

    document.getElementById("estimateDistance").textContent = "--";
    document.getElementById("estimateDuration").textContent = "--";
    document.getElementById("estimateFare").textContent = "--";
    document.getElementById("fareEstimateStatus").textContent =
        message || "請從地址建議中選擇上下車地點，系統會自動試算";
    document.getElementById("fareEstimate").classList.remove("loading");
    document.getElementById("fareEstimate").hidden = true;

}


async function updateFareEstimate() {

    if (!bookingPickupPlace || !bookingDropoffPlace) {
        resetFareEstimate();
        return;
    }

    if (!validateBookingWaypoints(false)) {
        resetFareEstimate("停靠點請從 Google 地址建議中選擇");
        return;
    }

    if (!BookingRouteClass) {
        resetFareEstimate("路線服務載入中，請稍候幾秒");
        return;
    }

    const requestNumber = ++fareRequestNumber;
    const estimateBox = document.getElementById("fareEstimate");
    const status = document.getElementById("fareEstimateStatus");

    currentFareEstimate = null;
    bookingRouteOptions = { FAST: null, SURFACE: null };
    estimateBox.hidden = false;
    estimateBox.classList.add("loading");
    status.textContent = "正在取得 Google 完整行程路線與預估時間…";

    try {
        const intermediateWaypoints = getActiveBookingWaypointPlaces()
            .map(function(place) {
                return { location: place };
            });

        const expectedLegCount = intermediateWaypoints.length + 1;
        const routeDepartureTime = new Date(Date.now() + 2 * 60 * 1000);

        const baseRequest = {
            origin: bookingPickupPlace,
            destination: bookingDropoffPlace,
            travelMode: "DRIVING",
            intermediates: intermediateWaypoints,
            optimizeWaypointOrder: false,
            routingPreference: "TRAFFIC_AWARE_OPTIMAL",
            departureTime: routeDepartureTime,
            fields: ["legs"]
        };

        const results = await Promise.all([
            BookingRouteClass.computeRoutes({
                ...baseRequest,
                routeModifiers: {
                    avoidHighways: false,
                    avoidTolls: false,
                    avoidFerries: true
                }
            }),
            BookingRouteClass.computeRoutes({
                ...baseRequest,
                routeModifiers: {
                    avoidHighways: true,
                    avoidTolls: true,
                    avoidFerries: true
                }
            })
        ]);

        if (requestNumber !== fareRequestNumber) return;

        const fastRoute = results[0].routes && results[0].routes[0];
        const surfaceRoute = results[1].routes && results[1].routes[0];

        if (!fastRoute || !surfaceRoute) {
            throw new Error("找不到可用路線");
        }

        const fastMetrics = summarizeBookingRoute(fastRoute, expectedLegCount);
        const surfaceMetrics = summarizeBookingRoute(surfaceRoute, expectedLegCount);
        const waypointData = getActiveBookingWaypointData();

        function makeEstimate(mode, metrics) {
            const distanceKm = metrics.distanceMeters / 1000;
            const minutes = Math.ceil(metrics.durationMillis / 60000);
            const fare = bookingService === "driver"
                ? calculateDriverFare(distanceKm, minutes)
                : calculateTaxiFare(distanceKm, minutes);

            return {
                routeMode: mode,
                routeName: mode === "FAST" ? "推薦快速路線" : "平面道路",
                routeStrategy: "WHOLE_TRIP",
                routePreference: mode === "FAST"
                    ? { avoidHighways: false, avoidTolls: false, avoidFerries: true }
                    : { avoidHighways: true, avoidTolls: true, avoidFerries: true },
                distanceKm: distanceKm,
                minutes: minutes,
                fare: fare,
                pickup: placeToAddressData(bookingPickupPlace),
                waypoints: waypointData,
                dropoff: placeToAddressData(bookingDropoffPlace)
            };
        }

        bookingRouteOptions = {
            FAST: makeEstimate("FAST", fastMetrics),
            SURFACE: makeEstimate("SURFACE", surfaceMetrics)
        };

        currentFareEstimate =
            bookingRouteOptions[selectedBookingRouteMode] ||
            bookingRouteOptions.FAST;

        renderBookingFareEstimate();

    } catch (error) {
        if (requestNumber !== fareRequestNumber) return;
        console.error("FARE ESTIMATE ERROR:", error);
        resetFareEstimate("目前無法取得路線，請重新選擇地址或稍後再試");
    } finally {
        if (requestNumber === fareRequestNumber) {
            estimateBox.classList.remove("loading");
        }
    }

}

/* ======================================================
   GOOGLE PLACES ADDRESS AUTOCOMPLETE
====================================================== */

async function initGoogle() {

    try {

        const {
            AutocompleteSuggestion,
            AutocompleteSessionToken
        } = await google.maps.importLibrary("places");

        const {
            Route
        } = await google.maps.importLibrary("routes");

        BookingRouteClass = Route;

        let searchCenter = {
            lat: 24.1477,
            lng: 120.6736
        };

        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                function (position) {
                    searchCenter = {
                        lat: position.coords.latitude,
                        lng: position.coords.longitude
                    };
                },
                function () {},
                {
                    enableHighAccuracy: false,
                    timeout: 5000,
                    maximumAge: 300000
                }
            );
        }

        function createAddressAutocomplete(config) {

            const container = document.getElementById(config.containerId);
            if (!container) return;

            container.className = "address-autocomplete";

            const input = document.createElement("input");
            input.type = "search";
            input.id = config.inputId;
            input.className = "address-input";
            input.placeholder = config.placeholder;
            input.setAttribute("aria-label", config.ariaLabel);
            input.setAttribute("autocomplete", "off");
            input.setAttribute("enterkeyhint", "search");
            input.required = config.required !== false;

            const searchIcon = document.createElement("span");
            searchIcon.className = "address-search-icon";
            searchIcon.setAttribute("aria-hidden", "true");
            searchIcon.textContent = "⌕";

            const clearButton = document.createElement("button");
            clearButton.type = "button";
            clearButton.className = "address-clear-btn";
            clearButton.setAttribute("aria-label", "清除地址");
            clearButton.textContent = "×";
            clearButton.hidden = true;

            const suggestions = document.createElement("div");
            suggestions.className = "address-suggestions";
            suggestions.setAttribute("role", "listbox");

            container.append(searchIcon, input, clearButton, suggestions);

            let sessionToken = new AutocompleteSessionToken();
            let debounceTimer = null;
            let requestNumber = 0;

            function hideSuggestions() {
                suggestions.classList.remove("show");
                suggestions.innerHTML = "";
            }

            function getPredictionText(prediction) {
                if (prediction.text && typeof prediction.text.toString === "function") {
                    return prediction.text.toString();
                }
                return "";
            }

            async function choosePrediction(prediction) {
                const fallbackText = getPredictionText(prediction);
                input.value = fallbackText;
                clearButton.hidden = !input.value;
                hideSuggestions();

                try {
                    const place = prediction.toPlace();
                    await place.fetchFields({
                        fields: ["id", "displayName", "formattedAddress", "location", "addressComponents"]
                    });

                    input.value = addressDisplayText(placeToAddressData(place)) || fallbackText ||
                        (place.displayName ? place.displayName.toString() : "");
                    clearButton.hidden = !input.value;

                    if (typeof config.onSelect === "function") {
                        config.onSelect(place);
                    }
                } catch (placeError) {
                    console.warn("PLACE DETAILS ERROR:", placeError);
                }

                sessionToken = new AutocompleteSessionToken();
                input.dispatchEvent(new Event("change", { bubbles: true }));
            }

            function renderSuggestions(items) {
                suggestions.innerHTML = "";

                if (!items.length) {
                    const empty = document.createElement("div");
                    empty.className = "address-no-results";
                    empty.textContent = "找不到相符地點，您仍可直接使用目前輸入的文字";
                    suggestions.appendChild(empty);
                    suggestions.classList.add("show");
                    return;
                }

                items.slice(0, 6).forEach(function (item) {
                    const prediction = item.placePrediction;
                    if (!prediction) return;

                    const row = document.createElement("button");
                    row.type = "button";
                    row.className = "address-suggestion";
                    row.setAttribute("role", "option");

                    const icon = document.createElement("span");
                    icon.className = "address-suggestion-icon";
                    icon.textContent = "📍";

                    const textBox = document.createElement("span");
                    const main = document.createElement("strong");
                    main.className = "address-suggestion-main";
                    main.textContent = prediction.mainText ?
                        prediction.mainText.toString() : getPredictionText(prediction);

                    const secondary = document.createElement("span");
                    secondary.className = "address-suggestion-secondary";
                    secondary.textContent = prediction.secondaryText ?
                        prediction.secondaryText.toString() : "";

                    textBox.append(main, secondary);
                    row.append(icon, textBox);

                    row.addEventListener("pointerdown", function (event) {
                        event.preventDefault();
                        choosePrediction(prediction);
                    });

                    suggestions.appendChild(row);
                });

                const attribution = document.createElement("div");
                attribution.className = "address-google-attribution";
                attribution.textContent = "Google Maps";
                suggestions.appendChild(attribution);
                suggestions.classList.add("show");
            }

            async function fetchSuggestions(query) {
                const currentRequest = ++requestNumber;

                try {
                    const response = await AutocompleteSuggestion.fetchAutocompleteSuggestions({
                        input: query,
                        includedRegionCodes: ["tw"],
                        language: "zh-TW",
                        region: "TW",
                        locationBias: {
                            center: searchCenter,
                            radius: 50000
                        },
                        origin: searchCenter,
                        sessionToken: sessionToken
                    });

                    if (currentRequest !== requestNumber) return;
                    renderSuggestions(response.suggestions || []);
                } catch (searchError) {
                    if (currentRequest !== requestNumber) return;
                    console.warn("ADDRESS SEARCH ERROR:", searchError);
                    hideSuggestions();
                }
            }

            input.addEventListener("input", function () {
                const query = input.value.trim();
                clearButton.hidden = !query;
                window.clearTimeout(debounceTimer);

                if (typeof config.onReset === "function") {
                    config.onReset();
                }

                if (!query) {
                    requestNumber++;
                    hideSuggestions();
                    return;
                }

                debounceTimer = window.setTimeout(function () {
                    fetchSuggestions(query);
                }, 220);
            });

            input.addEventListener("focus", function () {
                if (input.value.trim()) {
                    fetchSuggestions(input.value.trim());
                }
            });

            input.addEventListener("keydown", function (event) {
                if (event.key === "Escape") hideSuggestions();
            });

            clearButton.addEventListener("click", function () {
                requestNumber++;
                input.value = "";
                clearButton.hidden = true;
                hideSuggestions();
                if (typeof config.onReset === "function") {
                    config.onReset();
                }
                input.focus();
            });

            document.addEventListener("pointerdown", function (event) {
                if (!container.contains(event.target)) hideSuggestions();
            });
        }

        sharedAddressAutocompleteInitializer = function () {
            sharedAddresses.forEach(function (item, index) {
                const input = document.getElementById("sharedAddress" + index);
                const suggestions = document.getElementById("sharedAddressSuggestions" + index);

                if (!input || !suggestions || input.dataset.googleReady === "1") return;

                input.dataset.googleReady = "1";

                let sessionToken = new AutocompleteSessionToken();
                let debounceTimer = null;
                let requestNumber = 0;

                function hideSuggestions() {
                    suggestions.classList.remove("show");
                    suggestions.innerHTML = "";
                }

                function getPredictionText(prediction) {
                    if (prediction.text && typeof prediction.text.toString === "function") {
                        return prediction.text.toString();
                    }
                    return "";
                }

                async function choosePrediction(prediction) {
                    const fallbackText = getPredictionText(prediction);
                    input.value = fallbackText;
                    hideSuggestions();

                    try {
                        const place = prediction.toPlace();

                        await place.fetchFields({
                            fields: ["id", "displayName", "formattedAddress", "location", "addressComponents"]
                        });

                        const addressData = placeToAddressData(place, {
                            name: (document.getElementById("sharedName" + index)?.value || item.name || "").trim(),
                            address: place.formattedAddress || fallbackText,
                            pickupNote: (document.getElementById("sharedNote" + index)?.value || item.pickupNote || "").trim()
                        });

                        sharedAddresses[index] = normalizeAddressData(addressData, item);

                        input.value =
                            addressDisplayText(sharedAddresses[index]) ||
                            fallbackText ||
                            getPlaceDisplayName(place);

                    } catch (placeError) {
                        console.warn("SHARED ADDRESS PLACE DETAILS ERROR:", placeError);
                    }

                    sessionToken = new AutocompleteSessionToken();
                }

                function renderSuggestions(items) {
                    suggestions.innerHTML = "";

                    const predictions = (items || [])
                        .map(function (entry) { return entry.placePrediction; })
                        .filter(Boolean)
                        .slice(0, 6);

                    if (!predictions.length) {
                        const empty = document.createElement("div");
                        empty.className = "address-no-results";
                        empty.textContent = "找不到相符地點，請輸入更完整的名稱或地址";
                        suggestions.appendChild(empty);
                        suggestions.classList.add("show");
                        return;
                    }

                    predictions.forEach(function (prediction) {
                        const row = document.createElement("button");
                        row.type = "button";
                        row.className = "address-suggestion";
                        row.setAttribute("role", "option");

                        const icon = document.createElement("span");
                        icon.className = "address-suggestion-icon";
                        icon.textContent = "📍";

                        const textBox = document.createElement("span");

                        const main = document.createElement("strong");
                        main.className = "address-suggestion-main";
                        main.textContent = prediction.mainText
                            ? prediction.mainText.toString()
                            : getPredictionText(prediction);

                        const secondary = document.createElement("span");
                        secondary.className = "address-suggestion-secondary";
                        secondary.textContent = prediction.secondaryText
                            ? prediction.secondaryText.toString()
                            : "";

                        textBox.append(main, secondary);
                        row.append(icon, textBox);

                        row.addEventListener("pointerdown", function (event) {
                            event.preventDefault();
                            choosePrediction(prediction);
                        });

                        suggestions.appendChild(row);
                    });

                    const attribution = document.createElement("div");
                    attribution.className = "address-google-attribution";
                    attribution.textContent = "Google Maps";
                    suggestions.appendChild(attribution);
                    suggestions.classList.add("show");
                }

                async function fetchSuggestions(query) {
                    const currentRequest = ++requestNumber;

                    try {
                        const response = await AutocompleteSuggestion.fetchAutocompleteSuggestions({
                            input: query,
                            includedRegionCodes: ["tw"],
                            language: "zh-TW",
                            region: "TW",
                            locationBias: {
                                center: searchCenter,
                                radius: 50000
                            },
                            origin: searchCenter,
                            sessionToken: sessionToken
                        });

                        if (currentRequest !== requestNumber) return;
                        renderSuggestions(response.suggestions || []);

                    } catch (searchError) {
                        if (currentRequest !== requestNumber) return;
                        console.warn("SHARED ADDRESS SEARCH ERROR:", searchError);
                        hideSuggestions();
                    }
                }

                input.addEventListener("input", function () {
                    const query = input.value.trim();
                    window.clearTimeout(debounceTimer);

                    // As soon as the user edits the text, discard stale place metadata.
                    sharedAddresses[index] = normalizeAddressData({
                        ...sharedAddresses[index],
                        address: query,
                        displayName: "",
                        city: "",
                        district: "",
                        areaLabel: "",
                        placeId: "",
                        lat: null,
                        lng: null
                    });

                    if (!query) {
                        requestNumber++;
                        hideSuggestions();
                        return;
                    }

                    debounceTimer = window.setTimeout(function () {
                        fetchSuggestions(query);
                    }, 220);
                });

                input.addEventListener("focus", function () {
                    const query = input.value.trim();
                    if (query) fetchSuggestions(query);
                });

                input.addEventListener("keydown", function (event) {
                    if (event.key === "Escape") hideSuggestions();
                });

                document.addEventListener("pointerdown", function (event) {
                    if (!suggestions.parentElement.contains(event.target)) {
                        hideSuggestions();
                    }
                });
            });
        };

        createAddressAutocomplete({
            containerId: "pickupBox",
            inputId: "pickup",
            placeholder: "請輸入完整地址或地標名稱",
            ariaLabel: "上車地點",
            onSelect: function (place) {
                bookingPickupPlace = place;
                updateFareEstimate();
            },
            onReset: function () {
                bookingPickupPlace = null;
                resetFareEstimate();
            }
        });

        createAddressAutocomplete({
            containerId: "waypoint1Box",
            inputId: "waypoint1",
            placeholder: "請輸入停靠點 1 地址或地標名稱",
            ariaLabel: "停靠點 1",
            required: false,
            onSelect: function (place) {
                bookingWaypointPlaces[0] = place;
                bookingWaypointAddressData[0] = placeToAddressData(place);
                updateFareEstimate();
            },
            onReset: function () {
                bookingWaypointPlaces[0] = null;
                bookingWaypointAddressData[0] = null;
                resetFareEstimate();
            }
        });

        createAddressAutocomplete({
            containerId: "waypoint2Box",
            inputId: "waypoint2",
            placeholder: "請輸入停靠點 2 地址或地標名稱",
            ariaLabel: "停靠點 2",
            required: false,
            onSelect: function (place) {
                bookingWaypointPlaces[1] = place;
                bookingWaypointAddressData[1] = placeToAddressData(place);
                updateFareEstimate();
            },
            onReset: function () {
                bookingWaypointPlaces[1] = null;
                bookingWaypointAddressData[1] = null;
                resetFareEstimate();
            }
        });

        updateBookingWaypointUi();
        selectBookingRouteMode("FAST");

        createAddressAutocomplete({
            containerId: "dropoffBox",
            inputId: "dropoff",
            placeholder: "選填；可輸入地址或地標名稱",
            ariaLabel: "下車地點",
            required: false,
            onSelect: function (place) {
                bookingDropoffPlace = place;
                updateFareEstimate();
            },
            onReset: function () {
                bookingDropoffPlace = null;
                resetFareEstimate();
            }
        });

        renderSharedAddressChips();

    } catch (error) {
        console.error("GOOGLE PLACES LOAD ERROR:", error);

        [
            ["pickupBox", "pickup", "上車地點", true],
            ["dropoffBox", "dropoff", "下車地點", false]
        ].forEach(function (item) {
            const container = document.getElementById(item[0]);
            if (!container || document.getElementById(item[1])) return;
            const input = document.createElement("input");
            input.type = "text";
            input.id = item[1];
            input.placeholder = item[3]
                ? "請輸入完整地址或地標名稱"
                : "選填；可輸入地址或地標名稱";
            input.setAttribute("aria-label", item[2]);
            input.required = item[3];
            container.appendChild(input);
        });
    }
}
