<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1:1 專屬叫車 - 線上預約系統</title>
    <style>
        :root {
            --primary-color: #06C755; /* LINE 招牌綠色 */
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-color: #333333;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background-color: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            padding: 30px;
            width: 100%;
            max-width: 480px;
            box-sizing: border-box;
        }
        h2 {
            text-align: center;
            color: #222;
            margin-bottom: 5px;
            font-size: 24px;
        }
        .subtitle {
            text-align: center;
            color: #666;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .input-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            font-size: 15px;
        }
        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
            transition: border 0.2s;
            background-color: #fff;
        }
        input:focus, select:focus {
            border-color: var(--primary-color);
        }
        .row {
            display: flex;
            gap: 10px;
        }
        .row .input-group {
            flex: 1;
        }
        .line-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            background-color: var(--primary-color);
            color: white;
            text-decoration: none;
            padding: 15px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            box-sizing: border-box;
            transition: opacity 0.2s;
            box-shadow: 0 4px 10px rgba(6, 199, 85, 0.3);
            margin-top: 10px;
        }
        .line-btn:hover {
            opacity: 0.9;
        }
        .notice {
            font-size: 12px;
            color: #888;
            margin-top: 15px;
            text-align: center;
            line-height: 1.5;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🚕 預約專屬接送</h2>
    <div class="subtitle">填寫預約資料，自動帶入文字至 LINE 聊天室</div>
    
    <form id="bookingForm">
        <div class="row">
            <div class="input-group">
                <label for="bookDate">預約日期</label>
                <input type="date" id="bookDate" required>
            </div>
            <div class="input-group">
                <label for="bookTime">預約時間</label>
                <input type="time" id="bookTime" required>
            </div>
        </div>

        <div class="row">
            <div class="input-group">
                <label for="passengerCount">乘車人數</label>
                <select id="passengerCount">
                    <option value="1人">1 人</option>
                    <option value="2人">2 人</option>
                    <option value="3人">3 人</option>
                    <option value="4人" selected>4 人</option>
                    <option value="5人以上">5 人以上</option>
                </select>
            </div>
            <div class="input-group">
                <label for="luggageCount">行李件數</label>
                <select id="luggageCount">
                    <option value="無行李">無行李</option>
                    <option value="1-2件大行李">1-2 件大行李</option>
                    <option value="3-4件大行李">3-4 件大行李</option>
                    <option value="5件以上">5 件以上</option>
                </select>
            </div>
        </div>

        <div class="input-group">
            <label for="pickup">📍 上車地點 (起點)</label>
            <input type="text" id="pickup" placeholder="請輸入完整地址或地標名稱" required>
        </div>

        <div class="input-group">
            <label for="dropoff">🏁 下車地點 (終點)</label>
            <input type="text" id="dropoff" placeholder="請輸入完整地址或地標名稱" required>
        </div>

        <div class="input-group">
            <label for="memo">💡 特殊需求備註 (選填)</label>
            <input type="text" id="memo" placeholder="例如：需兒童安全座椅、有寵物...">
        </div>

        <button type="button" class="line-btn" onclick="directToLineText()">
            🟢 一鍵傳送預約文字至 LINE 客服
        </button>
    </form>

    <div class="notice">
        ※ 點擊後會直接開啟 LINE 並為您填好預約單，請在對話框內直接按下「傳送」按鈕即可送出！
    </div>
</div>

<script>
    document.getElementById('bookDate').valueAsDate = new Date();

    function directToLineText() {
        const bookDate = document.getElementById('bookDate').value;
        const bookTime = document.getElementById('bookTime').value;
        const passengerCount = document.getElementById('passengerCount').value;
        const luggageCount = document.getElementById('luggageCount').value;
        const pickup = document.getElementById('pickup').value;
        const dropoff = document.getElementById('dropoff').value;
        const memo = document.getElementById('memo').value || "無";

        if (!bookDate || !bookTime || !pickup || !dropoff) {
            alert('請完整填寫預約日期、時間與上下車地點！');
            return;
        }

        // 🟢 已修正：改用反單引號 (`) 包裹多行字串，解決語法崩潰問題
        const message = `✨【收到新的叫車預約】✨
📅 預約日期：${bookDate}
🕒 預約時間：${bookTime}
👥 乘車人數：${passengerCount}
🧳 行李件數：${luggageCount}
📍 上車地點：${pickup}
🏁 下車地點：${dropoff}
💡 備註需求：${memo}`;

        // 🟢 已修正：LINE 官方帳號必須加上 @ 符號
        const lineId = "@tsv9789p"; 
        const encodedMessage = encodeURIComponent(message);
        
        // 🟢 已修正：補上標準的官方帳號跳轉路徑 /R/oaMessage/
        const lineUrl = `https://line.me{lineId}/?${encodedMessage}`;
        
        window.location.href = lineUrl;
    }
</script>
</body>
</html>
