<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TOP Taxi｜預約叫車</title>

<!-- LINE LIFF SDK -->
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

<style>
:root {
    --line-green: #06C755;
    --bg: #f5f6f8;
    --card: #ffffff;
    --text: #222222;
    --muted: #777777;
    --border: #dddddd;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 18px;
    min-height: 100vh;
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        "Noto Sans TC", Arial, sans-serif;
    color: var(--text);
}

.container {
    width: 100%;
    max-width: 520px;
    margin: 0 auto;
    background: var(--card);
    border-radius: 18px;
    padding: 26px 20px;
    box-shadow: 0 5px 24px rgba(0,0,0,.08);
}

.logo-title {
    text-align: center;
    margin-bottom: 24px;
}

.logo-title h1 {
    margin: 0 0 8px;
    font-size: 25px;
}

.logo-title p {
    margin: 0;
    color: var(--muted);
    font-size: 14px;
    line-height: 1.6;
}

.line-user {
    display: none;
    margin-bottom: 20px;
    padding: 12px 14px;
    border-radius: 10px;
    background: #f1fff6;
    color: #087d39;
    font-size: 14px;
}

.row {
    display: flex;
    gap: 12px;
}

.input-group {
    flex: 1;
    margin-bottom: 18px;
}

label {
    display: block;
    margin-bottom: 7px;
    font-size: 15px;
    font-weight: 700;
}

input,
select {
    width: 100%;
    min-height: 46px;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 9px;
    background: #fff;
    font-size: 16px;
    outline: none;
}

input:focus,
select:focus {
    border-color: var(--line-green);
    box-shadow: 0 0 0 2px rgba(6,199,85,.08);
}

.submit-btn {
    width: 100%;
    border: none;
    border-radius: 10px;
    background: var(--line-green);
    color: #fff;
    min-height: 52px;
    font-size: 17px;
    font-weight: 800;
    cursor: pointer;
    margin-top: 4px;
}

.submit-btn:disabled {
    opacity: .55;
    cursor: not-allowed;
}

.notice {
    margin-top: 15px;
    text-align: center;
    color: var(--muted);
    font-size: 12px;
    line-height: 1.7;
}

.status {
    display: none;
    margin-top: 18px;
    padding: 14px;
    border-radius: 10px;
    text-align: center;
    font-size: 14px;
    line-height: 1.6;
}

.status.success {
    display: block;
    background: #effff4;
    color: #087d39;
}

.status.error {
    display: block;
    background: #fff1f1;
    color: #bb2525;
}

@media (max-width: 520px) {
    body {
        padding: 12px;
    }

    .container {
        padding: 22px 17px;
    }

    .row {
        flex-direction: column;
        gap: 0;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="logo-title">
        <h1>🚕 TOP Taxi 預約叫車</h1>
        <p>
            24H 多元叫車服務<br>
            填寫完成後，預約內容將直接傳送給客服
        </p>
    </div>

    <div id="lineUser" class="line-user"></div>

    <form id="bookingForm">

        <div class="row">

            <div class="input-group">
                <label for="bookDate">📅 預約日期</label>
                <input
                    type="date"
                    id="bookDate"
                    required
                >
            </div>

            <div class="input-group">
                <label for="bookTime">⏰ 預約時間</label>
                <input
                    type="time"
                    id="bookTime"
                    required
                >
            </div>

        </div>


        <div class="row">

            <div class="input-group">
                <label for="passengerCount">👥 乘車人數</label>

                <select id="passengerCount">
                    <option value="1人" selected>1 人</option>
                    <option value="2人">2 人</option>
                    <option value="3人">3 人</option>
                    <option value="4人">4 人</option>
                    <option value="5人以上">5 人以上</option>
                </select>
            </div>


            <div class="input-group">
                <label for="luggageCount">🧳 行李件數</label>

                <select id="luggageCount">
                    <option value="無行李" selected>無行李</option>
                    <option value="1-2件大行李">1-2 件大行李</option>
                    <option value="3-4件大行李">3-4 件大行李</option>
                    <option value="5件以上">5 件以上</option>
                </select>
            </div>

        </div>


        <div class="input-group">
            <label for="pickup">📍 上車地點</label>

            <input
                type="text"
                id="pickup"
                placeholder="請輸入完整地址或地標名稱"
                required
            >
        </div>


        <div class="input-group">
            <label for="dropoff">🏁 下車地點</label>

            <input
                type="text"
                id="dropoff"
                placeholder="請輸入完整地址或地標名稱"
                required
            >
        </div>


        <div class="input-group">
            <label for="memo">💡 特殊需求備註（選填）</label>

            <input
                type="text"
                id="memo"
                placeholder="例如：兒童安全座椅、寵物、輪椅..."
            >
        </div>


        <button
            type="button"
            id="submitBtn"
            class="submit-btn"
            onclick="sendBooking()"
        >
            🚕 確認送出預約
        </button>

    </form>


    <div class="notice">
        ※ 送出後資料會同步建立於 TOP Taxi 預約系統。<br>
        ※ 預約是否成立，仍以客服最終確認為準。
    </div>

    <div id="statusBox" class="status"></div>

</div>


<script>

/* ============================================
   TOP Taxi LIFF
============================================ */

const LIFF_ID = "2011008197-NjjrAoUX";


/* ============================================
   n8n Production Webhook
============================================ */

const WEBHOOK_URL =
"https://lakswitting.app.n8n.cloud/webhook/96798dda-c12a-4552-bcaa-e51a1166a1a8";


let lineDisplayName = "";
let lineUserId = "";


/* ============================================
   初始化 LIFF
============================================ */

async function initializeLiff() {

    try {

        await liff.init({
            liffId: LIFF_ID
        });


        /*
        如果不是從 LINE 內開啟，
        先進行 LINE Login
        */

        if (!liff.isLoggedIn()) {

            liff.login();

            return;
        }


        /*
        取得 LINE 使用者名稱
        */

        try {

            const profile =
                await liff.getProfile();

            lineDisplayName =
                profile.displayName || "";

            lineUserId =
                profile.userId || "";


            if (lineDisplayName) {

                const userBox =
                    document.getElementById("lineUser");

                userBox.textContent =
                    "LINE 使用者：" + lineDisplayName;

                userBox.style.display =
                    "block";
            }

        } catch (profileError) {

            console.log(
                "無法取得 LINE Profile",
                profileError
            );
        }


    } catch (error) {

        console.error(
            "LIFF 初始化失敗",
            error
        );

        showStatus(
            "LINE 系統初始化失敗，請重新從 TOP Taxi 官方帳號開啟預約頁。",
            "error"
        );
    }
}


/* ============================================
   日期設定
============================================ */

const dateInput =
    document.getElementById("bookDate");

const timeInput =
    document.getElementById("bookTime");


function getLocalDateString() {

    const now = new Date();

    const year =
        now.getFullYear();

    const month =
        String(
            now.getMonth() + 1
        ).padStart(2, "0");

    const day =
        String(
            now.getDate()
        ).padStart(2, "0");

    return `${year}-${month}-${day}`;
}


dateInput.value =
    getLocalDateString();

dateInput.min =
    getLocalDateString();


/* ============================================
   檢查日期時間
============================================ */

function validateBookingTime() {

    if (
        !dateInput.value ||
        !timeInput.value
    ) {
        return true;
    }


    const selected =
        new Date(
            `${dateInput.value}T${timeInput.value}`
        );


    const now =
        new Date();


    if (selected < now) {

        alert(
            "預約時間不能早於目前時間。"
        );

        return false;
    }


    return true;
}


/* ============================================
   顯示狀態
============================================ */

function showStatus(message, type) {

    const box =
        document.getElementById("statusBox");

    box.textContent =
        message;

    box.className =
        "status " + type;
}


/* ============================================
   送出預約
============================================ */

async function sendBooking() {

    const submitBtn =
        document.getElementById("submitBtn");


    const bookDate =
        dateInput.value;

    const bookTime =
        timeInput.value;

    const passengerCount =
        document.getElementById(
            "passengerCount"
        ).value;

    const luggageCount =
        document.getElementById(
            "luggageCount"
        ).value;

    const pickup =
        document.getElementById(
            "pickup"
        ).value.trim();

    const dropoff =
        document.getElementById(
            "dropoff"
        ).value.trim();

    const memo =
        document.getElementById(
            "memo"
        ).value.trim() || "無";


    /*
    必填檢查
    */

    if (
        !bookDate ||
        !bookTime ||
        !pickup ||
        !dropoff
    ) {

        alert(
            "請完整填寫日期、時間、上車地點與下車地點。"
        );

        return;
    }


    if (!validateBookingTime()) {
        return;
    }


    submitBtn.disabled =
        true;

    submitBtn.textContent =
        "⏳ 預約送出中...";


    /*
    要寫進 n8n / Google Sheets 的資料
    */

    const bookingData = {

        source:
            "TOP Taxi LIFF Booking",

        lineDisplayName:
            lineDisplayName,

        lineUserId:
            lineUserId,

        bookDate:
            bookDate,

        bookTime:
            bookTime,

        passengerCount:
            passengerCount,

        luggageCount:
            luggageCount,

        pickup:
            pickup,

        dropoff:
            dropoff,

        memo:
            memo,

        submittedAt:
            new Date().toISOString()
    };


    /*
    客人在 LINE 裡送出的訊息
    */

    const lineMessage =
`🚕 TOP Taxi 預約叫車

📅 預約日期：${bookDate}
⏰ 預約時間：${bookTime}

👥 乘車人數：${passengerCount}
🧳 行李件數：${luggageCount}

📍 上車地點：
${pickup}

🏁 下車地點：
${dropoff}

💡 特殊需求：
${memo}

請客服協助確認此筆預約，謝謝！`;


    try {

        /*
        第一步：
        送進 n8n
        */

        const response =
            await fetch(
                WEBHOOK_URL,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify(
                            bookingData
                        )
                }
            );


        if (!response.ok) {

            throw new Error(
                "n8n HTTP " +
                response.status
            );
        }


        /*
        第二步：
        由客人的 LINE 送出預約訊息
        */

        if (liff.isInClient()) {

            await liff.sendMessages([
                {
                    type: "text",
                    text: lineMessage
                }
            ]);

        } else {

            /*
            如果不是在 LINE App 裡開啟，
            無法使用 sendMessages
            */

            throw new Error(
                "NOT_IN_LINE_CLIENT"
            );
        }


        /*
        成功
        */

        showStatus(
            "✅ 預約已成功送出，客服將盡快為您確認。",
            "success"
        );


        submitBtn.textContent =
            "✅ 預約已送出";


        /*
        稍等一下後關閉 LIFF
        */

        setTimeout(() => {

            if (liff.isInClient()) {

                liff.closeWindow();
            }

        }, 1600);


    } catch (error) {

        console.error(
            "預約送出錯誤",
            error
        );


        if (
            error.message ===
            "NOT_IN_LINE_CLIENT"
        ) {

            showStatus(
                "預約資料已建立，但目前不是從 LINE 內開啟。請從 TOP Taxi 官方帳號的「預約叫車」按鈕進入。",
                "error"
            );

        } else {

            showStatus(
                "預約送出失敗，請稍後再試或直接聯絡客服。",
                "error"
            );
        }


        submitBtn.disabled =
            false;

        submitBtn.textContent =
            "🚕 確認送出預約";
    }
}


/* ============================================
   啟動
============================================ */

initializeLiff();

</script>

</body>
</html>
