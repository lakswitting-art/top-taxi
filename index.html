<!DOCTYPE html>
<html lang="zh-TW">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>TOP Taxi｜24H 預約系統</title>

<!-- LINE LIFF SDK -->
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

<style>

:root{
    --red:#ff1f2d;
    --red-dark:#c90012;
    --black:#0b0b0d;
    --black-soft:#17171b;
    --white:#ffffff;
    --gray:#8d8d94;
    --light:#f4f5f7;
    --border:#e1e1e5;
    --green:#06C755;
}

*{
    box-sizing:border-box;
}

html{
    background:#0a0a0c;
}

body{
    margin:0;
    min-height:100vh;

    font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    "Noto Sans TC",
    Arial,
    sans-serif;

    background:
    radial-gradient(circle at top, rgba(255,31,45,.18), transparent 32%),
    linear-gradient(180deg,#08080a 0%,#111116 42%,#f3f4f6 42%);

    color:#222;
}


/* =========================
   HERO
========================= */

.hero{
    padding:
    max(30px, env(safe-area-inset-top))
    20px
    35px;

    text-align:center;
    color:white;
}

.logo{
    width:110px;
    height:110px;

    object-fit:cover;

    border-radius:24px;

    border:1px solid rgba(255,255,255,.12);

    box-shadow:
    0 0 0 1px rgba(255,31,45,.35),
    0 12px 38px rgba(255,0,30,.25);

    margin-bottom:18px;
}

.brand{
    font-size:30px;
    font-weight:900;
    letter-spacing:.5px;
    margin:0;
}

.brand span{
    color:var(--red);
}

.system-title{
    margin-top:4px;

    font-size:19px;
    font-weight:700;

    letter-spacing:2px;

    color:#eee;
}

.hero-subtitle{
    font-size:13px;
    color:#aaa;

    margin-top:12px;

    line-height:1.7;
}


/* =========================
   MAIN CARD
========================= */

.wrapper{
    max-width:560px;

    margin:-10px auto 0;

    padding:
    0 14px
    max(30px,env(safe-area-inset-bottom));
}

.card{
    background:white;

    border-radius:26px;

    padding:25px 20px 24px;

    box-shadow:
    0 18px 50px rgba(0,0,0,.18);
}


/* =========================
   LINE USER
========================= */

.line-user{
    display:none;

    align-items:center;

    background:#f2fff6;

    border:1px solid #c9f4d8;

    border-radius:13px;

    padding:11px 13px;

    margin-bottom:20px;

    font-size:14px;

    color:#117d3d;
}


/* =========================
   INPUTS
========================= */

.section-title{
    font-size:13px;

    color:#999;

    margin-bottom:16px;

    letter-spacing:1px;
}


.row{
    display:flex;
    gap:12px;
}

.input-group{
    flex:1;
    margin-bottom:19px;
}

label{
    display:block;

    margin-bottom:8px;

    font-size:15px;

    font-weight:800;

    color:#222;
}

input,
select{
    width:100%;

    height:50px;

    border:1px solid var(--border);

    border-radius:12px;

    padding:0 13px;

    font-size:16px;

    color:#222;

    background:#fafafa;

    outline:none;

    transition:.18s;
}

input:focus,
select:focus{
    border-color:var(--red);

    background:white;

    box-shadow:
    0 0 0 3px rgba(255,31,45,.08);
}

input::placeholder{
    color:#b0b0b5;
}


/* =========================
   BUTTON
========================= */

.submit-btn{
    position:relative;

    width:100%;

    min-height:58px;

    border:0;

    border-radius:15px;

    margin-top:5px;

    background:
    linear-gradient(
        135deg,
        #ff2a38,
        #e00018
    );

    color:white;

    font-size:17px;

    font-weight:900;

    letter-spacing:.4px;

    cursor:pointer;

    box-shadow:
    0 10px 24px rgba(225,0,25,.25);

    transition:
    transform .12s,
    opacity .12s;
}

.submit-btn:active{
    transform:scale(.985);
}

.submit-btn:disabled{
    opacity:.55;
}


/* =========================
   INFO
========================= */

.notice{
    margin-top:17px;

    text-align:center;

    color:#999;

    font-size:12px;

    line-height:1.8;
}


/* =========================
   STATUS
========================= */

.status{
    display:none;

    margin-top:18px;

    padding:15px;

    border-radius:13px;

    text-align:center;

    font-size:14px;

    line-height:1.6;
}

.status.success{
    display:block;

    background:#effff4;

    color:#087d39;

    border:1px solid #c7f1d4;
}

.status.error{
    display:block;

    background:#fff0f1;

    color:#bc2632;

    border:1px solid #ffd1d5;
}


/* =========================
   LOADING
========================= */

.spinner{
    display:inline-block;

    width:17px;
    height:17px;

    border:2px solid rgba(255,255,255,.35);

    border-top-color:#fff;

    border-radius:50%;

    vertical-align:-3px;

    margin-right:7px;

    animation:spin .75s linear infinite;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}


/* =========================
   MOBILE
========================= */

@media(max-width:520px){

    .hero{
        padding-bottom:26px;
    }

    .logo{
        width:90px;
        height:90px;

        border-radius:20px;
    }

    .brand{
        font-size:27px;
    }

    .system-title{
        font-size:17px;
    }

    .card{
        border-radius:23px;

        padding:
        23px 17px
        22px;
    }

    .row{
        gap:9px;
    }
}

</style>

</head>


<body>


<!-- =========================
     TOP
========================= -->

<header class="hero">

    <img
        src="logo.png"
        class="logo"
        alt="TOP Taxi Logo"
    >

    <h1 class="brand">
        <span>TOP</span> Taxi
    </h1>

    <div class="system-title">
        24H 預約系統
    </div>

    <div class="hero-subtitle">
        即時叫車・預約接送・機場接送・包車服務
    </div>

</header>


<!-- =========================
     FORM
========================= -->

<main class="wrapper">

<div class="card">

    <div
        id="lineUser"
        class="line-user"
    ></div>


    <div class="section-title">
        BOOKING INFORMATION
    </div>


    <form id="bookingForm">


        <div class="row">

            <div class="input-group">

                <label for="bookDate">
                    📅 預約日期
                </label>

                <input
                    type="date"
                    id="bookDate"
                    required
                >

            </div>


            <div class="input-group">

                <label for="bookTime">
                    ⏰ 預約時間
                </label>

                <input
                    type="time"
                    id="bookTime"
                    required
                >

            </div>

        </div>


        <div class="row">

            <div class="input-group">

                <label for="passengerCount">
                    👥 乘車人數
                </label>

                <select id="passengerCount">

                    <option
                        value="1人"
                        selected
                    >
                        1 人
                    </option>

                    <option value="2人">
                        2 人
                    </option>

                    <option value="3人">
                        3 人
                    </option>

                    <option value="4人">
                        4 人
                    </option>

                    <option value="5人以上">
                        5 人以上
                    </option>

                </select>

            </div>


            <div class="input-group">

                <label for="luggageCount">
                    🧳 行李件數
                </label>

                <select id="luggageCount">

                    <option
                        value="無行李"
                        selected
                    >
                        無行李
                    </option>

                    <option value="1-2件大行李">
                        1-2 件大行李
                    </option>

                    <option value="3-4件大行李">
                        3-4 件大行李
                    </option>

                    <option value="5件以上">
                        5 件以上
                    </option>

                </select>

            </div>

        </div>


        <div class="input-group">

            <label for="pickup">
                📍 上車地點
            </label>

            <input
                type="text"
                id="pickup"
                placeholder="請輸入完整地址或地標名稱"
                required
            >

        </div>


        <div class="input-group">

            <label for="dropoff">
                🏁 下車地點
            </label>

            <input
                type="text"
                id="dropoff"
                placeholder="請輸入完整地址或地標名稱"
                required
            >

        </div>


        <div class="input-group">

            <label for="memo">
                💡 特殊需求備註（選填）
            </label>

            <input
                type="text"
                id="memo"
                placeholder="兒童安全座椅、寵物、輪椅..."
            >

        </div>


        <button
            type="button"
            id="submitBtn"
            class="submit-btn"
            onclick="sendBooking()"
        >
            🚕 確認送出預約
        </button>


    </form>


    <div class="notice">

        ※ 訂單送出後將直接傳送至 TOP Taxi 客服。<br>

        ※ 預約是否成立，仍以客服最終確認為準。

    </div>


    <div
        id="statusBox"
        class="status"
    ></div>


</div>

</main>



<script>

/* =====================================================
   TOP Taxi Configuration
===================================================== */

const LIFF_ID =
"2011008197-NjirAoUX";


const WEBHOOK_URL =
"https://lakswitting.app.n8n.cloud/webhook/96798dda-c12a-4552-bcaa-e51a1166a1a8";


let lineDisplayName = "";

let lineUserId = "";

let liffReady = false;



/* =====================================================
   STATUS
===================================================== */

function showStatus(
    message,
    type
){

    const box =
        document.getElementById(
            "statusBox"
        );

    box.innerHTML =
        message;

    box.className =
        "status " + type;

}



/* =====================================================
   DATE
===================================================== */

const dateInput =
    document.getElementById(
        "bookDate"
    );


const timeInput =
    document.getElementById(
        "bookTime"
    );


function getLocalDateString(){

    const now =
        new Date();


    const yyyy =
        now.getFullYear();


    const mm =
        String(
            now.getMonth()+1
        ).padStart(
            2,
            "0"
        );


    const dd =
        String(
            now.getDate()
        ).padStart(
            2,
            "0"
        );


    return `${yyyy}-${mm}-${dd}`;

}


const today =
    getLocalDateString();


dateInput.value =
    today;


dateInput.min =
    today;



/* =====================================================
   LIFF INITIALIZE
===================================================== */

async function initializeLiff(){

    try{

        await liff.init({

            liffId:
                LIFF_ID

        });


        liffReady =
            true;


        if(
            !liff.isLoggedIn()
        ){

            liff.login();

            return;
        }


        try{

            const profile =
                await liff.getProfile();


            lineDisplayName =
                profile.displayName || "";


            lineUserId =
                profile.userId || "";


            if(
                lineDisplayName
            ){

                const box =
                    document.getElementById(
                        "lineUser"
                    );


                box.innerHTML =
                    "✅ 已登入 LINE：<strong>" +
                    escapeHtml(
                        lineDisplayName
                    ) +
                    "</strong>";


                box.style.display =
                    "flex";

            }

        }catch(profileError){

            console.warn(
                "Profile error",
                profileError
            );

        }


    }catch(error){

        console.error(
            "LIFF initialization error:",
            error
        );


        showStatus(

            "LINE 系統初始化失敗。<br>請重新從 TOP Taxi 官方帳號的「預約叫車」開啟。",

            "error"

        );

    }

}



/* =====================================================
   VALIDATION
===================================================== */

function validateBookingTime(){

    if(
        !dateInput.value ||
        !timeInput.value
    ){

        return true;

    }


    const selected =
        new Date(

            `${dateInput.value}T${timeInput.value}`

        );


    const now =
        new Date();


    if(
        selected < now
    ){

        alert(
            "預約時間不能早於目前時間。"
        );


        return false;

    }


    return true;

}



/* =====================================================
   HTML ESCAPE
===================================================== */

function escapeHtml(text){

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        text;


    return div.innerHTML;

}



/* =====================================================
   BOOKING
===================================================== */

async function sendBooking(){

    const button =
        document.getElementById(
            "submitBtn"
        );


    const bookDate =
        dateInput.value;


    const bookTime =
        timeInput.value;


    const passengerCount =
        document.getElementById(
            "passengerCount"
        ).value;


    const luggageCount =
        document.getElementById(
            "luggageCount"
        ).value;


    const pickup =
        document.getElementById(
            "pickup"
        ).value.trim();


    const dropoff =
        document.getElementById(
            "dropoff"
        ).value.trim();


    const memo =
        document.getElementById(
            "memo"
        ).value.trim()
        || "無";



    /* 必填 */

    if(
        !bookDate ||
        !bookTime ||
        !pickup ||
        !dropoff
    ){

        alert(
            "請完整填寫預約日期、時間、上車地點與下車地點。"
        );


        return;

    }



    if(
        !validateBookingTime()
    ){

        return;

    }



    if(
        !liffReady
    ){

        showStatus(

            "LINE 尚未完成連線，請稍候幾秒再試一次。",

            "error"

        );


        return;

    }



    button.disabled =
        true;


    button.innerHTML =
        '<span class="spinner"></span>正在送出預約';



    /* =================================================
       訂單訊息
    ================================================= */

    const lineMessage =
`🚕 TOP Taxi｜24H 預約

📅 日期：${bookDate}
⏰ 時間：${bookTime}

👥 乘車人數：${passengerCount}
🧳 行李：${luggageCount}

📍 上車地點
${pickup}

🏁 下車地點
${dropoff}

💡 特殊需求
${memo}

━━━━━━━━━━━━━━
請客服協助確認此筆預約，謝謝。`;



    const bookingData = {

        source:
            "TOP Taxi LIFF Booking",

        lineDisplayName:
            lineDisplayName,

        lineUserId:
            lineUserId,

        bookDate:
            bookDate,

        bookTime:
            bookTime,

        passengerCount:
            passengerCount,

        luggageCount:
            luggageCount,

        pickup:
            pickup,

        dropoff:
            dropoff,

        memo:
            memo,

        submittedAt:
            new Date().toISOString()

    };



    try{


        /* =============================================
           1. LINE 傳送訂單
        ============================================= */

        if(
            !liff.isInClient()
        ){

            throw new Error(
                "NOT_IN_LINE_CLIENT"
            );

        }


        await liff.sendMessages([

            {

                type:
                    "text",

                text:
                    lineMessage

            }

        ]);



        /* =============================================
           2. n8n / Google Sheets
        ============================================= */

        try{

            const response =
                await fetch(

                    WEBHOOK_URL,

                    {

                        method:
                            "POST",

                        headers:{

                            "Content-Type":
                                "application/json"

                        },

                        body:
                            JSON.stringify(
                                bookingData
                            )

                    }

                );


            if(
                !response.ok
            ){

                console.warn(
                    "n8n response:",
                    response.status
                );

            }


        }catch(n8nError){

            /*
            LINE 訂單已經送出，
            即使 Sheets 暫時失敗，
            不要讓客人重新送第二筆。
            */

            console.error(
                "n8n error:",
                n8nError
            );

        }



        /* =============================================
           SUCCESS
        ============================================= */

        button.innerHTML =
            "✅ 預約已送出";


        showStatus(

            "✅ 預約資料已成功傳送給客服。<br>請等待客服確認您的訂單。",

            "success"

        );



        setTimeout(
            function(){

                if(
                    liff.isInClient()
                ){

                    liff.closeWindow();

                }

            },

            1800

        );



    }catch(error){


        console.error(
            "Booking error:",
            error
        );


        if(
            error.message ===
            "NOT_IN_LINE_CLIENT"
        ){

            showStatus(

                "請從 TOP Taxi LINE 官方帳號的「預約叫車」進入本頁，再送出預約。",

                "error"

            );

        }else{

            showStatus(

                "預約送出失敗，請稍後再試或直接聯絡 TOP Taxi 客服。",

                "error"

            );

        }



        button.disabled =
            false;


        button.innerHTML =
            "🚕 確認送出預約";

    }

}



/* =====================================================
   START
===================================================== */

initializeLiff();

</script>


</body>

</html>
