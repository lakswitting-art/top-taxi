<!doctype html><html lang="zh-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>調度車資試算｜地址修正版</title></head><body><div style="padding:24px;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;color:#666">調度車資試算載入中…</div><script>
(async()=>{
  const r=await fetch('./fare-public.html?v=20260901-address-base',{cache:'no-store'});
  if(!r.ok)throw new Error('fare-public base load failed: '+r.status);
  let s=await r.text();

  // Preserve the exact Google suggestion selected by the dispatcher.
  s=s.replace(
    "function data(p){if(!p)return null;const q=p.location,lat=q?(typeof q.lat==='function'?q.lat():q.lat):null,lng=q?(typeof q.lng==='function'?q.lng():q.lng):null;return{name:clean(nameOf(p)),address:tidyAddr(p.formattedAddress||''),lat,lng}}",
    "function data(p){if(!p)return null;const q=p.location,lat=q?(typeof q.lat==='function'?q.lat():q.lat):null,lng=q?(typeof q.lng==='function'?q.lng():q.lng):null,selected=clean(p?.__topTaxiSelectedText||''),formatted=tidyAddr(p.formattedAddress||''),z=area(formatted),exact=/(?:路|街|大道|段|巷|弄).*?\\d+(?:-\\d+|之\\d+)?號/u.test(tidyAddr(selected)),address=exact?tidyAddr(`${z.c}${z.d}${selected}`):formatted;return{name:selected||clean(nameOf(p)),address,lat,lng,selectedText:selected}}"
  );

  // Never reverse-geocode a manually selected Place into a different nearby door number.
  s=s.replace(
    "const base=data(pl);cache.set(pl,base);if(!base||street(base.address)||base.lat==null)return base;try{",
    "const base=data(pl);cache.set(pl,base);if(!base||street(base.address)||base.selectedText||base.lat==null)return base;try{"
  );

  // The input field shows exactly the prediction row that was tapped.
  s=s.replace(
    "await pl.fetchFields({fields:['id','displayName','formattedAddress','location']});i.value=showData(data(pl))||txt(pr.text);cl.hidden=false;token=new Token;hide();select(pl);enrich(pl);return true",
    "await pl.fetchFields({fields:['id','displayName','formattedAddress','location']});const selectedMain=txt(pr.mainText)||txt(pr.text)||'';try{pl.__topTaxiSelectedText=selectedMain}catch(e){}const picked=data(pl);cache.set(pl,picked);i.value=selectedMain||showData(picked)||txt(pr.text);cl.hidden=false;token=new Token;hide();select(pl);enrich(pl);return true"
  );

  // Paste must not blindly accept prediction #1 when the typed door number differs.
  s=s.replace(
    "return first?choose(ps[0]):(render(ps),false)",
    "if(!first){render(ps);return false}const typedNo=(tidyAddr(q).match(/(\\d+(?:-\\d+|之\\d+)?)號/u)||[])[1]||'';const firstText=tidyAddr(txt(ps[0]?.mainText)||txt(ps[0]?.text)||'');const firstNo=(firstText.match(/(\\d+(?:-\\d+|之\\d+)?)號/u)||[])[1]||'';if(typedNo&&typedNo!==firstNo){render(ps);return false}return choose(ps[0])"
  );

  if(!s.includes('__topTaxiSelectedText'))throw new Error('dispatch address patch anchor mismatch');
  document.open();document.write(s);document.close();
})().catch(e=>{console.error(e);document.body.innerHTML='<div style="padding:24px;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;color:#b91c1c">地址修正版載入失敗：'+String(e?.message||e)+'</div>'});
</script></body></html>
