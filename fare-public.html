<html lang="zh-TW">
<head>

<title>調度車資試算</title>
<style>

*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg)}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",Arial,sans-serif;color:var(--ink)}button,input{font:inherit}
.page{width:min(100%,620px);margin:auto;padding:max(14px,env(safe-area-inset-top)) 12px max(32px,env(safe-area-inset-bottom))}.card{background:#fff;border-radius:22px;padding:20px 16px;box-shadow:0 16px 44px rgba(20,20,28,.09)}

.group{margin:0 0 15px}.labelrow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:7px}.labelrow label{font-size:15px;font-weight:900}.actions{display:flex;gap:6px}.paste,.remove{min-height:30px;padding:0 10px;border:1px solid #dedee3;border-radius:9px;background:#fff;color:#66666d;font-size:12px;font-weight:850;cursor:pointer}.paste:disabled{opacity:.55}.remove{color:#888}
.addr{position:relative}.addr input{width:100%;height:48px;padding:0 42px 0 40px;border:1px solid var(--line);border-radius:13px;outline:none;background:#fafafa;color:#222;font-size:16px;font-weight:700}.addr input:focus{border-color:var(--red);background:#fff;box-shadow:0 0 0 3px rgba(255,31,45,.08)}.icon{position:absolute;left:14px;top:24px;transform:translateY(-50%);color:#777}.clear{position:absolute;right:7px;top:24px;transform:translateY(-50%);width:32px;height:32px;border:0;background:transparent;color:#85858b;font-size:20px;cursor:pointer}.clear[hidden]{display:none}

.location{width:100%;min-height:35px;margin-top:6px;border:1px solid var(--line);border-radius:10px;background:#f7f7f9;color:#707077;font-size:12.5px;font-weight:850;cursor:pointer}.locstatus{margin-top:5px;color:#4b875e;font-size:11px}.locstatus.error{color:#b02b36}

.results{display:none;margin-top:22px}.results.show{display:block}.rhead{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin-bottom:11px}.rtitle{font-size:17px;font-weight:950}.rnote{color:#999;font-size:11px}.route{margin-bottom:11px;padding:16px;border:1px solid #e5e5e8;border-radius:17px;background:#fff}.route.fast{border-color:rgba(255,31,45,.25);background:#fffafb}.rtop{display:flex;justify-content:space-between;gap:8px}.rname{font-size:15.5px;font-weight:950}.tag{padding:4px 8px;border-radius:99px;background:#f1f1f3;color:#777;font-size:10px;font-weight:800}.fast .tag{background:#fff0f1;color:#d40018}.stats{display:flex;gap:13px;flex-wrap:wrap;margin-top:10px;color:#777;font-size:12.5px;font-weight:700}.fareline{display:flex;justify-content:space-between;align-items:flex-end;margin-top:13px}.farelabel{color:#777;font-size:12px;font-weight:800}.fare{color:var(--red);font-size:29px;font-weight:950}.save{min-height:17px;margin-top:6px;color:#078142;font-size:11px;font-weight:750}

@media(max-width:420px){.card{padding:18px 13px}.page{padding-left:9px;padding-right:9px}.paste,.remove{padding:0 8px;font-size:11.5px}.fare{font-size:27px}}
</style>
</head>
<body>
<main class="page"><section class="card">
<div class="head"><div><h1 class="title">調度車資試算</h1><div class="sub">地址確認後自動計算平面與快速路線</div></div><button id="reset" class="reset">清除行程</button></div>
<div class="mode"><button class="on" data-mode="taxi">一般搭車</button><button data-mode="driver">代駕服務</button></div>
<div class="group"><div class="labelrow"><label>上車地點</label><button id="pastePickup" class="paste">貼上地址</button></div><div id="pickup"></div><div id="locstatus" class="locstatus"></div><button id="locbtn" class="location">⌖ 使用目前位置</button></div>
<div class="stops"><div id="stop1g" class="stop" hidden><div class="labelrow"><label>停靠點 1</label><div class="actions"><button id="pasteStop1" class="paste">貼上地址</button><button class="remove" data-rm="0">移除</button></div></div><div id="stop1"></div></div><div id="stop2g" class="stop" hidden><div class="labelrow"><label>停靠點 2</label><div class="actions"><button id="pasteStop2" class="paste">貼上地址</button><button class="remove" data-rm="1">移除</button></div></div><div id="stop2"></div></div><button id="addstop" class="addstop">＋ 新增停靠點</button><div class="note">最多 2 個停靠點，依輸入順序計算</div></div>
<div class="divider"></div>
<div class="group"><div class="labelrow"><label>下車地點</label><button id="pasteDropoff" class="paste">貼上地址</button></div><div id="dropoff"></div></div>
<button id="calc" class="calc">開始試算 →</button><div id="status" class="status"></div>
<section id="results" class="results"><div class="rhead"><div class="rtitle">路線試算結果</div><div class="rnote">平面／快速一次比較</div></div>
<article class="route"><div class="rtop"><div class="rname">平面道路</div><span class="tag">避開高速／收費</span></div><div class="stats"><span id="sd">-- km</span><span id="st">約 -- 分鐘</span></div><div class="fareline"><span class="farelabel">預估車資</span><strong id="sf" class="fare">$---</strong></div></article>
<article class="route fast"><div class="rtop"><div class="rname">快速／高速路線</div><span class="tag">推薦</span></div><div class="stats"><span id="fd">-- km</span><span id="ft">約 -- 分鐘</span></div><div class="fareline"><span class="farelabel">預估車資</span><strong id="ff" class="fare">$---</strong></div><div id="save" class="save"></div></article>
<div class="copybox"><div id="preview" class="preview"></div><button id="copy" class="copy">複製平面＋快速給客人</button></div></section>
<div class="foot">※ 系統預估僅供參考，實際費用依當日行程與路況為準。<br>※ 40 公里以上長途可再依實際方案確認優惠。</div>
</section></main>
<script>
const $=id=>document.getElementById(id);let RouteClass=null,PlaceClass=null,mode='taxi',pickup=null,dropoff=null;const stops=[null,null],active=[false,false],ctl={pickup:null,dropoff:null,stops:[null,null]};let latest=null,busy=false;
function clean(v=''){return String(v||'').trim().replace(/臺/g,'台').replace(/^\s*\d{3}(?:\d{2,3})?\s*/u,'').replace(/^台灣省?/u,'')}
function pname(p){return typeof p?.displayName==='string'?p.displayName:(p?.displayName?.toString?.()||'')}
function pdata(p){if(!p)return null;return{name:clean(pname(p)),address:clean(p.formattedAddress||'')}}
function display(d){if(!d)return'';return d.name&&d.address&&!d.address.includes(d.name)?`${d.name}｜${d.address}`:(d.name||d.address)}
function show(msg,err=false){$('status').textContent=msg;$('status').className='status show'+(err?' error':'')}function hideStatus(){$('status').className='status'}function hideResults(){$('results').classList.remove('show');latest=null}
function fare(d,m){const base=mode==='driver'?60:80,df=d<=20?d*15:300+(d-20)*25,trip=base+df+m*3;return Math.floor((mode==='driver'?trip*2+320:trip)/10)*10}
function setMode(v){mode=v==='driver'?'driver':'taxi';document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('on',b.dataset.mode===mode));$('calc').textContent=mode==='driver'?'開始試算代駕費用 →':'開始試算 →';hideResults();autoCalc()}
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));
function updateStops(){for(let i=0;i<2;i++)$('stop'+(i+1)+'g').hidden=!active[i];$('addstop').hidden=active.filter(Boolean).length>=2}
$('addstop').onclick=()=>{const i=active.findIndex(x=>!x);if(i<0)return;active[i]=true;updateStops();hideResults();setTimeout(()=>ctl.stops[i]?.focus(),40)};
function clearStop(i){stops[i]=null;ctl.stops[i]?.setValue('')}
document.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{const i=+b.dataset.rm;if(i===0&&active[1]){stops[0]=stops[1];ctl.stops[0]?.setValue(ctl.stops[1]?.value()||'');clearStop(1);active[0]=true;active[1]=false}else{clearStop(i);active[i]=false}updateStops();hideResults();autoCalc()});
function readyStops(){return active.every((a,i)=>!a||!!stops[i])}function waypoints(){return active.map((a,i)=>a?stops[i]:null).filter(Boolean)}
function summary(route,n){const legs=Array.isArray(route?.legs)?route.legs:[];if(legs.length!==n)throw Error(`停靠點驗證失敗：預期 ${n} 段，實際 ${legs.length} 段`);const dm=legs.reduce((s,l)=>s+Number(l?.distanceMeters||0),0),ms=legs.reduce((s,l)=>s+Number(l?.durationMillis||0),0);if(!(dm>0&&ms>0))throw Error('Google 路線資料不完整');return{distanceKm:dm/1000,minutes:Math.ceil(ms/60000)}}
function copyText(){if(!latest)return'';const s=latest.surface,f=latest.fast,same=s.minutes===f.minutes&&s.fare===f.fare&&Math.abs(s.distanceKm-f.distanceKm)<.05,lines=[mode==='driver'?'代駕費用預估':'車資預估',''];if(same)lines.push('目前平面／快速路線相同',`${s.distanceKm.toFixed(1)} km｜約 ${s.minutes} 分｜$${s.fare}`);else lines.push(`平面道路｜${s.distanceKm.toFixed(1)} km｜約 ${s.minutes} 分｜$${s.fare}`,`快速路線｜${f.distanceKm.toFixed(1)} km｜約 ${f.minutes} 分｜$${f.fare}`);if(mode==='driver')lines.push('','※ 以上代駕費用已含代駕服務費。');if(Math.max(s.distanceKm,f.distanceKm)>40)lines.push('','※ 40 公里以上長途另有優惠，可再確認實際方案。');lines.push('','※ 以上為系統預估，實際費用依當日行程與路況為準。');return lines.join('\n')}
$('copy').onclick=async()=>{const t=copyText();if(!t)return;try{await navigator.clipboard.writeText(t);$('copy').textContent='已複製 ✓';$('copy').classList.add('ok');setTimeout(()=>{$('copy').textContent='複製平面＋快速給客人';$('copy').classList.remove('ok')},1400)}catch{show('複製失敗，請手動選取文字。',true)}};
function autoCalc(){if(!pickup||!dropoff||!RouteClass||!readyStops()||busy)return;setTimeout(()=>{if(pickup&&dropoff&&RouteClass&&readyStops()&&!busy)calculate()},0)}
async function calculate(){if(busy)return;if(!pickup||!dropoff){show('請先確認上車與下車地點。',true);return}if(!readyStops()){show('請先確認所有停靠點。',true);return}if(!RouteClass){show('Google 路線服務尚未載入完成。',true);return}busy=true;const b=$('calc');b.disabled=true;b.textContent='正在計算路線...';show('正在取得平面與快速路線...');try{const inter=waypoints().map(location=>({location})),n=inter.length+1,departureTime=new Date(Date.now()+120000),common={origin:pickup,destination:dropoff,travelMode:'DRIVING',intermediates:inter,optimizeWaypointOrder:false,routingPreference:'TRAFFIC_AWARE_OPTIMAL',departureTime,fields:['legs']};const [fr,sr]=await Promise.all([RouteClass.computeRoutes({...common,routeModifiers:{avoidHighways:false,avoidTolls:false,avoidFerries:true}}),RouteClass.computeRoutes({...common,routeModifiers:{avoidHighways:true,avoidTolls:true,avoidFerries:true}})]);const f=summary(fr.routes?.[0],n),s=summary(sr.routes?.[0],n);f.fare=fare(f.distanceKm,f.minutes);s.fare=fare(s.distanceKm,s.minutes);latest={fast:f,surface:s};$('fd').textContent=`${f.distanceKm.toFixed(1)} km`;$('ft').textContent=`約 ${f.minutes} 分鐘`;$('ff').textContent=`$${f.fare}`;$('sd').textContent=`${s.distanceKm.toFixed(1)} km`;$('st').textContent=`約 ${s.minutes} 分鐘`;$('sf').textContent=`$${s.fare}`;const d=s.minutes-f.minutes;$('save').textContent=d>0?`快速路線約可節省 ${d} 分鐘`:d<0?`目前交通平面道路約快 ${Math.abs(d)} 分鐘`:'目前兩條路線時間相近';$('preview').textContent=copyText();hideStatus();$('results').classList.add('show');setTimeout(()=>$('results').scrollIntoView({behavior:'smooth',block:'start'}),70)}catch(e){console.error(e);show(`路線計算失敗：${e?.message||'請重新選擇地址。'}`,true)}finally{busy=false;b.disabled=false;b.textContent=mode==='driver'?'開始試算代駕費用 →':'開始試算 →'}}$('calc').onclick=calculate;
function locStatus(t='',err=false){$('locstatus').textContent=t;$('locstatus').className='locstatus'+(err?' error':'')}
$('reset').onclick=()=>{pickup=dropoff=null;ctl.pickup?.setValue('');ctl.dropoff?.setValue('');for(let i=0;i<2;i++){clearStop(i);active[i]=false}updateStops();hideResults();hideStatus();locStatus();setMode('taxi');ctl.pickup?.focus()};
$('locbtn').onclick=async()=>{if(!navigator.geolocation){locStatus('此裝置無法取得目前位置',true);return}const b=$('locbtn');b.disabled=true;b.textContent='定位中…';try{const p=await new Promise((r,j)=>navigator.geolocation.getCurrentPosition(r,j,{enableHighAccuracy:true,timeout:10000,maximumAge:60000})),{Geocoder}=await google.maps.importLibrary('geocoding'),res=await new Geocoder().geocode({location:{lat:p.coords.latitude,lng:p.coords.longitude}}),first=(res.results||[]).find(x=>x.place_id&&Array.isArray(x.types)&&(x.types.includes('street_address')||x.types.includes('premise')))||res.results?.find(x=>x.place_id);if(!first?.place_id)throw Error();const pl=new PlaceClass({id:first.place_id});await pl.fetchFields({fields:['id','displayName','formattedAddress','location','addressComponents']});pickup=pl;ctl.pickup?.setValue(display(pdata(pl)));hideResults();locStatus('已帶入目前位置');autoCalc()}catch{locStatus('未取得定位，請手動輸入上車地點',true)}finally{b.disabled=false;b.textContent='⌖ 使用目前位置'}};
async function clipboard(label){let t='';if(window.isSecureContext&&navigator.clipboard?.readText){try{t=await navigator.clipboard.readText()}catch{}}if(!t)t=prompt(`請貼上客人的${label}：`,'')||'';return t.trim()}
async function paste(btnId,c,label){const b=$(btnId);if(!c?.resolve){show('Google 地址系統尚未載入完成。',true);return}b.disabled=true;b.textContent='讀取中…';try{const t=await clipboard(label);if(!t)return; c.setValue(t);hideResults();b.textContent='Google 判斷中…';const ok=await c.resolve(t,true);if(!ok){c.setValue(t);c.focus();show(`Google 找不到明確的${label}，已保留貼上的文字，請從建議中選擇。`,true)}else hideStatus()}finally{b.disabled=false;b.textContent='貼上地址'}}
$('pastePickup').onclick=()=>paste('pastePickup',ctl.pickup,'上車地址');$('pasteStop1').onclick=()=>paste('pasteStop1',ctl.stops[0],'停靠點 1');$('pasteStop2').onclick=()=>paste('pasteStop2',ctl.stops[1],'停靠點 2');$('pasteDropoff').onclick=()=>paste('pasteDropoff',ctl.dropoff,'下車地址');
async function init(){try{const {AutocompleteSuggestion,AutocompleteSessionToken,Place}=await google.maps.importLibrary('places'),{Route}=await google.maps.importLibrary('routes');PlaceClass=Place;RouteClass=Route;let center={lat:24.1477,lng:120.6736};navigator.geolocation?.getCurrentPosition(p=>center={lat:p.coords.latitude,lng:p.coords.longitude},()=>{},{timeout:4000,maximumAge:300000});
function make(containerId,placeholder,onReset,onSelect){const box=$(containerId),w=document.createElement('div');w.className='addr';const i=document.createElement('input');i.type='search';i.placeholder=placeholder;i.autocomplete='off';const ic=document.createElement('span');ic.className='icon';ic.textContent='⌕';const cl=document.createElement('button');cl.type='button';cl.className='clear';cl.textContent='×';cl.hidden=true;const panel=document.createElement('div');panel.className='suggest';w.append(i,ic,cl,panel);box.appendChild(w);let timer=null,seq=0,token=new AutocompleteSessionToken();const hide=()=>panel.classList.remove('show'),txt=x=>x?.text||x?.toString?.()||'';
async function preds(q){const n=++seq,r=await AutocompleteSuggestion.fetchAutocompleteSuggestions({input:q,includedRegionCodes:['tw'],language:'zh-TW',region:'TW',locationBias:{center,radius:50000},origin:center,sessionToken:token});return n===seq?(r.suggestions||[]).map(x=>x.placePrediction).filter(Boolean).slice(0,6):[]}
async function choose(p){i.disabled=true;try{const pl=p.toPlace();await pl.fetchFields({fields:['id','displayName','formattedAddress','location','addressComponents']});i.value=display(pdata(pl))||txt(p.text);cl.hidden=false;token=new AutocompleteSessionToken();hide();onSelect(pl);return true}catch(e){console.error(e);show('地址資料讀取失敗，請重新選擇。',true);return false}finally{i.disabled=false}}
function render(ps){panel.innerHTML='';if(!ps.length){const n=document.createElement('div');n.className='google';n.textContent='找不到符合的地點';panel.appendChild(n)}ps.forEach(p=>{const b=document.createElement('button');b.type='button';const pin=document.createElement('span');pin.className='pin';pin.textContent='📍';const wrap=document.createElement('span'),m=document.createElement('span'),s=document.createElement('span');m.className='main';s.className='secondary';m.textContent=txt(p.mainText)||txt(p.text);s.textContent=txt(p.secondaryText);wrap.append(m,s);b.append(pin,wrap);b.onclick=e=>{e.preventDefault();choose(p)};panel.appendChild(b)});const g=document.createElement('div');g.className='google';g.textContent='Google Maps';panel.appendChild(g);panel.classList.add('show')}
