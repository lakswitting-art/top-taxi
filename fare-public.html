<!doctype html><html lang='zh-TW'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'><title>調度車資試算</title><style>:root{--r:#ff1f2d;--ink:#1b1b1f;--line:#e4e4e8;--bg:#f2f3f5}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg)}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans TC',Arial,sans-serif;color:var(--ink)}button,input{font:inherit}.page{width:min(100%,620px);margin:auto;padding:max(14px,env(safe-area-inset-top)) 12px max(32px,env(safe-area-inset-bottom))}.card{background:#fff;border-radius:22px;padding:20px 16px;box-shadow:0 16px 44px rgba(20,20,28,.09)}.head,.label,.rtop,.fareline,.rhead{display:flex;align-items:center;justify-content:space-between;gap:9px}.title{margin:0;display:flex;align-items:center;gap:9px;font-size:19px;font-weight:950}.title:before{content:'';width:4px;height:23px;border-radius:99px;background:var(--r)}.sub{margin-top:5px;color:#95959b;font-size:11.5px}.reset{border:0;background:transparent;color:#8c8c93;font-size:12px;font-weight:800}.mode{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin:17px 0;padding:5px;border:1px solid var(--line);border-radius:16px;background:#f4f4f6}.mode button{min-height:47px;border:0;border-radius:12px;background:transparent;color:#5e5e65;font-weight:900}.mode button.on{background:linear-gradient(180deg,#ff2d40,#e5001c);color:#fff;box-shadow:0 7px 16px rgba(218,0,27,.2)}.group{margin-bottom:15px}.label{margin-bottom:7px}.label label{font-size:15px;font-weight:900}.actions{display:flex;gap:6px}.paste,.remove{min-height:30px;padding:0 10px;border:1px solid #dedee3;border-radius:9px;background:#fff;color:#66666d;font-size:12px;font-weight:850}.paste:disabled{opacity:.55}.addr{position:relative}.addr input{width:100%;height:48px;padding:0 42px 0 40px;border:1px solid var(--line);border-radius:13px;outline:0;background:#fafafa;color:#222;font-size:16px;font-weight:700}.addr input:focus{border-c 'reset' class='reset'>清除行程</button></div><div class='mode'><button class='on' data-mode='taxi'>一般搭車</button><button data-mode='driver'>代駕服務</button></div><div class='group'><div class='label'><label>上車地點</label><button id='pasteP' class='paste'>貼上地址</button></div><div id='pbox'></div><div id='locs' class='locstatus'></div><button id='loc' class='location'>⌖ 使用目前位置</button></div><div class='stops'><div id='s1g' class='stop' hidden><div class='label'><label>停靠點 1</label><div class='actions'><button id='pasteS1' class='paste'>貼上地址</button><button class='remove' data-rm='0'>移除</button></div></div><div id='s1'></div></div><div id='s2g' class='stop' hidden><div class='label'><label>停靠點 2</label><div class='actions'><button id='pasteS2' class='paste'>貼上地址</button><button class='remove' data-rm='1'>移除</button></div></div><div id='s2'></div></div><button id='add' class='addstop'>＋ 新增停靠點</button><div class='note'>最多 2 個停靠點，依輸入順序計算</div></div><div class='divider'></div><div class='group'><div class='label'><label>下車地點</label><button id='pasteD' class='paste'>貼上地址</button></div><div id='dbox'></div></div><button id='calc' class='calc'>開始試算 →</button><div id='status' class='status'></div><section id='results' class='results'><div class='rhead'><div class='rtitle'>路線試算結果</div><div class='rnote'>平面／快速一次比較</div></div><article class='route'><div class='rtop'><div class='rname'>平面道路</div><span class='tag'>避開高速／收費</span></div><div class='stats'><span id='sd'>-- km</span><span id='st'>約 -- 分鐘</span></div><div class='fareline'><span class='farelabel'>預估車資</span><strong id='sf' class='fare'>$---</strong></div></article><article class='route fast'><div class='rtop'><div class='rname'>快速／高速路線</div><span class='tag'>推薦</span></div><div class='stats'><span id='fd'>-- km</span><span id='ft'>約 -- 分鐘</span></div><div class='fareline'><span class='farelabel'>預估車資</span><strong id='ff' class='fare'>$---</strong></div><div id='save' class='save'></div></article><div class='copybox'><div id='preview' class='preview'></div><button id='copy' class='copy'>複製平面＋快速給客人</button></div></section><div class='foot'>※ 系統預估僅供參考，實際費用依當日行程與路況為準。<br>※ 40 公里以上長途可再依實際方案確認優惠。</div></section></main><script>const $=x=>document.getElementById(x);let Route,Place,mode='taxi',p=null,d=null,busy=false,latest=null;const stops=[null,null],active=[false,false],ctl={p:null,d:null,s:[null,null]};const clean=v=>String(v||'').trim().replace(/臺/g,'台').replace(/^\s*\d{3}(?:\d{2,3})?\s*/u,'').replace(/^台灣省?/u,'');const pn=x=>typeof x?.displayName==='string'?x.displayName:(x?.displayName?.toString?.()||'');const pd=x=>x?{name:clean(pn(x)),address:clean(x.formattedAddress||'')}:null;const disp=x=>{if(!x)return'';return x.name&&x.address&&!x.address.includes(x.name)?`${x.name}｜${x.address}`:(x.name||x.address)};function show(t,e=false){$('status').textContent=t;$('status').className='status show'+(e?' err':'')}function hide(){ $('status').className='status'}function hideRes(){$('results').classList.remove('show');latest=null}function fare(k,m){const base=mode==='driver'?60:80,km=k<=20?k*15:300+(k-20)*25,trip=base+km+m*3;return Math.floor((mode==='driver'?trip*2+320:trip)/10)*10}function setMode(v){mode=v==='driver'?'driver':'taxi';document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('on',x.dataset.mode===mode));$('calc').textContent=mode==='driver'?'開始試算代駕費用 →':'開始試算 →';hideRes();auto()}document.querySelectorAll('[data-mode]').forEach(x=>x.onclick=()=>setMode(x.dataset.mode));function updateStops(){for(let i=0;i<2;i++)$('s'+(i+1)+'g').hidden=!active[i];$('add').hidden=active.filter(Boolean).length>=2}$('add').onclick=()=>{const i=active.findIndex(x=>!x);if(i<0)return;active[i]=true;updateStops();hideRes();setTimeout(()=>ctl.s[i]?.focus(),40)};function clearStop(i){stops[i]=null;ctl.s[i]?.set('')}document.querySelectorAll('[data-rm]').forEach(x=>x.onclick=()=>{const i=+x.dataset.rm;if(i===0&&active[1]){stops[0]=stops[1];ctl.s[0]?.set(ctl.s[1]?.val()||'');clearStop(1);active[0]=tru t b=$('calc');b.disabled=true;b.textContent='正在計算路線...';show('正在取得平面與快速路線...');try{const inter=ways().map(location=>({location})),n=inter.length+1,t=new Date(Date.now()+120000),common={origin:p,destination:d,travelMode:'DRIVING',intermediates:inter,optimizeWaypointOrder:false,routingPreference:'TRAFFIC_AWARE_OPTIMAL',departureTime:t,fields:['legs']};const [fr,sr]=await Promise.all([Route.computeRoutes({...common,routeModifiers:{avoidHighways:false,avoidTolls:false,avoidFerries:true}}),Route.computeRoutes({...common,routeModifiers:{avoidHighways:true,avoidTolls:true,avoidFerries:true}})]);const f=sum(fr.routes?.[0],n),s=sum(sr.routes?.[0],n);f.fare=fare(f.distanceKm,f.minutes);s.fare=fare(s.distanceKm,s.minutes);latest={f,s};$('fd').textContent=`${f.distanceKm.toFixed(1)} km`;$('ft').textContent=`約 ${f.minutes} 分鐘`;$('ff').textContent=`$${f.fare}`;$('sd').textContent=`${s.distanceKm.toFixed(1)} km`;$('st').textContent=`約 ${s.minutes} 分鐘`;$('sf').textContent=`$${s.fare}`;const q=s.minutes-f.minutes;$('save').textContent=q>0?`快速路線約可節省 ${q} 分鐘`:q<0?`目前交通平面道路約快 ${Math.abs(q)} 分鐘`:'目前兩條路線時間相近';$('preview').textContent=copyText();hide();$('results').classList.add('show');setTimeout(()=>$('results').scrollIntoView({behavior:'smooth',block:'start'}),70)}catch(e){console.error(e);show(`路線計算失敗：${e?.message||'請重新選擇地址。'}`,true)}finally{busy=false;b.disabled=false;b.textContent=mode==='driver'?'開始試算代駕費用 →':'開始試算 →'}}$('calc').onclick=calc;function locStatus(t='',e=false){$('locs').textContent=t;$('locs').className='locstatus'+(e?' err':'')}$('reset').onclick=()=>{p=d=null;ctl.p?.set('');ctl.d?.set('');for(let i=0;i<2;i++){clearStop(i);active[i]=false}updateStops();hideRes();hide();locStatus();setMode('taxi');ctl.p?.focus()};$('loc').onclick=async()=>{if(!navigator.geolocation){locStatus('此裝置無法取得目前位置',true);return}const b=$('loc');b.disabled=true;b.textContent='定位中…';try{const pos=await new Promise((r,j)=>navigator.geolocation.getCurrentPosition(r,j,{enableHighAccuracy:true,timeou
