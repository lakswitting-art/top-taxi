<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f2f3f5">
<title>TOP Taxi｜跑腿服務 UI V2 測試</title>
<style>
html,body{margin:0;min-height:100%;background:#f2f3f5;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC",Arial,sans-serif}
.loading{min-height:100vh;display:grid;place-items:center;color:#8d8d94;font-size:13px;font-weight:700}
</style>
</head>
<body>
<div class="loading">TOP Taxi 載入中…</div>
<script>
(async function(){
  const response=await fetch('./errand.html?v=20260818-2048',{cache:'no-store'});
  if(!response.ok) throw new Error('Errand base load failed: '+response.status);
  let html=await response.text();

  const patch=`
<style id="topTaxiErrandUIV220260818">
html,body{background:#f2f3f5!important}
body{min-height:100vh}
.hero{display:none!important}
.page{margin:0 auto!important;padding-top:max(12px,env(safe-area-inset-top))!important}
.booking-card{border-radius:22px!important;box-shadow:0 18px 50px rgba(0,0,0,.10)!important}
.form-header{align-items:center!important;margin-bottom:0!important}
.form-title{display:flex!important;align-items:center!important;gap:10px!important;color:#17171b!important;font-size:18px!important;font-weight:950!important;letter-spacing:.1px!important}
.form-title::before{content:"";width:4px;height:23px;flex:0 0 4px;border-radius:999px;background:var(--red);box-shadow:0 2px 7px rgba(255,31,45,.18)}
.form-label-small{font-size:0!important;letter-spacing:0!important;color:#17171b!important;font-weight:900!important;white-space:nowrap}
.form-label-small::before{content:"TOP";color:var(--red);font-size:13px;font-weight:950}
.form-label-small::after{content:" Taxi";color:#17171b;font-size:13px;font-weight:900}

/* 只修改服務時間：跟一般搭車／代駕同款 */
.errand-mode-switch{
  grid-template-columns:1fr 1fr!important;
  gap:4px!important;
  margin:8px 0 18px!important;
  padding:5px!important;
  border:1px solid #e3e3e7!important;
  border-radius:17px!important;
  background:linear-gradient(180deg,#fbfbfc 0%,#f2f2f4 100%)!important;
  box-shadow:0 7px 18px rgba(20,20,24,.08),inset 0 1px 0 rgba(255,255,255,.95)!important;
}
.errand-mode-switch .errand-choice{
  min-height:49px!important;
  padding:0 12px!important;
  border:1px solid transparent!important;
  border-radius:13px!important;
  background:transparent!important;
  color:#55555d!important;
  font-size:15px!important;
  font-weight:900!important;
  letter-spacing:.1px!important;
  box-shadow:none!important;
  transition:transform .14s ease,background .18s ease,color .18s ease,box-shadow .18s ease,border-color .18s ease!important;
}
.errand-mode-switch .errand-choice:active{transform:scale(.985)}
.errand-mode-switch .errand-choice.active{
  border-color:rgba(181,0,21,.18)!important;
  background:linear-gradient(180deg,#ff263a 0%,#e5001c 100%)!important;
  color:#fff!important;
  box-shadow:0 7px 16px rgba(218,0,27,.24),inset 0 1px 0 rgba(255,255,255,.24)!important;
}

.errand-purchase-label-row{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;margin-bottom:8px}
.errand-purchase-label-row>label{margin:0!important}
.errand-reset-btn{flex:0 0 auto;display:inline-flex!important;align-items:center;justify-content:center;gap:4px;margin-right:4px;padding:3px 0 3px 2px!important;border:0!important;background:transparent!important;color:#8d8d94!important;font-size:11px!important;font-weight:750!important;line-height:1.2;white-space:nowrap;box-shadow:none!important;min-height:auto!important;width:auto!important}
.errand-reset-icon{width:15px;height:14px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.errand-reset-btn:active{opacity:.55}

@media(max-width:390px){
  .form-title{gap:9px!important}.form-title::before{height:21px}.form-label-small::before,.form-label-small::after{font-size:12.5px}
  .errand-mode-switch .errand-choice{min-height:47px!important;font-size:14.5px!important}
  .errand-reset-btn{margin-right:3px;font-size:10.5px!important}.errand-reset-icon{width:14.5px;height:13.5px}
}
</style>`;

  const behavior=`
<script id="topTaxiErrandUIV2Behavior20260818">
(function(){
  function text(el){return (el&&el.textContent||'').replace(/\\s+/g,' ').trim();}
  function findExactOrContains(selector,needle){
    return Array.from(document.querySelectorAll(selector)).find(el=>text(el).includes(needle));
  }
  function apply(){
    const title=document.querySelector('.form-title');
    if(title){ title.textContent='跑腿服務'; }

    const header=document.querySelector('.form-header');
    if(header){
      const existingSmall=header.querySelector('.form-label-small');
      if(!existingSmall){
        const brand=document.createElement('div');
        brand.className='form-label-small';
        brand.textContent='TOP Taxi';
        header.appendChild(brand);
      }
    }

    const clearCandidates=Array.from(document.querySelectorAll('button,a,[role="button"]')).filter(el=>/清除(?:本次)?行程/.test(text(el)));
    const clear=clearCandidates[0];
    if(clear){ clear.style.display='none'; }

    const labels=Array.from(document.querySelectorAll('label,.label,.field-label,.input-label'));
    const purchaseLabel=labels.find(el=>text(el).includes('購買地點')) || findExactOrContains('*','購買地點');
    if(purchaseLabel && !document.querySelector('#clearErrandTripV2')){
      let labelEl=purchaseLabel;
      if(labelEl.children.length && !/購買地點/.test(text(labelEl))) labelEl=labelEl.closest('label')||labelEl;
      const parent=labelEl.parentElement;
      if(parent){
        const row=document.createElement('div');
        row.className='errand-purchase-label-row';
        parent.insertBefore(row,labelEl);
        row.appendChild(labelEl);
        const btn=document.createElement('button');
        btn.id='clearErrandTripV2';
        btn.type='button';
        btn.className='errand-reset-btn';
        btn.innerHTML='<svg class="errand-reset-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16"/><path d="M9 7V4.8c0-.45.35-.8.8-.8h4.4c.45 0 .8.35.8.8V7"/><path d="M6.5 8l.85 11.2c.04.46.4.8.86.8h7.58c.46 0 .82-.34.86-.8L17.5 8"/><path d="M10 10.5v6.5M14 10.5v6.5"/></svg><span>清除本次行程</span>';
        btn.addEventListener('click',()=>{ if(clear) clear.click(); });
        row.appendChild(btn);
      }
    }
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',()=>setTimeout(apply,0));
  else setTimeout(apply,0);
  setTimeout(apply,350);
  setTimeout(apply,1200);
})();
<\/script>`;

  html=html.replace('</head>',patch+'</head>');
  html=html.replace('</body>',behavior+'</body>');
  document.open();
  document.write(html);
  document.close();
})().catch(error=>{
  console.error(error);
  document.body.innerHTML='<div class="loading">頁面載入失敗，請重新整理</div>';
});
</script>
</body>
</html>
