name: Errand Address AB5
'on':
  push:
    paths:
      - '.github/workflows/errand-address-ab5.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply AB5 patch
        run: python3 .github/scripts/patch_errand_ab5.py
      - name: Verify and commit
        run: |
          set -euo pipefail
          git diff --check
          grep -q 'topTaxiErrandAddressAB5' errand.html
          grep -q "root.appendChild(addressBlock(addressSlots.p1))" errand.html
          grep -q 'top-taxi-address-plain-input' errand.html
          rm .github/workflows/errand-address-ab5.yml
          git config user.name 'TOP Taxi automation'
          git config user.email 'actions@users.noreply.github.com'
          git add errand.html .github/workflows/errand-address-ab5.yml
          git commit -m 'test uniform plain errand address slots with Places'
          git push origin HEAD:main
