name: Errand native address control AB
on:
  push:
    paths:
      - '.github/workflows/errand-address-native-ab.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Replace first address control with plain textarea test
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('errand.html')
          s=p.read_text(encoding='utf-8')
          # remove earlier temporary A/B CSS/script if still present
          s=re.sub(r'<style id="topTaxiErrandAddressABTestV1">.*?</script>\s*','',s,flags=re.S)
          marker='''
<style id="topTaxiErrandNativeABV1">
#p1Box.native-ab-host{position:relative!important;width:100%!important;max-width:100%!important;min-width:0!important;contain:none!important;overflow:visible!important;transform:none!important;zoom:1!important}
#p1Box.native-ab-host .address-search-icon,#p1Box.native-ab-host .address-clear-btn,#p1Box.native-ab-host .address-suggestions{display:none!important}
#p1Box.native-ab-host .native-ab-textarea{display:block!important;width:100%!important;max-width:100%!important;min-width:0!important;box-sizing:border-box!important;min-height:128px!important;padding:18px 16px!important;border:1px solid #dedee3!important;border-radius:16px!important;background:#fff!important;color:#222!important;font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif!important;resize:none!important;outline:none!important;appearance:none!important;-webkit-appearance:none!important;transform:none!important;zoom:1!important}
#p1Box.native-ab-host .native-ab-textarea:focus{border-color:#ff1f2d!important;box-shadow:0 0 0 3px rgba(255,31,45,.08)!important}
</style>
<script id="topTaxiErrandNativeABScriptV1">
(function(){
  function patch(){
    const old=document.getElementById('p1Input');
    const host=document.getElementById('p1Box');
    if(!old||!host||old.dataset.nativeAbDone) return false;
    const ta=document.createElement('textarea');
    ta.id='p1Input';
    ta.className='native-ab-textarea';
    ta.rows=4;
    ta.placeholder='A/B TEST：這格暫時完全比照一般內容輸入框';
    ta.value=old.value||'';
    ta.dataset.nativeAbDone='1';
    host.classList.add('native-ab-host');
    old.replaceWith(ta);
    ta.addEventListener('input',()=>{
      const slot=window.addressSlots&&window.addressSlots.p1;
      if(slot){const q=ta.value.trim();slot.place=null;slot.data=q?normalizeAddress({address:q}):null;}
    });
    return true;
  }
  if(!patch()){
    const mo=new MutationObserver(()=>{if(patch()) mo.disconnect();});
    mo.observe(document.documentElement,{childList:true,subtree:true});
    setTimeout(()=>mo.disconnect(),10000);
  }
})();
</script>
'''
          if 'topTaxiErrandNativeABScriptV1' not in s:
              s=s.replace('</body>',marker+'\n</body>',1)
          p.write_text(s,encoding='utf-8')
      - name: Verify and commit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -q 'topTaxiErrandNativeABScriptV1' errand.html
          rm -f .github/workflows/errand-address-native-ab.yml
          git config user.name "TOP Taxi automation"
          git config user.email "actions@users.noreply.github.com"
          git add errand.html .github/workflows/errand-address-native-ab.yml
          git commit -m "test first errand address as plain native textarea"
          git push origin HEAD:main
