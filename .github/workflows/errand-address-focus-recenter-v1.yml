name: Errand address focus recenter V1
on:
  push:
    paths:
      - '.github/workflows/errand-address-focus-recenter-v1.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Add address focus recenter only
        shell: python
        run: |
          from pathlib import Path
          p=Path('errand.html')
          s=p.read_text(encoding='utf-8')
          marker='''
<script id="topTaxiErrandAddressFocusRecenterV1">
(function(){
  let t1=0,t2=0;
  function resetX(){
    const y=window.scrollY||document.documentElement.scrollTop||document.body.scrollTop||0;
    document.documentElement.scrollLeft=0;
    document.body.scrollLeft=0;
    if(window.scrollX!==0) window.scrollTo(0,y);
  }
  function settleX(){
    clearTimeout(t1); clearTimeout(t2);
    requestAnimationFrame(resetX);
    t1=setTimeout(resetX,90);
    t2=setTimeout(resetX,220);
  }
  document.addEventListener('focusin',function(e){
    if(e.target && e.target.matches && e.target.matches('.address-input')) settleX();
  },true);
})();
</script>
'''
          if 'topTaxiErrandAddressFocusRecenterV1' not in s:
            s=s.replace('</body>',marker+'\n</body>',1)
          p.write_text(s,encoding='utf-8')
      - name: Verify and commit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -q 'topTaxiErrandAddressFocusRecenterV1' errand.html
          rm -f .github/workflows/errand-address-focus-recenter-v1.yml
          git config user.name "TOP Taxi automation"
          git config user.email "actions@users.noreply.github.com"
          git add errand.html .github/workflows/errand-address-focus-recenter-v1.yml
          git commit -m "fix errand address focus horizontal recenter"
          git push origin HEAD:main
