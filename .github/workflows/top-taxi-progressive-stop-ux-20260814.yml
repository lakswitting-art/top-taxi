name: TOP Taxi progressive stop UX patch

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/top-taxi-progressive-stop-ux-20260814.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch production pages
        run: python .github/scripts/top_taxi_progressive_stop_ux_20260814.py
      - name: Validate and publish
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/top-taxi-progressive-stop-ux-20260814.yml
          git rm .github/scripts/top_taxi_progressive_stop_ux_20260814.py
          git add ride.html index.html fare.html errand.html
          git diff --cached --check
          git commit -m "fix: streamline address and stop UX"
          git push
