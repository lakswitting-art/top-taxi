name: Errand whole address bypass AB
on:
  push:
    paths:
      - '.github/workflows/errand-whole-address-bypass-ab.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Install whole address block bypass test
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('errand.html')
          s=p.read_text(encoding='utf-8')

          # Remove earlier temporary first-address A/B test blocks.
          s=re.sub(r'<style id="topTaxiErrandNativeABV1">.*?</script>\s*','',s,flags=re.S)
          s=re.sub(r'<style id="topTaxiErrandAddressABTestV1">.*?</script>\s*','',s,flags=re.S)

          marker='''
<style id="topTaxiErrandWholeBlockBypassV1">
#topTaxiP1BypassTest{width:100%;max-width:100%;min-width:0;margin:12px 0 14px;box-sizing:border-box}
#topTaxiP1BypassTest label{display:block;margin:0 0 7px;color:#2b2b30;font-size:14px;font-weight:850}
#topTaxiP1BypassInput{display:block;width:100%;max-width:100%;min-width:0;min-height:128px;box-sizing:border-box;padding:15px 14px;border:1px solid #dedee3;border-radius:14px;background:#fff;color:#222;font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;resize:none;outline:none;appearance:none;-webkit-appearance:none;transform:none;zoom:1}
#topTaxiP1BypassInput:focus{border-color:#ff1f2d;box-shadow:0 0 0 3px rgba(255,31,45,.08)}
</style>
<script id="topTaxiErrandWholeBlockBypassScriptV1">
(function(){
  function install(){
    const section=document.getElementById('addressSection');
    if(!section) return false;
    let test=document.getElementById('topTaxiP1BypassTest');
    if(!test){
      test=document.createElement('div');
      test.id='topTaxiP1BypassTest';
      test.innerHTML='<label>📍 購買地點｜WHOLE BLOCK A/B TEST</label><textarea id="topTaxiP1BypassInput" rows="4" placeholder="這格完全繞過 errand-address-block / p1Box"></textarea>';
      section.parentNode.insertBefore(test,section);
    }
    const original=section.querySelector('[data-slot="p1"]');
    if(original) original.style.display='none';
    const ta=document.getElementById('topTaxiP1BypassInput');
    if(ta&&!ta.dataset.bound){
      ta.dataset.bound='1';
      ta.addEventListener('input',function(){
        try{
          const slot=addressSlots&&addressSlots.p1;
          if(slot){const q=ta.value.trim();slot.place=null;slot.data=q?normalizeAddress({address:q}):null;}
        }catch(_e){}
      });
    }
    return true;
  }
  install();
  const mo=new MutationObserver(()=>install());
  mo.observe(document.documentElement,{childList:true,subtree:true});
  setTimeout(()=>mo.disconnect(),15000);
})();
</script>
'''
          if 'topTaxiErrandWholeBlockBypassScriptV1' not in s:
              s=s.replace('</body>',marker+'\n</body>',1)
          p.write_text(s,encoding='utf-8')
      - name: Verify and commit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -q 'topTaxiErrandWholeBlockBypassScriptV1' errand.html
          rm -f .github/workflows/errand-whole-address-bypass-ab.yml
          git config user.name "TOP Taxi automation"
          git config user.email "actions@users.noreply.github.com"
          git add errand.html .github/workflows/errand-whole-address-bypass-ab.yml
          git commit -m "test errand first address outside address block"
          git push origin HEAD:main
