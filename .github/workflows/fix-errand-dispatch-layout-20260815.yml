name: Fix errand dispatch layout 2026-08-15
on:
  push:
    paths:
      - '.github/workflows/fix-errand-dispatch-layout-20260815.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch errand formatter only
        shell: python
        run: |
          from pathlib import Path
          p=Path('errand.html')
          s=p.read_text(encoding='utf-8')
          start=s.index('function topTaxiFormatErrandMessageV2(text){')
          end=s.index('\n\n</script>', start)
          old=s[start:end]
          new=r'''function topTaxiFormatErrandMessageV2(text){
  const task=TASKS[taskType]||'跑腿';
  const icon={purchase:'🛒',delivery:'📦',queue:'🧾',pet:'🐾',move:'📦',other:'🛵'}[taskType]||'🛵';
  const header='TOP Taxi｜跑腿服務';
  const isNearPurchase=taskType==='purchase'&&purchaseLocationMode==='unspecified';
  const split=topTaxiSplitAddressBlocksV2(String(text||'').split('\n'));
  const body=[];
  for(let i=0;i<split.body.length;i++){
    const line=String(split.body[i]??''); const t=line.trim();
    if(i===0 && /TOP Taxi/.test(t)) continue;
    if(t.startsWith('📋 服務類型：')) continue;
    if(t.startsWith('🛵 任務類型：')) continue;
    if(t.startsWith('📅 預約日期：') || t.startsWith('⏰ 預約時間：')) continue;
    if(t.startsWith('📡 TOP Taxi｜')) continue;
    if(t.startsWith('💳 付款方式：') && t.includes('現金')) continue;
    if(isNearPurchase && t==='⚠️ 購買地點｜送達地點附近購買') continue;
    if(isNearPurchase && t==='請於送達地點附近就近購買，實際店家依商品供應狀況選擇。') continue;
    body.push(line);
  }
  const cleanBody=topTaxiCleanMessageLinesV2(body);
  const hasRouteLine=cleanBody.some(line=>String(line||'').trim().startsWith('🛣️ 行車路線：'));
  const spacedBody=[];
  for(const line of cleanBody){
    const t=String(line??'').trim();
    const estimateStart=hasRouteLine
      ? t.startsWith('🛣️ 行車路線：')
      : (t.startsWith('💰 預估跑腿費：') || t.startsWith('💰 預估搬家費：'));
    if(estimateStart && spacedBody.length && String(spacedBody[spacedBody.length-1]||'').trim()!=='') spacedBody.push('');
    spacedBody.push(line);
  }
  const core=errandMode==='reserve'
    ? [`🕐 ${$('#errandDate').value} ${$('#errandTime').value}`,`${icon} ${task}`]
    : [`⚡ 即時｜${icon} ${task}`];
  const out=[header,'',...spacedBody,'',...core];
  if(isNearPurchase){
    out.push('','⚠️ 購買地點｜送達地點附近購買','請於送達地點附近就近購買，實際店家依商品供應狀況選擇。');
  }
  const rawBlocks=split.blocks.filter(b=>!String(b[0]||'').includes('未提供'));
  const hasFinal=!!addressValue('final');
  const blocks=rawBlocks.map((b,idx)=>{
    const next=[...b];
    const head=String(next[0]||'');
    const sep=head.indexOf('｜');
    const suffix=sep>=0?head.slice(sep):'';
    let label='';
    if(isNearPurchase){
      label=hasFinal&&idx===rawBlocks.length-1?'🏁 下車':`🟡 停靠 ${idx+1}`;
    }else if(idx===0){
      label='📍 上車';
    }else if(hasFinal&&idx===rawBlocks.length-1){
      label='🏁 下車';
    }else{
      label=`🟡 停靠 ${idx}`;
    }
    next[0]=`${label}${suffix}`;
    return next;
  });
  if(blocks.length) out.push('',...blocks.flatMap((b,idx)=>idx?[ '', ...b ]:b));
  return topTaxiCleanMessageLinesV2(out).join('\n');
}'''
          if 'const header=\'TOP Taxi｜跑腿服務\';' not in old:
            raise SystemExit('formatter baseline not found')
          s2=s[:start]+new+s[end:]
          p.write_text(s2,encoding='utf-8')
          print('formatter patched', len(old), '->', len(new))
      - name: Verify exact behavior markers
        shell: bash
        run: |
          set -e
          grep -F "const isNearPurchase=taskType==='purchase'&&purchaseLocationMode==='unspecified';" errand.html
          grep -F "label=hasFinal&&idx===rawBlocks.length-1?'🏁 下車':" errand.html
          grep -F "const hasRouteLine=cleanBody.some" errand.html
          git diff --check
          test "$(git diff --name-only | grep -v '^$')" = "errand.html"
      - name: Commit fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add errand.html
          git commit -m 'fix: normalize errand dispatch addresses and spacing'
          git push origin main
