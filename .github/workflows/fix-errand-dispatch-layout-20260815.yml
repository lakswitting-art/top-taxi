name: Fix errand dispatch layout 2026-08-15
on:
  push:
    paths:
      - '.github/workflows/fix-errand-dispatch-layout-20260815.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply patch
        run: python .github/scripts/fix-errand-dispatch-layout-20260815.py
      - name: Verify surgical diff
        run: |
          set -e
          grep -F "const isNearPurchase=taskType==='purchase'&&purchaseLocationMode==='unspecified';" errand.html
          grep -F "const hasRouteLine=cleanBody.some" errand.html
          grep -F "label=hasFinal&&idx===rawBlocks.length-1?'🏁 下車':" errand.html
          git diff --check
          test "$(git diff --name-only | grep -v '^$')" = "errand.html"
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add errand.html
          git commit -m 'fix: normalize errand dispatch addresses and spacing'
          git push origin main
