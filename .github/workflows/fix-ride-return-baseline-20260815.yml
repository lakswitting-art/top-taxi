name: Fix ride LINE return baseline

on:
  push:
    paths:
      - '.github/workflows/fix-ride-return-baseline-20260815.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Align ride return with working pages
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('ride.html')
          s = p.read_text(encoding='utf-8')

          old_state = '''    let pendingOrderIdentity=null;
    let rideLineUserId="";
    let rideLineDisplayName="";

    /* =========================================
'''
          new_state = '''    let pendingOrderIdentity=null;
    let rideLineUserId="";
    let rideLineDisplayName="";

    async function initRideLiff(){
      try{
        if(!(window.liff&&CONFIG.liffId))return;
        await liff.init({liffId:CONFIG.liffId});
        if(liff.isLoggedIn()){
          try{
            const profile=await liff.getProfile();
            rideLineUserId=profile?.userId||rideLineUserId||"";
            rideLineDisplayName=profile?.displayName||rideLineDisplayName||"";
          }catch(profileError){
            console.warn("RIDE LINE PROFILE READ FAILED:",profileError);
          }
        }
      }catch(error){
        console.error("RIDE LIFF INIT ERROR:",error);
      }
    }

    /* =========================================
'''

          old_fast_close = '''          showRideSendResult("success");
          // iOS LINE LIFF: do not rely only on the delayed timer.
          // Trigger the already-existing return path immediately after the successful send/sync chain.
          setTimeout(rideReturnToLineChat, 80);
'''
          new_fast_close = '''          showRideSendResult("success");
'''

          old_boot = '''    updateLuggageNotice();
    applyPaymentPreferenceOnLoad();
    window.initGoogle=init;
'''
          new_boot = '''    updateLuggageNotice();
    applyPaymentPreferenceOnLoad();
    initRideLiff();
    window.initGoogle=init;
'''

          checks = [
              ('LIFF state anchor', old_state),
              ('80ms special close', old_fast_close),
              ('boot anchor', old_boot),
          ]
          for label, old in checks:
              if old not in s:
                  raise SystemExit(f'{label}: expected code not found; abort')

          s = s.replace(old_state, new_state, 1)
          s = s.replace(old_fast_close, new_fast_close, 1)
          s = s.replace(old_boot, new_boot, 1)

          if 'setTimeout(rideReturnToLineChat, 80)' in s:
              raise SystemExit('80ms special close still present')
          if s.count('initRideLiff();') != 1:
              raise SystemExit('initRideLiff boot count mismatch')
          if s.count('rideReturnTimer=setTimeout(rideReturnToLineChat,1100);') != 1:
              raise SystemExit('1100ms normal return missing')

          p.write_text(s, encoding='utf-8')
          print('ride.html aligned to working LINE return baseline')
          PY

      - name: Verify focused scope
        run: |
          git diff --check
          git diff --stat -- ride.html
          grep -n "async function initRideLiff" ride.html
          grep -n "initRideLiff();" ride.html
          grep -n "rideReturnTimer=setTimeout(rideReturnToLineChat,1100);" ride.html
          if grep -n "setTimeout(rideReturnToLineChat, 80)" ride.html; then
            echo "Unexpected 80ms special close remains"
            exit 1
          fi

      - name: Publish ride fix
        run: |
          git config user.name "TOP Taxi Patch Bot"
          git config user.email "actions@users.noreply.github.com"
          git add ride.html
          git commit -m "fix: align ride LINE return with working pages"
          git push origin main
