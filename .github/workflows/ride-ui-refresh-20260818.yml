name: Ride UI Refresh 20260818

'on':
  push:
    branches:
      - ui-refresh-2026-08-18-ride
    paths:
      - '.github/workflows/ride-ui-refresh-20260818.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-refresh-2026-08-18-ride
          fetch-depth: 0
      - name: Apply ride UI refresh patch
        run: python3 .github/scripts/patch_ride_ui_refresh_20260818.py
      - name: Verify patch
        run: |
          set -euo pipefail
          git diff --check
          grep -q 'id="topTaxiRideUIRefresh20260818"' ride.html
          grep -q '>一般搭車</button>' ride.html
          grep -q '>代駕服務</button>' ride.html
          grep -q '<div id="rideTitle" class="form-title">即時叫車</div>' ride.html
          grep -q '<div class="form-label-small top-taxi-mini-logo"><span>TOP</span> Taxi</div>' ride.html
          if grep -q '>🚕 一般搭車</button>' ride.html; then exit 1; fi
          if grep -q '>🚘 代駕服務</button>' ride.html; then exit 1; fi
      - name: Commit UI refresh
        run: |
          set -euo pipefail
          rm .github/workflows/ride-ui-refresh-20260818.yml
          rm .github/scripts/patch_ride_ui_refresh_20260818.py
          git config user.name 'TOP Taxi automation'
          git config user.email 'actions@users.noreply.github.com'
          git add ride.html .github/workflows/ride-ui-refresh-20260818.yml .github/scripts/patch_ride_ui_refresh_20260818.py
          git commit -m 'feat: refresh ride title and service selector UI'
          git push origin HEAD:ui-refresh-2026-08-18-ride
