name: Fix errand viewport recenter v2

on:
  push:
    paths:
      - '.github/workflows/fix-errand-viewport-recenter-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Patch errand viewport recenter
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('errand.html')
          s = p.read_text(encoding='utf-8')
          js = r'''\n<script id="topTaxiErrandViewportRecenterV4">\n(function(){\n  let timer=0;\n  function recenter(){\n    const y=window.scrollY||document.documentElement.scrollTop||0;\n    document.documentElement.scrollLeft=0;\n    document.body.scrollLeft=0;\n    if(window.scrollX!==0) window.scrollTo(0,y);\n  }\n  function settle(){\n    clearTimeout(timer);\n    recenter();\n    requestAnimationFrame(recenter);\n    timer=setTimeout(recenter,80);\n    setTimeout(recenter,220);\n  }\n  document.addEventListener('focusout',function(e){\n    if(e.target && e.target.closest && e.target.closest('.address-autocomplete')) settle();\n  },true);\n  document.addEventListener('click',function(e){\n    if(e.target && e.target.closest && e.target.closest('.address-suggestion')) settle();\n  },true);\n  if(window.visualViewport){\n    window.visualViewport.addEventListener('resize',settle,{passive:true});\n    window.visualViewport.addEventListener('scroll',function(){\n      if(Math.abs(window.visualViewport.offsetLeft||0)>0.5) settle();\n    },{passive:true});\n  }\n})();\n</script>\n'''
          if 'topTaxiErrandViewportRecenterV4' not in s:
              s = s.replace('</body>', js + '\n</body>', 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Verify and commit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -q 'topTaxiErrandViewportRecenterV4' errand.html
          rm -f .github/workflows/fix-errand-viewport-recenter-v2.yml
          git config user.name "TOP Taxi automation"
          git config user.email "actions@users.noreply.github.com"
          git add errand.html .github/workflows/fix-errand-viewport-recenter-v2.yml
          git commit -m "fix errand iOS viewport recenter after address input"
          git push origin HEAD:main
