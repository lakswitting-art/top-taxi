name: Ride Address UX Round 1
'on':
  push:
    paths:
      - '.github/workflows/ride-address-ux-round1.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply ride address UX patch
        run: python3 .github/scripts/patch_ride_address_ux_round1.py
      - name: Verify and commit
        run: |
          set -euo pipefail
          git diff --check
          grep -q 'Ride Address UX Round 1: scroll-safe suggestions' ride.html
          grep -q 'pointerMoved=false' ride.html
          grep -q 'max-height:min(300px,44vh)' ride.html
          rm .github/workflows/ride-address-ux-round1.yml
          git config user.name 'TOP Taxi automation'
          git config user.email 'actions@users.noreply.github.com'
          git add ride.html .github/workflows/ride-address-ux-round1.yml
          git commit -m 'feat: improve ride mobile address suggestion scrolling'
          git push origin HEAD:main
