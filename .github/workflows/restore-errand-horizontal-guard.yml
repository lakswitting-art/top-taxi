name: Restore errand horizontal viewport guard
on:
  push:
    paths:
      - '.github/workflows/restore-errand-horizontal-guard.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Restore horizontal guard without focus scroll motion
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('errand.html')
          s=p.read_text(encoding='utf-8')
          css='''<style id="topTaxiErrandAddressViewportLockV3">
          html{width:100%;max-width:100%;overflow-x:clip!important;overscroll-behavior-x:none;}
          body{width:100%;max-width:100%;overflow-x:clip!important;overscroll-behavior-x:none;touch-action:pan-y pinch-zoom;position:relative;}
          .page,.booking-card,#errandForm,#addressSection,#extraStopsWrap,.errand-address-block,.address-autocomplete{min-width:0!important;max-width:100%!important;}
          .address-autocomplete{width:100%!important;}
          .address-input,.suggestions,.address-suggestions,.address-suggestion{box-sizing:border-box!important;min-width:0!important;max-width:100%!important;}
          .suggestions,.address-suggestions{left:0!important;right:0!important;width:auto!important;overflow-x:clip!important;}
          </style>'''
          js='''<script id="topTaxiErrandHorizontalViewportGuardV3">
          (()=>{const reset=()=>{const y=window.scrollY||document.documentElement.scrollTop||document.body.scrollTop||0;if((window.scrollX||0)!==0)window.scrollTo(0,y);if(document.documentElement.scrollLeft)document.documentElement.scrollLeft=0;if(document.body.scrollLeft)document.body.scrollLeft=0;};let raf=0;const schedule=()=>{if(raf)return;raf=requestAnimationFrame(()=>{raf=0;reset();});};window.addEventListener('scroll',schedule,{passive:true});document.addEventListener('focusin',e=>{if(e.target&&e.target.matches&&e.target.matches('.address-input'))schedule();},true);document.addEventListener('input',e=>{if(e.target&&e.target.matches&&e.target.matches('.address-input'))schedule();},true);document.addEventListener('click',e=>{if(e.target.closest&&e.target.closest('.address-suggestion,.address-clear-btn')){schedule();setTimeout(reset,0);setTimeout(reset,120);}},true);if(window.visualViewport){window.visualViewport.addEventListener('scroll',schedule,{passive:true});window.visualViewport.addEventListener('resize',schedule,{passive:true});}})();
          </script>'''
          for i in ['topTaxiErrandAddressViewportLockV2','topTaxiErrandAddressViewportLockV3','topTaxiErrandHorizontalViewportGuardV2','topTaxiErrandHorizontalViewportGuardV3']:
              s=re.sub(r'<style[^>]*id=["\']'+re.escape(i)+r'["\'][^>]*>.*?</style>\s*','',s,flags=re.S|re.I)
              s=re.sub(r'<script[^>]*id=["\']'+re.escape(i)+r'["\'][^>]*>.*?</script>\s*','',s,flags=re.S|re.I)
          s=s.replace('</head>',css+'\n</head>',1)
          s=s.replace('</body>',js+'\n</body>',1)
          p.write_text(s,encoding='utf-8')
      - name: Verify and commit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -q 'topTaxiErrandAddressViewportLockV3' errand.html
          grep -q 'topTaxiErrandHorizontalViewportGuardV3' errand.html
          ! grep -q "input.scrollIntoView({ block: 'nearest'" errand.html
          ! grep -q "input.scrollIntoView({ block: 'center'" errand.html
          rm -f .github/workflows/restore-errand-horizontal-guard.yml
          git config user.name "TOP Taxi automation"
          git config user.email "actions@users.noreply.github.com"
          git add errand.html .github/workflows/restore-errand-horizontal-guard.yml
          git commit -m "fix errand horizontal panning after address focus cleanup"
          git push origin HEAD:main
