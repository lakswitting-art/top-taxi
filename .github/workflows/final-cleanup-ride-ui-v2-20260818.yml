name: Final Cleanup Ride UI V2 20260818
'on':
  push:
    paths:
      - '.github/workflows/final-cleanup-ride-ui-v2-20260818.yml'
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: |
          set -euo pipefail
          grep -q 'pickup-label-row' ride-ui-v2.html
          rm .github/workflows/final-cleanup-ride-ui-v2-20260818.yml
          rm -f .github/workflows/verify-ride-ui-v2-clear-position-20260818.yml
          rm -f .github/workflows/patch-ride-ui-v2-clear-position-20260818.yml
          rm -f .github/workflows/patch-ride-ui-v2-clear-position-20260818-trigger.yml
          rm -f .github/workflows/.trigger-ride-ui-clear-position-20260818.yml
          git config user.name 'TOP Taxi automation'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/workflows
          git commit -m 'chore: clean temporary ride V2 workflows'
          git push origin HEAD:main
