name: UI V2 Dynamic Cleanup
on:
  push:
    paths:
      - '.ui-v2-dynamic-cleanup-trigger'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch final UI V2 production details
        run: |
          python - <<'PY'
          from pathlib import Path

          def patch(path, replacements):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              original = s
              for old, new in replacements:
                  if old not in s:
                      print(f'WARN anchor not found in {path}: {old[:100]!r}')
                  s = s.replace(old, new)
              if s != original:
                  p.write_text(s, encoding='utf-8')
                  print('patched', path)
              else:
                  print('no changes', path)

          # Booking: service switching must never re-introduce emoji into the page title.
          patch('index.html', [
              ('? "🚘 預約代駕"\n        : "🚕 預約叫車";', '? "預約代駕"\n        : "預約叫車";'),
          ])

          # Fare: service switching must never re-introduce emoji into the page title.
          patch('fare.html', [
              ('? "🚘 代駕試算"\n            : "💰 車資試算";', '? "代駕試算"\n            : "車資試算";'),
          ])

          # Ride base: remove duplicated helper copy from the source itself and lock title typography.
          ride = Path('ride-ui-v2-base.html')
          s = ride.read_text(encoding='utf-8')
          original = s
          s = s.replace('<p class="sub">選擇地址後，系統會依 Google 即時路線重新預估車資</p>', '')
          s = s.replace('選擇地址後，系統會依 Google 即時路線重新預估車資', '')
          s = s.replace('font-size:16px;font-weight:900}.form-label-small', 'font-size:18px;font-weight:950}.form-label-small')
          s = s.replace('font-size:16px;\n      font-weight:900;', 'font-size:18px;\n      font-weight:950;')
          if s != original:
              ride.write_text(s, encoding='utf-8')
              print('patched ride-ui-v2-base.html')
          else:
              print('no changes ride-ui-v2-base.html')

          # Bump the production wrapper so LINE/Safari cannot keep the old base URL.
          patch('ride.html', [
              ('./ride-ui-v2-base.html?v=20260818-1908', './ride-ui-v2-base.html?v=20260818-1916'),
              ('./ride-ui-v2-base.html?v=20260818-1508', './ride-ui-v2-base.html?v=20260818-1916'),
          ])
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html fare.html ride-ui-v2-base.html ride.html
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Finalize UI V2 titles and ride production header'
            git push
          fi