name: Fix errand viewport recenter
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-errand-viewport-recenter.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch viewport recenter
        shell: python
        run: |
          from pathlib import Path
          p=Path('errand.html')
          s=p.read_text(encoding='utf-8')
          js=r'''
<script id="topTaxiErrandViewportRecenterV4">
(function(){
  let timer=0;
  function recenter(){
    const y=window.scrollY||document.documentElement.scrollTop||0;
    document.documentElement.scrollLeft=0;
    document.body.scrollLeft=0;
    if(window.scrollX!==0) window.scrollTo(0,y);
  }
  function settle(){
    clearTimeout(timer);
    recenter();
    requestAnimationFrame(recenter);
    timer=setTimeout(recenter,80);
    setTimeout(recenter,220);
  }
  document.addEventListener('focusout',function(e){
    if(e.target && e.target.closest && e.target.closest('.address-autocomplete')) settle();
  },true);
  document.addEventListener('click',function(e){
    if(e.target && e.target.closest && e.target.closest('.address-suggestion')) settle();
  },true);
  if(window.visualViewport){
    window.visualViewport.addEventListener('resize',settle,{passive:true});
    window.visualViewport.addEventListener('scroll',function(){
      if(Math.abs(window.visualViewport.offsetLeft||0)>0.5) settle();
    },{passive:true});
  }
})();
</script>
'''
          if 'topTaxiErrandViewportRecenterV4' not in s:
              s=s.replace('</body>',js+'\n</body>',1)
          p.write_text(s,encoding='utf-8')
      - name: Verify and commit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -q 'topTaxiErrandViewportRecenterV4' errand.html
          rm -f .github/workflows/fix-errand-viewport-recenter.yml
          git config user.name "TOP Taxi automation"
          git config user.email "actions@users.noreply.github.com"
          git add errand.html .github/workflows/fix-errand-viewport-recenter.yml
          git commit -m "fix errand iOS viewport recenter after address input"
          git push origin HEAD:main
