name: Errand viewport diagnostics V2
on:
  push:
    paths:
      - '.github/workflows/errand-viewport-debug-v2.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Replace viewport debug with top overlay V2
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('errand.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'<div id="topTaxiViewportDebug".*?</script>\s*','',s,flags=re.S)
          marker='''
<div id="topTaxiViewportDebugV2" style="position:fixed;left:6px;right:6px;top:max(6px,env(safe-area-inset-top));z-index:2147483647;padding:7px 9px;border-radius:10px;background:rgba(0,0,0,.84);color:#fff;font:10px/1.28 -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;pointer-events:none;white-space:pre-wrap;max-height:116px;overflow:hidden"></div>
<script id="topTaxiViewportDebugScriptV2">
(function(){
  const box=document.getElementById('topTaxiViewportDebugV2');
  function n(v){return Math.round((Number(v)||0)*10)/10}
  function css(el,p){try{return el?getComputedStyle(el)[p]:'na'}catch(_){return 'na'}}
  function snap(label){
    const vv=window.visualViewport;
    const a=document.activeElement;
    const r=a&&a.getBoundingClientRect?a.getBoundingClientRect():null;
    const p=document.querySelector('.page');
    const pr=p&&p.getBoundingClientRect?p.getBoundingClientRect():null;
    box.textContent=[
      label+' | active='+(a?(a.className||a.tagName):'none'),
      'scrollX='+n(window.scrollX)+' vv.left='+(vv?n(vv.offsetLeft):'na')+' scale='+(vv?n(vv.scale):'na')+' vw='+(vv?n(vv.width):'na'),
      'active L/R/W='+(r?[n(r.left),n(r.right),n(r.width)].join('/'):'na'),
      'page   L/R/W='+(pr?[n(pr.left),n(pr.right),n(pr.width)].join('/'):'na'),
      'font='+css(a,'fontSize')+' transform='+css(a,'transform')+' zoom='+css(a,'zoom'),
      'doc client/scroll='+(document.documentElement.clientWidth)+'/'+(document.documentElement.scrollWidth)
    ].join('\n');
  }
  function burst(label){snap(label);setTimeout(()=>snap(label+'+80'),80);setTimeout(()=>snap(label+'+220'),220);}
  document.addEventListener('focusin',e=>burst('focusin'),true);
  document.addEventListener('input',()=>snap('input'),true);
  if(window.visualViewport){visualViewport.addEventListener('scroll',()=>snap('vv scroll'),{passive:true});visualViewport.addEventListener('resize',()=>snap('vv resize'),{passive:true});}
  setTimeout(()=>snap('ready'),300);
})();
</script>
'''
          if 'topTaxiViewportDebugScriptV2' not in s:
            s=s.replace('</body>',marker+'\n</body>',1)
          p.write_text(s,encoding='utf-8')
      - name: Verify and commit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -q 'topTaxiViewportDebugScriptV2' errand.html
          rm -f .github/workflows/errand-viewport-debug-v2.yml
          git config user.name "TOP Taxi automation"
          git config user.email "actions@users.noreply.github.com"
          git add errand.html .github/workflows/errand-viewport-debug-v2.yml
          git commit -m "debug errand iOS viewport focus state V2"
          git push origin HEAD:main
