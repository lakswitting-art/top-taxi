name: Fix errand address horizontal overflow

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-errand-address-horizontal-overflow.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch errand horizontal viewport lock
        shell: python
        run: |
          from pathlib import Path
          p = Path('errand.html')
          s = p.read_text(encoding='utf-8')
          style = '''\n<style id="topTaxiErrandAddressViewportLockV2">\nhtml{width:100%;max-width:100%;overflow-x:clip!important;overscroll-behavior-x:none;}\nbody{width:100%;max-width:100%;overflow-x:clip!important;overscroll-behavior-x:none;touch-action:pan-y pinch-zoom;position:relative;}\n.page,.booking-card,#errandForm,#addressSection,#extraStopsWrap,.errand-address-block,.address-autocomplete{min-width:0!important;max-width:100%!important;}\n.address-autocomplete{width:100%!important;}\n.address-input,.suggestions,.address-suggestions,.address-suggestion{box-sizing:border-box!important;min-width:0!important;max-width:100%!important;}\n.suggestions,.address-suggestions{left:0!important;right:0!important;width:auto!important;overflow-x:clip!important;}\n</style>\n'''
          script = '''\n<script id="topTaxiErrandHorizontalViewportGuardV2">\n(()=>{const reset=()=>{const y=window.scrollY||document.documentElement.scrollTop||document.body.scrollTop||0;if((window.scrollX||0)!==0)window.scrollTo(0,y);if(document.documentElement.scrollLeft)document.documentElement.scrollLeft=0;if(document.body.scrollLeft)document.body.scrollLeft=0;};let raf=0;const schedule=()=>{if(raf)return;raf=requestAnimationFrame(()=>{raf=0;reset();});};window.addEventListener('scroll',schedule,{passive:true});document.addEventListener('focusin',schedule,true);document.addEventListener('input',schedule,true);document.addEventListener('change',schedule,true);document.addEventListener('click',e=>{if(e.target.closest('.address-suggestion,.address-clear-btn,.errand-task-option,[data-task]')){schedule();setTimeout(reset,0);setTimeout(reset,120);}},true);if(window.visualViewport){window.visualViewport.addEventListener('scroll',schedule,{passive:true});window.visualViewport.addEventListener('resize',schedule,{passive:true});}})();\n</script>\n'''
          if 'topTaxiErrandAddressViewportLockV2' not in s:
              assert '</head>' in s
              s = s.replace('</head>', style + '\n</head>', 1)
          if 'topTaxiErrandHorizontalViewportGuardV2' not in s:
              assert '</body>' in s
              s = s.replace('</body>', script + '\n</body>', 1)
          p.write_text(s, encoding='utf-8')

      - name: Verify and commit
        run: |
          set -euo pipefail
          git diff --check
          grep -q 'topTaxiErrandAddressViewportLockV2' errand.html
          grep -q 'topTaxiErrandHorizontalViewportGuardV2' errand.html
          git config user.name "lakswitting-art"
          git config user.email "lakswitting@gmail.com"
          git add errand.html
          git commit -m "fix errand address horizontal page panning"
          git push origin main
