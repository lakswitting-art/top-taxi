name: Errand Address AB3
'on':
  push:
    paths: ['.github/workflows/errand-address-ab3.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - name: Patch
        shell: python
        run: |
          from pathlib import Path
          p=Path('errand.html'); s=p.read_text(encoding='utf-8')
          marker="""if(!(taskType==='purchase'&&purchaseLocationMode==='unspecified')){activeSlotKeys.push('p1');root.appendChild(addressBlock(addressSlots.p1));}"""
          repl="""if(!(taskType==='purchase'&&purchaseLocationMode==='unspecified')){activeSlotKeys.push('p1');const p1node=addressBlock(addressSlots.p1);root.appendChild(p1node);root.parentNode.insertBefore(p1node,root);}"""
          if marker not in s: raise SystemExit('p1 render marker not found')
          s=s.replace(marker,repl,1)
          css='''<style id="topTaxiErrandAddressAB3">\n/* AB3: move the real p1 address control completely outside #addressSection while keeping Places. */\n#addressSection + *{}\n</style>'''
          if 'topTaxiErrandAddressAB3' not in s:s=s.replace('</head>',css+'\n</head>',1)
          p.write_text(s,encoding='utf-8')
      - name: Commit
        shell: bash
        run: |
          set -e
          git diff --check
          grep -q 'topTaxiErrandAddressAB3' errand.html
          grep -q 'insertBefore(p1node,root)' errand.html
          rm .github/workflows/errand-address-ab3.yml
          git config user.name 'TOP Taxi automation'
          git config user.email 'actions@users.noreply.github.com'
          git add errand.html .github/workflows/errand-address-ab3.yml
          git commit -m 'test p1 address outside addressSection with Places'
          git push origin HEAD:main