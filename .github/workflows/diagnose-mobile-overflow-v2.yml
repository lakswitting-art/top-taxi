name: Diagnose mobile overflow v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-mobile-overflow-v2.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run mobile layout diagnostics
        shell: python
        run: |
          from pathlib import Path
          from html.parser import HTMLParser
          import subprocess, shutil, json, html

          chrome = shutil.which('google-chrome') or shutil.which('chromium') or shutil.which('chromium-browser')
          print('CHROME=', chrome)
          if not chrome:
              raise SystemExit('Chrome not found')

          diag_js = r'''<script id="__topTaxiOverflowDiagScript">
          (function(){
            function hasClippingAncestor(el){
              let p=el.parentElement;
              while(p && p!==document.body){
                const cs=getComputedStyle(p);
                if(['hidden','auto','scroll','clip'].includes(cs.overflowX)) return true;
                p=p.parentElement;
              }
              return false;
            }
            function snapshot(label){
              const vw=document.documentElement.clientWidth;
              const offenders=[...document.querySelectorAll('body *')].map(el=>{
                const r=el.getBoundingClientRect();
                const cs=getComputedStyle(el);
                return {tag:el.tagName,id:el.id||'',cls:typeof el.className==='string'?el.className.slice(0,140):'',left:+r.left.toFixed(1),right:+r.right.toFixed(1),width:+r.width.toFixed(1),scrollWidth:el.scrollWidth,clientWidth:el.clientWidth,overflowX:cs.overflowX,position:cs.position,whiteSpace:cs.whiteSpace,clipped:hasClippingAncestor(el)};
              }).filter(x => !x.clipped && (x.right>vw+0.5 || x.left<-0.5));
              return {label,innerWidth:window.innerWidth,docClientWidth:vw,docScrollWidth:document.documentElement.scrollWidth,bodyScrollWidth:document.body.scrollWidth,offenders:offenders.slice(0,50)};
            }
            async function run(){
              const out=[];
              out.push(snapshot('initial'));
              const near=document.querySelector('[data-purchase-location="unspecified"]');
              if(near){near.click(); await new Promise(r=>setTimeout(r,60)); out.push(snapshot('purchase-nearby'));}
              let add=document.querySelector('#addStopBtn');
              if(add){add.click(); await new Promise(r=>setTimeout(r,30)); add=document.querySelector('#addStopBtn'); if(add) add.click(); await new Promise(r=>setTimeout(r,60)); out.push(snapshot('after-two-stops'));}
              const pre=document.createElement('pre');
              pre.id='__diag__';
              pre.textContent=JSON.stringify(out);
              document.body.appendChild(pre);
            }
            setTimeout(run,700);
          })();
          </script>'''

          temp = Path('/tmp/top-taxi-diag')
          temp.mkdir(parents=True, exist_ok=True)
          files = ['index.html','ride.html','fare.html','errand.html']
          for f in files:
              s=Path(f).read_text(encoding='utf-8')
              if '</body>' in s:
                  s=s.replace('</body>', diag_js+'\n</body>', 1)
              else:
                  s += diag_js
              (temp/f).write_text(s, encoding='utf-8')

          class Parser(HTMLParser):
              def __init__(self):
                  super().__init__(); self.in_diag=False; self.parts=[]
              def handle_starttag(self, tag, attrs):
                  if tag=='pre' and dict(attrs).get('id')=='__diag__': self.in_diag=True
              def handle_endtag(self, tag):
                  if tag=='pre' and self.in_diag: self.in_diag=False
              def handle_data(self, data):
                  if self.in_diag: self.parts.append(data)

          for width in (393,390,375):
              print('\n===== WIDTH', width, '=====')
              for f in files:
                  cmd=[chrome,'--headless','--no-sandbox','--disable-gpu','--allow-file-access-from-files',f'--window-size={width},852','--virtual-time-budget=2500','--dump-dom',f'file://{temp/f}']
                  cp=subprocess.run(cmd,capture_output=True,text=True,timeout=40)
                  p=Parser(); p.feed(cp.stdout)
                  raw=''.join(p.parts)
                  print(f'FILE={f} WIDTH={width} rc={cp.returncode}')
                  if not raw:
                      print('NO_DIAG', cp.stderr[-500:])
                      continue
                  data=json.loads(html.unescape(raw))
                  for snap in data:
                      print(json.dumps(snap,ensure_ascii=False))

          needles=['100vw','min-width:max-content','min-width: max-content','overflow-x:auto','overflow-x: auto','white-space:nowrap','white-space: nowrap','translateX(','width:calc(','width: calc(']
          print('\n===== STATIC WIDTH-RISK COMPARISON =====')
          for f in files:
              s=Path(f).read_text(encoding='utf-8')
              print('\n###',f)
              for n in needles:
                  c=s.count(n)
                  if c: print(n,c)
