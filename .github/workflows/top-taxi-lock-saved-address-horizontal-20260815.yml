name: TOP Taxi ride saved address final alignment

on:
  push:
    paths:
      - '.github/workflows/top-taxi-lock-saved-address-horizontal-20260815.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply ride saved-address final alignment patch
        run: python3 .github/scripts/patch_ride_saved_address_alignment.py
      - name: Publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ride.html index.html
          git commit -m "fix: align ride saved address flow and typography"
          git push origin main
