name: TOP Taxi ride saved address hint cleanup

on:
  push:
    paths:
      - '.github/workflows/top-taxi-lock-saved-address-horizontal-20260815.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Remove duplicate ride saved-address hint
        run: python3 .github/scripts/patch_ride_duplicate_saved_hint.py
      - name: Publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ride.html
          git commit -m "fix: remove duplicate saved address hint"
          git push origin main
