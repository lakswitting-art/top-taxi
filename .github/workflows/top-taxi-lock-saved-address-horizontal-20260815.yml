name: TOP Taxi ride saved address booking clone

on:
  push:
    paths:
      - '.github/workflows/top-taxi-lock-saved-address-horizontal-20260815.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Clone booking saved-address panel behavior into ride
        run: python3 .github/scripts/patch_ride_saved_address_booking_clone.py
      - name: Publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ride.html
          git commit -m "fix: clone booking saved address panel behavior into ride"
          git push origin main
