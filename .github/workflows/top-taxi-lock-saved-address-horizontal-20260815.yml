name: TOP Taxi editable saved address names

on:
  push:
    paths:
      - '.github/workflows/top-taxi-lock-saved-address-horizontal-20260815.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply editable saved-address names patch
        run: python3 .github/scripts/patch_saved_address_editable_names.py
      - name: Publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ride.html index.html
          git commit -m "fix: make saved address slot names editable"
          git push origin main
