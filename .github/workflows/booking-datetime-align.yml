name: Booking Date Time Align
on:
  push:
    paths:
      - '.booking-datetime-align-trigger'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch booking date/time row
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='/* TOP Taxi V2 booking date/time alignment 2026-08-18 */'
          if marker not in s:
              css='''\n<style>\n%s\n@media (max-width: 520px) {\n  .row:has(#bookDate) {\n    padding-right: 10px;\n  }\n}\n</style>\n''' % marker
              s=s.replace('</head>', css+'</head>', 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "fix: align booking date/time inputs"
          git push