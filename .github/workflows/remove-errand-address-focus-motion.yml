name: Remove errand address focus motion
on:
  push:
    paths:
      - '.github/workflows/remove-errand-address-focus-motion.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Remove errand-only focus viewport motion
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('errand.html')
          s=p.read_text(encoding='utf-8')

          # Remove the old address focus helper that calls scrollIntoView on LIFF/iPhone.
          patterns=[
            r"\n?\s*const\s+vv\s*=\s*window\.visualViewport.*?input\.scrollIntoView\(\{\s*block:\s*'nearest',\s*inline:\s*'nearest',\s*behavior:\s*'smooth'\s*\}\);.*?\n\s*}\n\s*}\n",
            r"\n?\s*const\s+vv\s*=\s*window\.visualViewport.*?input\.scrollIntoView\(\{\s*block:\s*'center',\s*inline:\s*'nearest',\s*behavior:\s*'smooth'\s*\}\);.*?\n\s*}\n\s*}\n"
          ]
          before=s
          for pat in patterns:
              s=re.sub(pat,'\n',s,flags=re.S)

          # Fallback: neutralize any remaining address-only scrollIntoView call.
          s=s.replace("input.scrollIntoView({ block: 'nearest', inline: 'nearest', behavior: 'smooth' });", "/* errand address focus motion removed: match ride behavior */")
          s=s.replace("input.scrollIntoView({ block: 'center', inline: 'nearest', behavior: 'smooth' });", "/* errand address focus motion removed: match ride behavior */")

          # Remove the polishing style added specifically for that focus-motion experiment.
          s=re.sub(r'<style[^>]*id=["\']topTaxiAddressUxRound21["\'][^>]*>.*?</style>\s*','',s,flags=re.S|re.I)

          marker='''\n<script id="topTaxiErrandAddressFocusBaselineV1">\n/* Address inputs should behave like ride.html: no custom horizontal/viewport repositioning. */\ndocument.addEventListener('focusin',function(e){\n  if(e.target && e.target.matches && e.target.matches('.address-input')){\n    document.documentElement.scrollLeft=0;\n    document.body.scrollLeft=0;\n  }\n},true);\n</script>\n'''
          if 'topTaxiErrandAddressFocusBaselineV1' not in s:
              s=s.replace('</body>',marker+'\n</body>',1)

          p.write_text(s,encoding='utf-8')
      - name: Verify and commit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -q 'topTaxiErrandAddressFocusBaselineV1' errand.html
          ! grep -q "input.scrollIntoView({ block: 'nearest'" errand.html
          ! grep -q "input.scrollIntoView({ block: 'center'" errand.html
          rm -f .github/workflows/remove-errand-address-focus-motion.yml
          git config user.name "TOP Taxi automation"
          git config user.email "actions@users.noreply.github.com"
          git add errand.html .github/workflows/remove-errand-address-focus-motion.yml
          git commit -m "fix errand address focus viewport motion"
          git push origin HEAD:main
