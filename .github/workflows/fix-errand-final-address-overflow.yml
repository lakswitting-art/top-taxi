name: Fix errand final address overflow
on:
  push:
    paths:
      - '.github/workflows/fix-errand-final-address-overflow.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch final delivery address overflow
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('errand.html')
          s=p.read_text()
          marker='/* TOP TAXI ERRAND FINAL ADDRESS WIDTH GUARD 2026-08-14 */'
          if marker not in s:
              css='''\n<style>\n/* TOP TAXI ERRAND FINAL ADDRESS WIDTH GUARD 2026-08-14 */\nhtml, body { max-width: 100%; overflow-x: clip !important; }\n.page, .booking-card, .input-group, .address-autocomplete, .address-suggestions, .address-suggestion { min-width: 0 !important; max-width: 100% !important; }\n.address-autocomplete { overflow-x: clip !important; }\n.address-input { min-width: 0 !important; max-width: 100% !important; }\n.address-suggestions { width: 100% !important; box-sizing: border-box !important; contain: inline-size layout paint; overscroll-behavior-x: none; }\n.address-suggestion { box-sizing: border-box !important; overflow: hidden !important; }\n.address-suggestion > * { min-width: 0 !important; max-width: 100% !important; }\n</style>\n'''
              s=s.replace('</head>', css+'\n</head>', 1)
          js_marker='// TOP TAXI ERRAND FINAL ADDRESS VIEWPORT GUARD 2026-08-14'
          if js_marker not in s:
              js='''\n<script>\n// TOP TAXI ERRAND FINAL ADDRESS VIEWPORT GUARD 2026-08-14\n(function(){\n  function resetX(){\n    if (window.scrollX !== 0) window.scrollTo(0, window.scrollY);\n    document.documentElement.scrollLeft = 0;\n    document.body.scrollLeft = 0;\n  }\n  document.addEventListener('focusin', function(e){\n    if (e.target && e.target.classList && e.target.classList.contains('address-input')) {\n      requestAnimationFrame(resetX); setTimeout(resetX, 80); setTimeout(resetX, 320);\n    }\n  });\n  document.addEventListener('input', function(e){\n    if (e.target && e.target.classList && e.target.classList.contains('address-input')) requestAnimationFrame(resetX);\n  }, true);\n  document.addEventListener('click', function(e){\n    if (e.target && e.target.closest && e.target.closest('.address-suggestion')) {\n      requestAnimationFrame(resetX); setTimeout(resetX, 100);\n    }\n  }, true);\n})();\n</script>\n'''
              s=s.replace('</body>', js+'\n</body>', 1)
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add errand.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix errand final delivery address horizontal overflow"
          git push
