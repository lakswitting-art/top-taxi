name: Errand disable Places test
on:
  push:
    paths:
      - '.github/workflows/errand-disable-places-test.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Disable Places binding for temporary A/B test
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('errand.html')
          s=p.read_text(encoding='utf-8')
          # Remove previous wrapper A/B test so this run isolates Places only.
          s=re.sub(r'<style id="topTaxiErrandAddressABTestV1">.*?</script>\s*','',s,flags=re.S)
          # Remove failed recenter experiment if still present.
          s=re.sub(r'<script id="topTaxiErrandAddressFocusRecenterV1">.*?</script>\s*','',s,flags=re.S)
          old='initAutocompleteForVisibleSlots();updateDeliveryModule();syncDeliveryVisibility();updateEstimate();'
          new='/* TEMP NO-PLACES A/B TEST */ updateDeliveryModule();syncDeliveryVisibility();updateEstimate();'
          if old not in s:
              raise SystemExit('target renderAddresses autocomplete call not found')
          s=s.replace(old,new,1)
          # Also prevent dynamically added stop from binding Places during this test.
          s=s.replace('initAutocompleteForSlot(s);','/* TEMP NO-PLACES A/B TEST: initAutocompleteForSlot(s); */',1)
          p.write_text(s,encoding='utf-8')
      - name: Verify and commit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -q 'TEMP NO-PLACES A/B TEST' errand.html
          rm -f .github/workflows/errand-disable-places-test.yml
          git config user.name "TOP Taxi automation"
          git config user.email "actions@users.noreply.github.com"
          git add errand.html .github/workflows/errand-disable-places-test.yml
          git commit -m "test errand address focus without Places binding"
          git push origin HEAD:main
