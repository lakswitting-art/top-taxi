name: Tune errand LIFF safe area
on:
  push:
    paths:
      - '.github/workflows/tune-errand-liff-safe-area.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Add mobile LIFF content guard
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('errand.html')
          s=p.read_text(encoding='utf-8')
          css='''\n<style id="topTaxiErrandLiffSafeAreaV8">\n@media (max-width: 600px){\n  #errandForm{\n    padding-right:12px!important;\n  }\n  .address-autocomplete,\n  .errand-delivery-box,\n  .errand-row-toggle,\n  .errand-address-block,\n  .input-group,\n  textarea,\n  input,\n  select{\n    max-width:100%!important;\n    min-width:0!important;\n  }\n}\n</style>\n'''
          if 'topTaxiErrandLiffSafeAreaV8' not in s:
              s=s.replace('</head>',css+'\n</head>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify and commit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -q 'topTaxiErrandLiffSafeAreaV8' errand.html
          rm -f .github/workflows/tune-errand-liff-safe-area.yml
          git config user.name "TOP Taxi automation"
          git config user.email "actions@users.noreply.github.com"
          git add errand.html .github/workflows/tune-errand-liff-safe-area.yml
          git commit -m "tune errand LIFF right-side safe area"
          git push origin HEAD:main
