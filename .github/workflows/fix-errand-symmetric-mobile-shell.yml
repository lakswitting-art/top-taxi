name: Fix errand symmetric mobile shell
on:
  push:
    paths:
      - '.github/workflows/fix-errand-symmetric-mobile-shell.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply deterministic symmetric shell
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('errand.html')
          s=p.read_text(encoding='utf-8')
          css='''
<style id="topTaxiErrandSymmetricShellV7">
@media (max-width: 600px){
  html, body{
    width:100%!important;
    max-width:100%!important;
    overflow-x:clip!important;
  }
  .page{
    width:calc(100% - 28px)!important;
    max-width:532px!important;
    padding-left:0!important;
    padding-right:0!important;
    margin-left:auto!important;
    margin-right:auto!important;
  }
  .booking-card{
    width:100%!important;
    max-width:100%!important;
    margin-left:0!important;
    margin-right:0!important;
  }
  #errandForm,
  .errand-address-block,
  .address-autocomplete,
  .address-input,
  .errand-delivery-box,
  .errand-row-toggle{
    max-width:100%!important;
    min-width:0!important;
  }
}
</style>
'''
          if 'topTaxiErrandSymmetricShellV7' not in s:
              s=s.replace('</head>',css+'\n</head>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify and commit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -q 'topTaxiErrandSymmetricShellV7' errand.html
          rm -f .github/workflows/fix-errand-symmetric-mobile-shell.yml
          git config user.name "TOP Taxi automation"
          git config user.email "actions@users.noreply.github.com"
          git add errand.html .github/workflows/fix-errand-symmetric-mobile-shell.yml
          git commit -m "fix errand symmetric mobile shell after address selection"
          git push origin HEAD:main
