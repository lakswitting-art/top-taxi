name: Verify Ride UI V2 Clear Position 20260818
'on':
  push:
    paths:
      - '.github/workflows/verify-ride-ui-v2-clear-position-20260818.yml'
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Verify layout and clean workflow
        run: |
          set -euo pipefail
          grep -q 'pickup-label-row' ride-ui-v2.html
          grep -q 'id="clearRideTrip" class="trip-reset-btn pickup-reset-btn"' ride-ui-v2.html
          test "$(grep -o 'id="clearRideTrip"' ride-ui-v2.html | wc -l)" -eq 1
          rm .github/workflows/verify-ride-ui-v2-clear-position-20260818.yml
          git config user.name 'TOP Taxi automation'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/workflows/verify-ride-ui-v2-clear-position-20260818.yml
          git commit -m 'chore: verify ride V2 clear position'
          git push origin HEAD:main
