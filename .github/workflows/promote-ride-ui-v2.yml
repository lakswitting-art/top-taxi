name: Promote Ride UI V2

'on':
  push:
    branches:
      - main
    paths:
      - '.github/ride-ui-v2-promote.trigger'

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Promote tested Ride V2 to production
        run: |
          set -euo pipefail
          cp ride-ui-v2-base.html ride.html
          python3 - <<'PY'
          from pathlib import Path
          p=Path('ride.html')
          s=p.read_text(encoding='utf-8')
          old_style='''<style id="topTaxiRidePickupReset20260818">
.pickup-label-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}
.pickup-label-row .label{margin:0}
.pickup-reset-btn{
  flex:0 0 auto;
  color:#8d8d94;
  font-size:11px;
  font-weight:750;
}
@media(max-width:390px){
  .pickup-reset-btn{font-size:10.5px}
}
</style>'''
          new_style='''<style id="topTaxiRidePickupReset20260818">
.pickup-label-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  width:100%;
}
.pickup-label-row .label{margin:0}
.pickup-reset-btn{
  flex:0 0 auto;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:4px;
  margin-right:4px;
  padding:3px 0 3px 2px;
  color:#8d8d94;
  font-size:11px;
  font-weight:750;
  line-height:1.2;
  white-space:nowrap;
}
.pickup-reset-icon{
  width:15px;
  height:14px;
  fill:none;
  stroke:currentColor;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round;
  flex:0 0 auto;
}
.pickup-reset-btn:active{opacity:.55}
@media(max-width:390px){
  .pickup-reset-btn{margin-right:3px;font-size:10.5px}
  .pickup-reset-icon{width:14.5px;height:13.5px}
}
</style>'''
          old_button='<button id="clearRideTrip" class="trip-reset-btn pickup-reset-btn" type="button">清除本次行程</button>'
          new_button='<button id="clearRideTrip" class="trip-reset-btn pickup-reset-btn" type="button"><svg class="pickup-reset-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14"/><path d="M9 7V4.8c0-.45.35-.8.8-.8h4.4c.45 0 .8.35.8.8V7"/><path d="M7.2 8l.75 11.2c.03.46.39.8.85.8h6.4c.46 0 .82-.34.85-.8L16.8 8"/><path d="M10.2 10.5v6.5M13.8 10.5v6.5"/></svg><span>清除本次行程</span></button>'
          if old_style not in s:
              raise SystemExit('Ride reset style anchor not found')
          if old_button not in s:
              raise SystemExit('Ride reset button anchor not found')
          s=s.replace(old_style,new_style,1).replace(old_button,new_button,1)
          p.write_text(s,encoding='utf-8')
          PY
          grep -q 'class="top-taxi-mini-logo"' ride.html
          grep -q 'hero{display:none!important}' ride.html
          grep -q 'pickup-reset-icon' ride.html
          grep -q '>一般搭車</button>' ride.html
          grep -q '>代駕服務</button>' ride.html
          git diff --check
      - name: Commit production Ride V2
        run: |
          rm -f .github/ride-ui-v2-promote.trigger
          rm -f .github/workflows/promote-ride-ui-v2.yml
          git config user.name 'TOP Taxi automation'
          git config user.email 'actions@users.noreply.github.com'
          git add ride.html .github/ride-ui-v2-promote.trigger .github/workflows/promote-ride-ui-v2.yml
          git commit -m 'feat: promote approved ride mobile UI V2'
          git push origin HEAD:main
