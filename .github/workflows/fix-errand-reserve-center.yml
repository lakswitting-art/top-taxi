name: Fix errand reserve center
on:
  push:
    paths:
      - '.trigger-fix-errand-reserve-center'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Center iOS date time values
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('errand.html')
          s=p.read_text()
          old='#reserveFields input{width:100%!important}'
          new='''#reserveFields input{width:100%!important;text-align:center!important;padding-left:8px!important;padding-right:8px!important}\n#reserveFields input::-webkit-date-and-time-value{text-align:center!important;margin:0 auto!important;width:100%!important}\n#reserveFields input::-webkit-datetime-edit{display:block!important;text-align:center!important;width:100%!important}\n#reserveFields input::-webkit-calendar-picker-indicator{margin-left:0!important}'''
          if old not in s:
              raise SystemExit('target css not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add errand.html
          git commit -m 'fix: center errand reserve date time values'
          git push
