name: Patch errand reserve fields to match booking

on:
  push:
    paths:
      - '.trigger-errand-reserve-match-booking'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch errand reserve date time UI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('errand.html')
          s = p.read_text(encoding='utf-8')
          old = '''#reserveFields{gap:10px!important;padding-right:10px!important}#reserveFields .input-group{min-width:0!important}#reserveFields input{width:100%!important;text-align:center!important;padding-left:8px!important;padding-right:8px!important}
#reserveFields input::-webkit-date-and-time-value{text-align:center!important;margin:0 auto!important;width:100%!important}
#reserveFields input::-webkit-datetime-edit{display:block!important;text-align:center!important;width:100%!important}
#reserveFields input::-webkit-calendar-picker-indicator{margin-left:0!important}'''
          new = '''#reserveFields{gap:18px!important;padding-right:0!important}#reserveFields .input-group{min-width:0!important}#errandDate,#errandTime{width:100%!important;min-height:42px!important;height:42px!important;font-size:14px!important;padding:0 9px!important;text-align:center!important}
#errandDate::-webkit-date-and-time-value,#errandTime::-webkit-date-and-time-value{text-align:center!important;margin:0 auto!important;width:100%!important}
#errandDate::-webkit-datetime-edit,#errandTime::-webkit-datetime-edit{display:block!important;text-align:center!important;width:100%!important}
#errandDate::-webkit-calendar-picker-indicator,#errandTime::-webkit-calendar-picker-indicator{margin-left:0!important}'''
          if old not in s:
              raise SystemExit('reserve CSS target not found')
          s = s.replace(old, new, 1)
          target = "const clearCandidates=Array.from(document.querySelectorAll('button,a,[role=\"button\"]')).filter(el=>/清除(?:本次)?行程/.test(text(el)));"
          inject = "const dateLabel=document.querySelector('label[for=\"errandDate\"]');if(dateLabel)dateLabel.innerHTML='預約日期 <span class=\"field-tag required-tag\">必填</span>';const timeLabel=document.querySelector('label[for=\"errandTime\"]');if(timeLabel)timeLabel.innerHTML='預約時間 <span class=\"field-tag required-tag\">必填</span>';" + target
          if target not in s:
              raise SystemExit('behavior insertion target not found')
          s = s.replace(target, inject, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit production patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add errand.html
          git diff --cached --quiet || git commit -m 'fix: match errand reserve fields to booking'
          git push
