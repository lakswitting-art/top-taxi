name: TOP Taxi address UX round 2.1
on:
  push:
    branches: [main]
    paths: ['.github/workflows/top-taxi-address-round21.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch errand address polish
        shell: python
        run: |
          from pathlib import Path
          p=Path('errand.html')
          s=p.read_text(encoding='utf-8')
          marker='TOP TAXI ADDRESS UX ROUND 2.1｜POLISHED SCROLL'
          if marker not in s:
              style='''\n<style id="topTaxiAddressUxRound21">\n/* ===== TOP TAXI ADDRESS UX ROUND 2.1｜POLISHED SCROLL ===== */\n@media (max-width:520px){\n.suggestions,.address-suggestions{scrollbar-gutter:auto!important;scrollbar-color:rgba(20,20,24,.13) transparent;}\n.suggestions::-webkit-scrollbar,.address-suggestions::-webkit-scrollbar{width:2px!important;}\n.suggestions::-webkit-scrollbar-track,.address-suggestions::-webkit-scrollbar-track{background:transparent!important;}\n.suggestions::-webkit-scrollbar-thumb,.address-suggestions::-webkit-scrollbar-thumb{background:rgba(20,20,24,.13)!important;border-radius:999px!important;}\n}\n</style>\n'''
              s=s.replace('</head>',style+'\n</head>',1)
          old="if (rect.bottom > viewportBottom - 96 || rect.top < viewportTop + 16) {"
          new="if (rect.bottom > viewportBottom - 72 || rect.top < viewportTop + 12) {"
          if old in s:s=s.replace(old,new,1)
          elif new not in s:raise SystemExit('focus trigger not found')
          old2="input.scrollIntoView({ block: 'center', inline: 'nearest', behavior: 'smooth' });"
          new2="input.scrollIntoView({ block: 'nearest', inline: 'nearest', behavior: 'smooth' });"
          if old2 in s:s=s.replace(old2,new2,1)
          elif new2 not in s:raise SystemExit('scroll anchor not found')
          p.write_text(s,encoding='utf-8')
      - name: Verify
        shell: bash
        run: |
          grep -q 'TOP TAXI ADDRESS UX ROUND 2.1' errand.html
          grep -q "block: 'nearest'" errand.html
      - name: Commit
        shell: bash
        run: |
          rm -f .github/workflows/top-taxi-address-round21.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add errand.html .github/workflows/top-taxi-address-round21.yml
          git commit -m 'polish errand address scroll and focus motion'
          git push origin HEAD:main
