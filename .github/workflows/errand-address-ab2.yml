name: Errand Address AB2
'on':
  push:
    paths: ['.github/workflows/errand-address-ab2.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - name: Patch
        shell: python
        run: |
          from pathlib import Path
          p=Path('errand.html'); s=p.read_text(encoding='utf-8')
          old='''d.innerHTML=`<div class="errand-address-head"><label>${slot.key==='p1'?'📍':isFinal?'🏁':'🟡'} ${slot.label} <span class="field-tag ${slot.required?'required-tag':'optional-tag'}">${slot.required?'必填':'選填'}</span></label></div><div id="${slot.key}Box" class="top-taxi-address-control"><span class="address-search-icon">⌕</span><input type="text" id="${slot.key}Input" class="address-input" placeholder="請輸入${slot.label}地址或地標名稱" autocomplete="off" enterkeyhint="search" ${slot.required?'required':''} value="${escapeHtml(initial)}"><button type="button" class="address-clear-btn" id="${slot.key}Clear" ${initial?'':'hidden'}>×</button><div class="address-suggestions" id="${slot.key}Suggestions"></div></div>${isFinal?deliveryModuleHtml():''}`;'''
          new='''d.innerHTML=`<div class="errand-address-head"><label>${slot.key==='p1'?'📍':isFinal?'🏁':'🟡'} ${slot.label} <span class="field-tag ${slot.required?'required-tag':'optional-tag'}">${slot.required?'必填':'選填'}</span></label></div><div id="${slot.key}Box" class="top-taxi-address-control top-taxi-address-ab2"><input type="text" id="${slot.key}Input" class="address-input top-taxi-address-ab2-input" placeholder="請輸入${slot.label}地址或地標名稱" autocomplete="off" ${slot.required?'required':''} value="${escapeHtml(initial)}"><div class="address-suggestions" id="${slot.key}Suggestions"></div></div>${isFinal?deliveryModuleHtml():''}`;'''
          if old not in s: raise SystemExit('address template not found')
          s=s.replace(old,new,1)
          # clear may not exist in AB2; keep data behavior but remove icon/button geometry from the test.
          s=s.replace("const input=d.querySelector(`#${slot.key}Input`),clear=d.querySelector(`#${slot.key}Clear`);","const input=d.querySelector(`#${slot.key}Input`),clear=d.querySelector(`#${slot.key}Clear`);")
          s=s.replace("input.addEventListener('input',()=>{const q=input.value.trim();clear.hidden=!q;slot.place=null;slot.data=q?normalizeAddress({address:q}):null;syncDeliveryVisibility();renderPhoto();updateEstimate();});","input.addEventListener('input',()=>{const q=input.value.trim();if(clear)clear.hidden=!q;slot.place=null;slot.data=q?normalizeAddress({address:q}):null;syncDeliveryVisibility();renderPhoto();updateEstimate();});",1)
          s=s.replace("clear.addEventListener('click',()=>{input.value='';slot.place=null;slot.data=null;clear.hidden=true;const sug=d.querySelector(`#${slot.key}Suggestions`);if(sug){sug.classList.remove('show');sug.innerHTML='';}syncDeliveryVisibility();renderPhoto();updateEstimate();input.focus();});","if(clear)clear.addEventListener('click',()=>{input.value='';slot.place=null;slot.data=null;clear.hidden=true;const sug=d.querySelector(`#${slot.key}Suggestions`);if(sug){sug.classList.remove('show');sug.innerHTML='';}syncDeliveryVisibility();renderPhoto();updateEstimate();input.focus();});",1)
          css='''<style id="topTaxiErrandAddressAB2">\n/* AB2: successful whole-block geometry + Places only. No icon/clear/enterkeyhint. */\n.top-taxi-address-ab2-input{padding-left:14px!important;padding-right:14px!important}\n</style>'''
          s=s.replace('</head>',css+'\n</head>',1)
          p.write_text(s,encoding='utf-8')
      - name: Commit
        shell: bash
        run: |
          set -e
          git diff --check
          grep -q 'topTaxiErrandAddressAB2' errand.html
          grep -q 'top-taxi-address-ab2-input' errand.html
          rm .github/workflows/errand-address-ab2.yml
          git config user.name 'TOP Taxi automation'
          git config user.email 'actions@users.noreply.github.com'
          git add errand.html .github/workflows/errand-address-ab2.yml
          git commit -m 'test stable errand address shell with Places only'
          git push origin HEAD:main