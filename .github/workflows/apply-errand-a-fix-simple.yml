name: Apply errand A fix simple

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-errand-a-fix-simple.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch errand html
        shell: python
        run: |
          from pathlib import Path
          p=Path('errand.html')
          s=p.read_text(encoding='utf-8')

          old="function activeRouteSlots(){const arr=[];if(!(taskType==='purchase'&&purchaseLocationMode==='unspecified'))arr.push(addressSlots.p1);Object.keys(addressSlots).filter(k=>k.startsWith('p2_')&&addressSlots[k].active&&addressSlots[k].manual&&addressValue(k)).sort().forEach(k=>arr.push(addressSlots[k]));if(addressValue('final'))arr.push(addressSlots.final);return arr;}"
          new="""function activeRouteSlots(){
 const stops=Object.keys(addressSlots).filter(k=>k.startsWith('p2_')&&addressSlots[k].active&&addressSlots[k].manual&&addressValue(k)).sort().map(k=>addressSlots[k]);
 if(taskType==='purchase'&&purchaseLocationMode==='unspecified'){
  if(!addressValue('final')||!stops.length)return[];
  return[addressSlots.final,...stops,addressSlots.final];
 }
 const arr=[addressSlots.p1,...stops];if(addressValue('final'))arr.push(addressSlots.final);return arr;
}"""
          assert s.count(old)==1, s.count(old)
          s=s.replace(old,new,1)

          old="function quote(){const extras=extraFees();if(taskType==='move'){const base=currentEstimate?currentEstimate.meterFare:null;return{base,extras,total:base==null?null:base+extras.amount,isStarting:false};}if(taskType==='purchase'&&purchaseLocationMode==='unspecified'){return{base:220,extras,total:220+extras.amount,isStarting:true};}const meter=currentEstimate?Number(currentEstimate.meterFare):null;const base=meter==null?220:Math.max(220,meter);return{base,extras,total:base+extras.amount,isStarting:meter==null||meter<=220};}"
          new="function quote(){const extras=extraFees();if(taskType==='move'){const base=currentEstimate?currentEstimate.meterFare:null;return{base,extras,total:base==null?null:base+extras.amount,isStarting:false};}const meter=currentEstimate?Number(currentEstimate.meterFare):null;if(taskType==='purchase'&&purchaseLocationMode==='unspecified'){const base=meter==null?220:Math.max(220,meter);return{base,extras,total:base+extras.amount,isStarting:meter==null||meter<=220};}const base=meter==null?220:Math.max(220,meter);return{base,extras,total:base+extras.amount,isStarting:meter==null||meter<=220};}"
          assert s.count(old)==1, s.count(old)
          s=s.replace(old,new,1)

          old="if(taskType==='purchase'&&purchaseLocationMode==='unspecified'){$('#estimateDistance').textContent='送達地點附近購買';$('#estimateDuration').textContent='NT$220 起';$('#fareStatus').textContent='實際費用依送達地點附近實際購買店家、里程與時間計算';return;}if(currentEstimate){"
          new="if(taskType==='purchase'&&purchaseLocationMode==='unspecified'&&!currentEstimate){$('#estimateDistance').textContent='送達地點附近購買';$('#estimateDuration').textContent='NT$220 起';$('#fareStatus').textContent='實際費用依送達地點附近實際購買店家、里程與時間計算';return;}if(currentEstimate){"
          assert s.count(old)==1, s.count(old)
          s=s.replace(old,new,1)

          old="routeRequestNo++;const id=routeRequestNo;currentEstimate=null;routeOptions={FAST:null,SURFACE:null};renderEstimate();if(taskType==='purchase'&&purchaseLocationMode==='unspecified')return;if(!RouteClass)return;"
          new="routeRequestNo++;const id=routeRequestNo;currentEstimate=null;routeOptions={FAST:null,SURFACE:null};renderEstimate();if(!RouteClass)return;"
          assert s.count(old)==1, s.count(old)
          s=s.replace(old,new,1)

          if 'id="topTaxiErrandXLock"' not in s:
              css='''\n<style id="topTaxiErrandXLock">\nhtml,body{width:100%;max-width:100%;overflow-x:hidden;overscroll-behavior-x:none;}\n.page,.booking-card,#errandForm,#addressSection,#extraStopsWrap,.errand-address-block,.errand-purchase-location-mode,.errand-driver-alert,.fare-estimate,.errand-delivery-box{min-width:0;max-width:100%;}\n.errand-row-toggle,.errand-price-main,.fare-estimate-top,.errand-summary-btn{min-width:0;max-width:100%;}\n.errand-price-main span,.errand-summary-btn span,.fare-estimate-distance{min-width:0;overflow-wrap:anywhere;}\n</style>\n'''
              assert '</head>' in s
              s=s.replace('</head>',css+'\n</head>',1)

          p.write_text(s,encoding='utf-8')

      - name: Commit errand only
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "lakswitting-art"
          git config user.email "lakswitting@gmail.com"
          git add errand.html
          git commit -m "fix errand nearby purchase route and x overflow"
          git push origin main
