name: TOP Taxi mobile address UX hotfix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/top-taxi-address-ux-hotfix-20260814.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch production pages
        run: python .github/scripts/top_taxi_address_ux_hotfix_20260814.py
      - name: Validate and publish
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/top-taxi-address-ux-hotfix-20260814.yml
          git rm .github/scripts/top_taxi_address_ux_hotfix_20260814.py
          git add index.html fare.html ride.html errand.html
          git diff --cached --check
          git commit -m "fix: unify mobile address UX"
          git push
