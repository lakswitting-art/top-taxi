<!doctype html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f2f3f5">
  <title>TOP Taxi｜24H 即時叫車</title>
  <style>
    html,body{margin:0;min-height:100%;background:#f2f3f5;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC",Arial,sans-serif}
    .loading{min-height:100vh;display:grid;place-items:center;color:#8d8d94;font-size:13px;font-weight:700}
  </style>
</head>
<body>
  <div class="loading">TOP Taxi 載入中…</div>
  <script>
  (async function(){
    const response=await fetch('./ride-ui-v2-base.html?v=20260818-1508',{cache:'no-store'});
    if(!response.ok)throw new Error('Ride UI base load failed: '+response.status);
    let html=await response.text();

    const oldStyle=`<style id="topTaxiRidePickupReset20260818">
.pickup-label-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}
.pickup-label-row .label{margin:0}
.pickup-reset-btn{
  flex:0 0 auto;
  color:#8d8d94;
  font-size:11px;
  font-weight:750;
}
@media(max-width:390px){
  .pickup-reset-btn{font-size:10.5px}
}
</style>`;

    const newStyle=`<style id="topTaxiRidePickupReset20260818">
.pickup-label-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  width:100%;
}
.pickup-label-row .label{margin:0}
.pickup-reset-btn{
  flex:0 0 auto;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:4px;
  margin-right:4px;
  padding:3px 0 3px 2px;
  color:#8d8d94;
  font-size:11px;
  font-weight:750;
  line-height:1.2;
  white-space:nowrap;
}
.pickup-reset-icon{
  width:13px;
  height:13px;
  fill:none;
  stroke:currentColor;
  stroke-width:1.75;
  stroke-linecap:round;
  stroke-linejoin:round;
  flex:0 0 auto;
}
.pickup-reset-btn:active{opacity:.55}
@media(max-width:390px){
  .pickup-reset-btn{margin-right:3px;font-size:10.5px}
  .pickup-reset-icon{width:12.5px;height:12.5px}
}
</style>`;

    const oldButton='<button id="clearRideTrip" class="trip-reset-btn pickup-reset-btn" type="button">清除本次行程</button>';
    const newButton='<button id="clearRideTrip" class="trip-reset-btn pickup-reset-btn" type="button"><svg class="pickup-reset-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M7 7l1 13h8l1-13M10 11v5M14 11v5"/></svg><span>清除本次行程</span></button>';

    if(!html.includes(oldStyle))throw new Error('Ride reset style anchor not found');
    if(!html.includes(oldButton))throw new Error('Ride reset button anchor not found');

    html=html.replace(oldStyle,newStyle).replace(oldButton,newButton);
    document.open();
    document.write(html);
    document.close();
  })().catch(error=>{
    console.error(error);
    document.body.innerHTML='<div class="loading">頁面載入失敗，請重新整理</div>';
  });
  </script>
</body>
</html>
