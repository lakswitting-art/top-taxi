<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TOP Taxi｜地址核心測試</title>
<style>
:root{--red:#ff1f2d;--ink:#17171b;--muted:#77777d;--line:#e5e5e8;--bg:#f2f3f5}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC",Arial,sans-serif}.page{width:min(100%,560px);margin:0 auto;padding:max(16px,env(safe-area-inset-top)) 14px max(30px,env(safe-area-inset-bottom))}.card{background:#fff;border-radius:22px;padding:20px 18px;box-shadow:0 14px 42px rgba(0,0,0,.08)}h1{margin:0 0 6px;font-size:20px}.sub{color:var(--muted);font-size:12px;line-height:1.6}.tag{display:inline-block;margin:10px 0 16px;padding:6px 9px;border-radius:999px;background:#fff0f1;color:#b51220;font-size:11px;font-weight:850}.grid{display:grid;gap:10px}.btn{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;min-height:50px;padding:0 14px;border:1px solid var(--line);border-radius:14px;background:#fff;color:var(--ink);font-weight:900;text-decoration:none}.btn.primary{border:0;background:linear-gradient(135deg,#ff3341,#e10019);color:#fff}.note{margin-top:16px;padding-top:14px;border-top:1px solid #eee;color:#8e8e94;font-size:11px;line-height:1.7}.loading{min-height:100vh;display:grid;place-items:center;padding:24px;color:#777;font-weight:800;text-align:center}
</style>
</head>
<body>
<div id="app"></div>
<script>
(async function(){
  const params=new URLSearchParams(location.search);
  const page=params.get('page');
  const files={ride:'ride.html',booking:'index.html',fare:'fare.html',errand:'errand-shell-v2.html',dispatch:'fare-public-address-fix.html'};
  if(!page||!files[page]){
    document.getElementById('app').innerHTML=`<main class="page"><section class="card"><h1>TOP Taxi｜地址核心測試</h1><div class="sub">正式頁不受影響；以下頁面會載入 fix/address-core-20260901 分支版本。</div><div class="tag">標準測試：台中市沙鹿區保寧路443號</div><div class="grid"><a class="btn primary" href="?page=ride">即時叫車 <span>→</span></a><a class="btn" href="?page=booking">預約叫車 <span>→</span></a><a class="btn" href="?page=fare">車資試算 <span>→</span></a><a class="btn" href="?page=errand">跑腿服務 <span>→</span></a><a class="btn" href="?page=dispatch">調度車資試算 <span>→</span></a></div><div class="note">測試重點：輸入框、停靠點、確認畫面／試算摘要都必須保留 443號；不可出現保順路124號等無關門牌。地標名稱開頭若為「台灣／臺灣」會在顯示層移除，但 Place ID 與座標不變。</div></section></main>`;
    return;
  }
  document.getElementById('app').innerHTML='<div class="loading">正在載入地址修正版…</div>';
  const raw='https://raw.githubusercontent.com/lakswitting-art/top-taxi/fix/address-core-20260901/'+files[page]+'?v='+Date.now();
  const r=await fetch(raw,{cache:'no-store'});
  if(!r.ok)throw new Error('測試版載入失敗：'+r.status);
  let html=await r.text();

  // TEST PATCH 2026-09-01: Google POI display names can include a redundant Taiwan prefix,
  // e.g. "台灣台中地方法院". Strip it only from the selected display label;
  // do not touch formattedAddress / place_id / coordinates / route data.
  html=html.replace(
    /const selectedMainText=([^;]+);/g,
    'const selectedMainText=String($1).replace(/^(?:台灣|臺灣)/u,"");'
  );

  // The branch wrappers expect root-relative sibling files. Because this launcher lives at repo root,
  // their ./ references continue to resolve against the production base assets without altering them.
  document.open();document.write(html);document.close();
})().catch(function(error){console.error(error);document.body.innerHTML='<div class="loading">測試入口載入失敗，請重新整理。<br>'+String(error.message||error)+'</div>';});
</script>
</body>
</html>
