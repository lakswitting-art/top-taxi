<!doctype html>
<html lang="zh-TW">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>TOP Taxi｜24H 車資試算</title></head>
<body>
<script>
(async()=>{
  const r=await fetch('./fare-ui-base-20260830.html?v=20260830-2249',{cache:'no-store'});
  if(!r.ok) throw new Error('fare base load failed: '+r.status);
  let s=await r.text();

  // Routes 不在地址初始化時載入，避免拖垮 Places。
  const routeInitPattern=/const\s*\{\s*Route\s*\}\s*=\s*await\s+google\.maps\.importLibrary\(\s*["']routes["']\s*\);\s*RouteClass\s*=\s*Route\s*;/;
  if(!routeInitPattern.test(s)) throw new Error('fare routes init patch anchor not found');
  s=s.replace(routeInitPattern,'RouteClass = null;');

  const routeGatePattern=/if\s*\(\s*!RouteClass\s*\)\s*\{[\s\S]*?Google 路線服務尚未載入完成，請稍候再試。[\s\S]*?return;\s*\}/;
  if(!routeGatePattern.test(s)) throw new Error('fare route gate patch anchor not found');
  s=s.replace(routeGatePattern,`if (!RouteClass) {
        try {
            const { Route } = await google.maps.importLibrary("routes");
            RouteClass = Route;
        } catch (routeError) {
            console.error("FARE ROUTES LAZY LOAD ERROR:", routeError);
            showStatus("Google 路線服務暫時無法載入，請稍後再試。", true);
            return;
        }
    }`);

  // 動態頁不等舊 window.load；先把 initGoogle 掛到 window，等整份 document.write 完成後由外層啟動。
  const loadInitPattern=/window\.addEventListener\(\s*["']load["']\s*,\s*initGoogle\s*\);/;
  if(!loadInitPattern.test(s)) throw new Error('fare load init patch anchor not found');
  s=s.replace(loadInitPattern,'window.initGoogle = initGoogle;');

  // 顯示真正的 Google 初始化錯誤，避免誤判 API Key。
  s=s.replace(
    '"Google 地址搜尋載入失敗，請確認 API Key 與 API 設定。",\n            true',
    '"Google 地址搜尋載入失敗：" + String(error?.message || error),\n            true'
  );

  s=s.replace('</body>','<script src="./dispatch-address-city-district-v1.js?v=20260830-2249"><\/script></body>');

  document.open();
  document.write(s);
  document.close();

  // 關鍵：等新文件的 script 全部解析完，再從同一個 window 啟動 initGoogle。
  setTimeout(() => {
    try {
      if (typeof window.initGoogle === 'function') {
        window.initGoogle();
      } else {
        console.error('FARE initGoogle missing after document parse');
        const status = document.getElementById('status');
        if (status) {
          status.textContent = '地址系統初始化失敗：initGoogle 未載入';
          status.classList.add('show','error');
        }
      }
    } catch (e) {
      console.error('FARE initGoogle start error:', e);
    }
  }, 120);
})().catch(e=>{
  console.error(e);
  document.body.textContent='頁面載入失敗，請重新整理';
});
</script>
</body>
</html>
