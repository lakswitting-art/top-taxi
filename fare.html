<!doctype html>
<html lang="zh-TW">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>TOP Taxi｜24H 車資試算</title></head>
<body>
<script>
(async()=>{
  const r=await fetch('./fare-ui-base-20260830.html?v=20260830-1738',{cache:'no-store'});
  if(!r.ok) throw new Error('fare base load failed: '+r.status);
  let s=await r.text();

  // Google Places（地址搜尋）與 Routes（路線試算）分離初始化。
  // Routes 若暫時載入失敗，不得連帶讓上／下車地址欄位整頁失效。
  s=s.replace(
    /const\s*\{\s*Route\s*\}\s*=\s*await\s+google\.maps\.importLibrary\(\s*["']routes["']\s*\);\s*RouteClass\s*=\s*Route\s*;/,
    `try {
            const { Route } = await google.maps.importLibrary("routes");
            RouteClass = Route;
        } catch (routeError) {
            RouteClass = null;
            console.error("FARE ROUTES INIT ERROR:", routeError);
        }`
  );

  if(!s.includes('FARE ROUTES INIT ERROR:')){
    throw new Error('fare routes init patch anchor not found');
  }

  s=s.replace('./dispatch-format-v3.js?v=20260819-001','./dispatch-format-v3.js?v=20260830-1738');
  s=s.replace('</body>','<script src="./dispatch-address-city-district-v1.js?v=20260830-1805"><\/script></body>');
  document.open();document.write(s);document.close();
})().catch(e=>{console.error(e);document.body.textContent='頁面載入失敗，請重新整理';});
</script>
</body>
</html>
