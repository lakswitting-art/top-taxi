<!doctype html>
<html lang="zh-TW">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>TOP Taxi｜24H 車資試算</title></head>
<body>
<script>
(async()=>{
  const r=await fetch('./fare-ui-base-20260830.html?v=20260830-1925',{cache:'no-store'});
  if(!r.ok) throw new Error('fare base load failed: '+r.status);
  let s=await r.text();

  // Places（地址搜尋）與 Routes（路線試算）完全拆開。
  // Routes 就算暫時載入失敗，上／下車與停靠點地址欄位仍必須建立。
  s=s.replace(
    /const\s*\{\s*Route\s*\}\s*=\s*await\s+google\.maps\.importLibrary\(\s*["']routes["']\s*\);\s*RouteClass\s*=\s*Route\s*;/,
    `google.maps.importLibrary("routes")
            .then(({ Route }) => { RouteClass = Route; })
            .catch((routeError) => {
                RouteClass = null;
                console.error("FARE ROUTES PRELOAD ERROR:", routeError);
            });`
  );
  if(!s.includes('FARE ROUTES PRELOAD ERROR:')){
    throw new Error('fare routes preload patch anchor not found');
  }

  // 按「開始試算」時若 Routes 尚未完成背景載入，就現場重試一次。
  const routeGatePattern=/if\s*\(\s*!RouteClass\s*\)\s*\{[\s\S]*?Google 路線服務尚未載入完成，請稍候再試。[\s\S]*?return;\s*\}/;
  if(!routeGatePattern.test(s)) throw new Error('fare route gate patch anchor not found');
  s=s.replace(
    routeGatePattern,
    `if (!RouteClass) {
        try {
            const { Route } = await google.maps.importLibrary("routes");
            RouteClass = Route;
        } catch (routeError) {
            console.error("FARE ROUTES LAZY LOAD ERROR:", routeError);
            showStatus(
                "Google 路線服務暫時無法載入，請稍後再試。",
                true
            );
            return;
        }
    }`
  );

  s=s.replace('./dispatch-format-v3.js?v=20260819-001','./dispatch-format-v3.js?v=20260830-1925');
  s=s.replace('</body>','<script src="./dispatch-address-city-district-v1.js?v=20260830-1925"><\/script></body>');
  document.open();document.write(s);document.close();
})().catch(e=>{console.error(e);document.body.textContent='頁面載入失敗，請重新整理';});
</script>
</body>
</html>
