<!doctype html>
<html lang="zh-TW">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>TOP Taxi｜24H 車資試算</title></head>
<body>
<script>
(async()=>{
  // 保留目前封版 UI／車資邏輯；地址輸入框先建立，Google Places 改成使用時才載入。
  const r=await fetch('./fare-ui-base-20260830.html?v=20260830-2242',{cache:'no-store'});
  if(!r.ok) throw new Error('fare base load failed: '+r.status);
  let s=await r.text();

  // 1) initGoogle 啟動時不要先等待 Places，否則 Places 載入失敗會讓整個地址 UI 都不存在。
  const placesInitPattern=/const\s*\{\s*AutocompleteSuggestion\s*,\s*AutocompleteSessionToken\s*\}\s*=\s*await\s+google\.maps\.importLibrary\(\s*["']places["']\s*\);/;
  if(!placesInitPattern.test(s)) throw new Error('fare places init patch anchor not found');
  s=s.replace(placesInitPattern,'');

  // 2) Routes 只有按「開始試算」時才載入。
  const routeInitPattern=/const\s*\{\s*Route\s*\}\s*=\s*await\s+google\.maps\.importLibrary\(\s*["']routes["']\s*\);\s*RouteClass\s*=\s*Route\s*;/;
  if(!routeInitPattern.test(s)) throw new Error('fare routes init patch anchor not found');
  s=s.replace(routeInitPattern,'RouteClass = null;');

  const routeGatePattern=/if\s*\(\s*!RouteClass\s*\)\s*\{[\s\S]*?Google 路線服務尚未載入完成，請稍候再試。[\s\S]*?return;\s*\}/;
  if(!routeGatePattern.test(s)) throw new Error('fare route gate patch anchor not found');
  s=s.replace(
    routeGatePattern,
    `if (!RouteClass) {
        try {
            const { Route } = await google.maps.importLibrary("routes");
            RouteClass = Route;
        } catch (routeError) {
            console.error("FARE ROUTES LAZY LOAD ERROR:", routeError);
            showStatus(
                "Google 路線服務暫時無法載入，請稍後再試。",
                true
            );
            return;
        }
    }`
  );

  // 3) 地址控制器先建立；session token 等真的搜尋時再建立。
  const tokenInitPattern=/let\s+sessionToken\s*=\s*new\s+AutocompleteSessionToken\(\s*\);/;
  if(!tokenInitPattern.test(s)) throw new Error('fare session token init anchor not found');
  s=s.replace(tokenInitPattern,'let sessionToken = null;');

  const tokenResetPattern=/sessionToken\s*=\s*new\s+AutocompleteSessionToken\(\s*\);/;
  if(!tokenResetPattern.test(s)) throw new Error('fare session token reset anchor not found');
  s=s.replace(tokenResetPattern,'sessionToken = null;');

  // 4) 比照正常工作的 Ride：使用者真的輸入地址時，才 import Places 並建立 token。
  const suggestionTryPattern=/try\s*\{\s*const\s+response\s*=\s*await\s+AutocompleteSuggestion\s*\.fetchAutocompleteSuggestions\(\{/;
  if(!suggestionTryPattern.test(s)) throw new Error('fare suggestion lazy places anchor not found');
  s=s.replace(
    suggestionTryPattern,
    `try {
                        const {
                            AutocompleteSuggestion,
                            AutocompleteSessionToken
                        } = await google.maps.importLibrary("places");

                        sessionToken =
                            sessionToken ||
                            new AutocompleteSessionToken();

                        const response =
                            await AutocompleteSuggestion
                                .fetchAutocompleteSuggestions({`
  );

  // fare 是 fetch + document.write 動態頁；Google loader 建立後再啟動 UI。
  const loadInitPattern=/window\.addEventListener\(\s*["']load["']\s*,\s*initGoogle\s*\);/;
  if(!loadInitPattern.test(s)) throw new Error('fare load init patch anchor not found');
  s=s.replace(loadInitPattern,'window.initGoogle = initGoogle;');

  const loaderEndMarker='});\n\n</script>\n\n\n\n<script id="topTaxiAddressUxV2">';
  if(!s.includes(loaderEndMarker)) throw new Error('fare google loader end anchor not found');
  s=s.replace(
    loaderEndMarker,
    '});\n\n</script>\n<script>initGoogle();<\\/script>\n\n<script id="topTaxiAddressUxV2">'
  );

  // 保留目前派單地址顯示格式。
  s=s.replace(
    '</body>',
    '<script src="./dispatch-address-city-district-v1.js?v=20260830-2242"><\\/script></body>'
  );

  document.open();
  document.write(s);
  document.close();
})().catch(e=>{
  console.error(e);
  document.body.textContent='頁面載入失敗，請重新整理';
});
</script>
</body>
</html>
