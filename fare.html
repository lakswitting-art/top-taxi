<!DOCTYPE html>
<html lang="zh-TW">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>TOP Taxi｜24H 車資試算</title>


<style>

:root {

    --red: #ff1f2d;
    --red-dark: #d40018;

    --black: #08080a;
    --black-2: #101014;

    --white: #ffffff;

    --gray-bg: #f2f3f5;
    --gray-border: #e5e5e8;
    --gray-text: #77777d;
}


/* =========================================
   RESET
========================================= */

* {
    box-sizing: border-box;
}

html {
    background: var(--black);
}

body {

    margin: 0;

    min-height: 100vh;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans TC",
        "PingFang TC",
        Arial,
        sans-serif;

    color: #222;

    background:
        radial-gradient(
            circle at 50% 0%,
            rgba(255,31,45,.22),
            transparent 33%
        ),
        linear-gradient(
            180deg,
            #070709 0%,
            #101014 40%,
            #f2f3f5 40%,
            #f2f3f5 100%
        );

}


/* =========================================
   HERO
========================================= */

.hero {

    text-align: center;

    padding:
        max(16px, env(safe-area-inset-top))
        18px
        24px;

    color: #fff;

}


/* =========================================
   LOGO
========================================= */

.logo-wrap {

    position: relative;

    display: inline-flex;

    align-items: center;
    justify-content: center;

    margin-bottom: 10px;

    animation:
        logoFloat 3.2s
        ease-in-out infinite;

}


.logo-glow {

    position: absolute;

    width: 132px;
    height: 132px;

    border-radius: 50%;

    background:
        rgba(255,20,35,.16);

    filter:
        blur(24px);

}


.logo {

    position: relative;

    width: 120px;
    height: 120px;

    object-fit: cover;

    border-radius: 24px;

    border:
        1px solid
        rgba(255,255,255,.12);

    background: #050506;

    box-shadow:
        0 0 0 1px
        rgba(255,30,45,.35),

        0 12px 35px
        rgba(255,0,25,.22);

}


/* =========================================
   BRAND
========================================= */

.brand {

    margin: 0;

    font-size: 28px;

    line-height: 1.2;

    font-weight: 900;

    letter-spacing: .5px;

}


.brand-red {
    color: var(--red);
}


.system-name {

    margin-top: 4px;

    color: #f3f3f4;

    font-size: 15px;

    font-weight: 700;

    letter-spacing: 2px;

}


.hero-description {

    margin-top: 9px;

    color: #a8a8ae;

    font-size: 12px;

    line-height: 1.8;

}


/* =========================================
   PAGE
========================================= */

.page {

    width: 100%;

    max-width: 560px;

    margin: -6px auto 0;

    padding:
        0 14px
        max(
            34px,
            env(safe-area-inset-bottom)
        );

}


/* =========================================
   CARD
========================================= */

.fare-card {

    background:
        rgba(255,255,255,.98);

    border-radius: 22px;

    padding:
        22px 18px;

    border:
        1px solid
        rgba(255,255,255,.7);

    box-shadow:
        0 18px 50px
        rgba(0,0,0,.18);

}


/* =========================================
   HEADER
========================================= */

.form-header {

    display: flex;

    justify-content:
        space-between;

    align-items: center;

    margin-bottom: 20px;

}


.form-title {

    color: #1d1d20;

    font-size: 16px;

    font-weight: 900;

}


.form-label-small {

    color: #aaa;

    font-size: 11px;

    letter-spacing: 1px;

}


/* =========================================
   FORM
========================================= */

.input-group {

    margin-bottom: 16px;

}


label {

    display: block;

    margin-bottom: 8px;

    color: #26262a;

    font-size: 15px;

    font-weight: 800;

}


.place-box {

    width: 100%;

}


/* Google Places 元件 */

gmp-place-autocomplete {

    width: 100%;

    min-height: 50px;

    display: block;

    border:
        1px solid
        var(--gray-border);

    border-radius: 12px;

    background: #fafafa;

   

    transition:
        border .15s,
        box-shadow .15s;

}

gmp-place-autocomplete::part(input) {
    color: #555555 !important;
    font-weight: 500;
}

gmp-place-autocomplete::part(input)::placeholder {
    color: #999999 !important;
    opacity: 1;
}
gmp-place-autocomplete:focus-within {

    border-color:
        var(--red);

    box-shadow:
        0 0 0 3px
        rgba(255,31,45,.08);

}


/* =========================================
   ROUTE LINE
========================================= */

.route-visual {

    width: 2px;

    height: 14px;

    margin:
        -8px 0 -8px 18px;

    background:
        repeating-linear-gradient(
            to bottom,
            #ddd 0px,
            #ddd 3px,
            transparent 3px,
            transparent 6px
        );

}


/* =========================================
   BUTTON
========================================= */

.submit-btn {

    width: 100%;

    min-height: 54px;

    margin-top: 8px;

    border: none;

    border-radius: 15px;

    background:
        linear-gradient(
            135deg,
            #ff3341,
            #e10019
        );

    color: #fff;

    font-size: 17px;

    font-weight: 900;

    letter-spacing: .3px;

    cursor: pointer;

    box-shadow:
        0 11px 27px
        rgba(210,0,22,.24);

}


.submit-btn:disabled {

    opacity: .6;

    cursor: default;

}


/* =========================================
   STATUS
========================================= */

.status {

    display: none;

    margin-top: 15px;

    padding: 13px 14px;

    border-radius: 12px;

    background: #f7f7f8;

    color: #666;

    font-size: 12px;

    line-height: 1.7;

    text-align: center;

}


.status.show {
    display: block;
}


.status.error {

    color: #a31320;

    background: #fff1f2;

    border:
        1px solid
        #ffd3d7;

}


/* =========================================
   RESULTS
========================================= */

.results {

    display: none;

    margin-top: 23px;

    padding-top: 21px;

    border-top:
        1px solid #ededf0;

}


.results.show {
    display: block;
}


.results-title {

    margin-bottom: 14px;

    color: #222;

    font-size: 15px;

    font-weight: 900;

}


.results-subtitle {

    display: block;

    margin-top: 4px;

    color: #999;

    font-size: 11px;

    font-weight: 500;

}


/* =========================================
   ROUTE OPTION
========================================= */

.route-option {

    margin-bottom: 14px;

    padding: 17px;

    border:
        1px solid #e5e5e8;

    border-radius: 17px;

    background: #fff;

    box-shadow:
        0 5px 18px
        rgba(0,0,0,.045);

}


.route-option.fast {

    border:
        1px solid
        rgba(255,31,45,.30);

    background:
        linear-gradient(
            180deg,
            #fff,
            #fffafb
        );

}


.route-top {

    display: flex;

    justify-content:
        space-between;

    align-items:
        flex-start;

    gap: 12px;

}


.route-name {

    font-size: 16px;

    font-weight: 900;

    color: #1e1e22;

}


.route-tag {

    display: inline-block;

    padding:
        4px 8px;

    border-radius: 999px;

    background:
        #f1f1f3;

    color:
        #727277;

    font-size: 10px;

    font-weight: 800;

}


.fast .route-tag {

    background:
        #fff0f1;

    color:
        var(--red-dark);

}


.route-info {

    display: flex;

    gap: 13px;

    margin-top: 12px;

    color: #77777d;

    font-size: 13px;

    font-weight: 600;

}


.fare-price {

    margin-top: 15px;

    color: #161619;

    font-size: 13px;

    font-weight: 700;

}


.fare-price strong {

    margin-left: 5px;

    color: var(--red);

    font-size: 29px;

    font-weight: 900;

}


.save-time {

    min-height: 18px;

    margin-top: 4px;

    color: #078142;

    font-size: 11px;

    font-weight: 700;

}


/* =========================================
   SELECT BUTTON
========================================= */

.route-btn {

    width: 100%;

    min-height: 45px;

    margin-top: 14px;

    border:
        1px solid #ddd;

    border-radius: 12px;

    background:
        #f7f7f8;

    color: #242428;

    font-size: 14px;

    font-weight: 900;

    cursor: pointer;

}


.fast .route-btn {

    border: none;

    background: #111114;

    color: #fff;

}


/* =========================================
   NOTICE
========================================= */

.notice {

    margin-top: 19px;

    padding-top: 16px;

    border-top:
        1px solid #eee;

    text-align: center;

    color: #8e8e94;

    font-size: 12px;

    line-height: 1.8;

}


/* =========================================
   FOOTER
========================================= */

.footer {

    text-align: center;

    margin-top: 19px;

    color: #999;

    font-size: 10px;

    line-height: 1.7;

}


/* =========================================
   ANIMATION
========================================= */

@keyframes logoFloat {

    0%,100% {
        transform:
            translateY(0);
    }

    50% {
        transform:
            translateY(-3px);
    }

}


/* =========================================
   MOBILE
========================================= */

@media (max-width: 520px) {

    .hero {

        padding:
            max(12px, env(safe-area-inset-top))
            14px
            18px;

    }

    .logo {

        width: 100px;
        height: 100px;

        border-radius: 20px;

    }

    .logo-glow {

        width: 112px;
        height: 112px;

    }

    .brand {
        font-size: 25px;
    }

    .fare-card {

        padding:
            19px 15px;

        border-radius: 20px;

    }

}

</style>

</head>


<body>


<header class="hero">


    <div class="logo-wrap">

        <div class="logo-glow"></div>

        <img
            src="logo.png"
            alt="TOP Taxi Logo"
            class="logo"
        >

    </div>


    <h1 class="brand">

        <span class="brand-red">
            TOP
        </span>

        Taxi

    </h1>


    <div class="system-name">
        24H 車資試算
    </div>


    <div class="hero-description">

        快速比較行車路線｜掌握預估距離・時間與車資

    </div>


</header>



<main class="page">


<div class="fare-card">


    <div class="form-header">

        <div class="form-title">
            💰 車資試算
        </div>

        <div class="form-label-small">
            TOP TAXI FARE
        </div>

    </div>



    <!-- 上車地點 -->

    <div class="input-group">

        <label>
            📍 上車地點
        </label>

        <div
            id="pickupBox"
            class="place-box"
        ></div>

    </div>



    <div class="route-visual"></div>



    <!-- 下車地點 -->

    <div class="input-group">

        <label>
            🏁 下車地點
        </label>

        <div
            id="dropoffBox"
            class="place-box"
        ></div>

    </div>



    <button
        id="calculateBtn"
        type="button"
        class="submit-btn"
        onclick="calculateRoutes()"
    >

        開始試算 →

    </button>



    <div
        id="status"
        class="status"
    ></div>



    <!-- RESULTS -->

    <section
        id="results"
        class="results"
    >


        <div class="results-title">

            🚕 路線試算結果

            <span class="results-subtitle">

                請選擇您偏好的行車方式

            </span>

        </div>



        <!-- 平面道路 -->

        <div class="route-option">

            <div class="route-top">

                <div class="route-name">
                    🚕 平面道路
                </div>

                <span class="route-tag">
                    避開高速
                </span>

            </div>


            <div class="route-info">

                <span id="normalDistance">
                    📏 -- km
                </span>

                <span id="normalDuration">
                    ⏱️ 約 -- 分鐘
                </span>

            </div>


            <div class="fare-price">

                預估車資

                <strong id="normalFare">
                    $---
                </strong>

            </div>


            <button
                type="button"
                class="route-btn"
                onclick="selectRoute('平面道路')"
            >

                選擇此路線

            </button>

        </div>



        <!-- 快速路線 -->

        <div class="route-option fast">

            <div class="route-top">

                <div class="route-name">
                    🛣️ 快速路線
                </div>

                <span class="route-tag">
                    推薦
                </span>

            </div>


            <div class="route-info">

                <span id="fastDistance">
                    📏 -- km
                </span>

                <span id="fastDuration">
                    ⏱️ 約 -- 分鐘
                </span>

            </div>


            <div class="fare-price">

                預估車資

                <strong id="fastFare">
                    $---
                </strong>

            </div>


            <div
                id="saveTime"
                class="save-time"
            ></div>


            <button
                type="button"
                class="route-btn"
                onclick="selectRoute('快速路線')"
            >

                選擇此路線

            </button>

        </div>


    </section>



    <div class="notice">

        ※ 車資為系統預估金額，
        實際金額依實際行駛狀況為準。<br>

        ※ 高速／快速道路不另外收取國道費用。<br>

        ※ 行車路線可能依即時交通狀況調整。

    </div>


</div>



<div class="footer">

    TOP Taxi<br>

    Professional Transportation<br>

    24H Service

</div>


</main>



<script>


/* =========================================
   GOOGLE DATA
========================================= */

let pickupPlace = null;

let dropoffPlace = null;

let RouteClass = null;



/* =========================================
   INITIALIZE GOOGLE
========================================= */

async function initGoogle() {

    try {


        const {
            PlaceAutocompleteElement
        } =
 
        await google.maps.importLibrary(
            "places"
        );


        const {
            Route
        } =
        await google.maps.importLibrary(
            "routes"
        );


        RouteClass = Route;



        /* =====================================
           PICKUP
        ====================================== */

        const pickupAutocomplete =
    new PlaceAutocompleteElement();

pickupAutocomplete.includedRegionCodes = ["tw"];
pickupAutocomplete.requestedLanguage = "zh-TW";
pickupAutocomplete.requestedRegion = "TW";


        pickupAutocomplete.placeholder =
            "請輸入上車地址或地標";


        pickupAutocomplete
            .setAttribute(
                "aria-label",
                "上車地點"
            );


        document
            .getElementById(
                "pickupBox"
            )
            .appendChild(
                pickupAutocomplete
            );



        /* =====================================
           DROPOFF
        ====================================== */

        const dropoffAutocomplete =
    new PlaceAutocompleteElement();

dropoffAutocomplete.includedRegionCodes = ["tw"];
dropoffAutocomplete.requestedLanguage = "zh-TW";
dropoffAutocomplete.requestedRegion = "TW";


        dropoffAutocomplete.placeholder =
            "請輸入目的地地址或地標";


        dropoffAutocomplete
            .setAttribute(
                "aria-label",
                "下車地點"
            );


        document
            .getElementById(
                "dropoffBox"
            )
            .appendChild(
                dropoffAutocomplete
            );



        /* =====================================
           PICKUP SELECT
        ====================================== */

        pickupAutocomplete
            .addEventListener(
                "gmp-select",
                async (event) => {


                    const place =
                        event
                        .placePrediction
                        .toPlace();


                    await place.fetchFields({

                        fields: [

                            "id",
                            "displayName",
                            "formattedAddress",
                            "location"

                        ]

                    });


                    pickupPlace = place;


                    hideResults();

                }
            );



        /* =====================================
           DROPOFF SELECT
        ====================================== */

        dropoffAutocomplete
            .addEventListener(
                "gmp-select",
                async (event) => {


                    const place =
                        event
                        .placePrediction
                        .toPlace();


                    await place.fetchFields({

                        fields: [

                            "id",
                            "displayName",
                            "formattedAddress",
                            "location"

                        ]

                    });


                    dropoffPlace = place;


                    hideResults();

                }
            );


    }

    catch (error) {


        console.error(
            error
        );


        showStatus(
            "Google 地址搜尋載入失敗，請確認 API Key 與 API 設定。",
            true
        );


    }

}



/* =========================================
   CALCULATE ROUTES
========================================= */

async function calculateRoutes() {


    if (
        !pickupPlace ||
        !dropoffPlace
    ) {


        showStatus(
            "請從 Google 地址建議中選擇上車地點與下車地點。",
            true
        );


        return;

    }



    if (!RouteClass) {


        showStatus(
            "Google 路線服務尚未載入完成，請稍候再試。",
            true
        );


        return;

    }



    const button =
        document.getElementById(
            "calculateBtn"
        );


    button.disabled = true;

    button.textContent =
        "正在計算路線...";


    showStatus(
        "正在取得 Google 即時路線與預估時間...",
        false
    );


    try {


        /* =====================================
           快速路線
           允許高速公路
        ====================================== */

        const fastRequest = {

            origin:
                pickupPlace,

            destination:
                dropoffPlace,

            travelMode:
                "DRIVING",

            routingPreference:
                "TRAFFIC_AWARE",

            routeModifiers: {

                avoidHighways:
                    false,

                avoidTolls:
                    false,

                avoidFerries:
                    true

            },

            fields: [

                "distanceMeters",
                "durationMillis"

            ]

        };


        /* =====================================
           平面道路
           避開高速公路
        ====================================== */

        const normalRequest = {

            origin:
                pickupPlace,

            destination:
                dropoffPlace,

            travelMode:
                "DRIVING",

            routingPreference:
                "TRAFFIC_AWARE",

            routeModifiers: {

                avoidHighways:
                    true,

                avoidTolls:
                    false,

                avoidFerries:
                    true

            },

            fields: [

                "distanceMeters",
                "durationMillis"

            ]

        };



        /* =====================================
           同時計算兩條
        ====================================== */

        const [
            fastResponse,
            normalResponse
        ] =
        await Promise.all([

            RouteClass.computeRoutes(
                fastRequest
            ),

            RouteClass.computeRoutes(
                normalRequest
            )

        ]);



        const fastRoute =
            fastResponse
            .routes?.[0];


        const normalRoute =
            normalResponse
            .routes?.[0];



        if (
            !fastRoute ||
            !normalRoute
        ) {


            throw new Error(
                "找不到可用路線"
            );

        }



        /* =====================================
           FORMAT DATA
        ====================================== */

        const fastDistance =
            fastRoute.distanceMeters /
            1000;


        const normalDistance =
            normalRoute.distanceMeters /
            1000;


        const fastMinutes =
            Math.ceil(
                fastRoute.durationMillis /
                60000
            );


        const normalMinutes =
            Math.ceil(
                normalRoute.durationMillis /
                60000
            );



        /* =====================================
           DISPLAY
        ====================================== */

        document
            .getElementById(
                "fastDistance"
            )
            .textContent =
            "📏 " +
            fastDistance.toFixed(1) +
            " km";


        document
            .getElementById(
                "fastDuration"
            )
            .textContent =
            "⏱️ 約 " +
            fastMinutes +
            " 分鐘";



        document
            .getElementById(
                "normalDistance"
            )
            .textContent =
            "📏 " +
            normalDistance.toFixed(1) +
            " km";


        document
            .getElementById(
                "normalDuration"
            )
            .textContent =
            "⏱️ 約 " +
            normalMinutes +
            " 分鐘";



        /* =====================================
           SAVE TIME
        ====================================== */

        const save =
            normalMinutes -
            fastMinutes;


        const saveTime =
            document.getElementById(
                "saveTime"
            );


        if (save > 0) {


            saveTime.textContent =
                "快速路線約可節省 " +
                save +
                " 分鐘";


        }

        else {


            saveTime.textContent =
                "目前交通狀況下兩條路線時間相近";


        }



        /* =====================================
           FARE
           下一步會換成正式公式
        ====================================== */

        document
            .getElementById(
                "normalFare"
            )
            .textContent =
            "$---";


        document
            .getElementById(
                "fastFare"
            )
            .textContent =
            "$---";



        hideStatus();


        document
            .getElementById(
                "results"
            )
            .classList
            .add(
                "show"
            );


        setTimeout(() => {


            document
                .getElementById(
                    "results"
                )
                .scrollIntoView({

                    behavior:
                        "smooth",

                    block:
                        "start"

                });


        },100);


    }

    catch (error) {


        console.error(
            error
        );


        showStatus(

            "路線計算失敗。請確認 Maps JavaScript API、Places API（新版）與 Routes API 都已啟用。",

            true

        );


    }

    finally {


        button.disabled =
            false;


        button.textContent =
            "開始試算 →";


    }

}



/* =========================================
   SELECT ROUTE
========================================= */

function selectRoute(
    routeName
) {


    alert(

        "已選擇：" +
        routeName +
        "\n\n下一步會在這裡加入「傳送給 TOP Taxi 客服」。"

    );


}



/* =========================================
   STATUS
========================================= */

function showStatus(
    message,
    error
) {


    const status =
        document.getElementById(
            "status"
        );


    status.textContent =
        message;


    status.className =
        error
        ?
        "status show error"
        :
        "status show";


}



function hideStatus() {


    document
        .getElementById(
            "status"
        )
        .className =
        "status";


}



function hideResults() {


    document
        .getElementById(
            "results"
        )
        .classList
        .remove(
            "show"
        );


}



/* =========================================
   START
========================================= */

window.addEventListener(
    "load",
    initGoogle
);
