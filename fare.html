<!doctype html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>TOP Taxi｜24H 車資試算</title>
</head>
<body>
<script>
(async()=>{
  const r=await fetch('./fare-ui-base-20260830.html?v=20260830-2302',{cache:'no-store'});
  if(!r.ok) throw new Error('fare base load failed: '+r.status);
  let s=await r.text();

  // Fare 的真正問題不是 API Key，而是舊 wrapper 用 async fetch + document.write
  // 重建整份文件，LINE iOS WKWebView 對這種 script / load lifecycle 很不穩定。
  // 改成先建立 DOM，再依原始順序重新執行 scripts，不再 document.open/write/close。

  // 地址初始化時只載入 Places；Routes 延後到按「開始試算」才載入。
  const routeInitPattern=/const\s*\{\s*Route\s*\}\s*=\s*await\s+google\.maps\.importLibrary\(\s*["']routes["']\s*\);\s*RouteClass\s*=\s*Route\s*;/;
  if(!routeInitPattern.test(s)) throw new Error('fare routes init patch anchor not found');
  s=s.replace(routeInitPattern,'RouteClass = null;');

  const routeGatePattern=/if\s*\(\s*!RouteClass\s*\)\s*\{[\s\S]*?Google 路線服務尚未載入完成，請稍候再試。[\s\S]*?return;\s*\}/;
  if(!routeGatePattern.test(s)) throw new Error('fare route gate patch anchor not found');
  s=s.replace(routeGatePattern,`if (!RouteClass) {
        try {
            const { Route } = await google.maps.importLibrary("routes");
            RouteClass = Route;
        } catch (routeError) {
            console.error("FARE ROUTES LAZY LOAD ERROR:", routeError);
            showStatus("Google 路線服務暫時無法載入，請稍後再試。", true);
            return;
        }
    }`);

  // 不再等待已經發生過的 window.load；等所有 base scripts 執行完後由 wrapper 明確啟動。
  const loadInitPattern=/window\.addEventListener\(\s*["']load["']\s*,\s*initGoogle\s*\);/;
  if(!loadInitPattern.test(s)) throw new Error('fare load init patch anchor not found');
  s=s.replace(loadInitPattern,'window.initGoogle = initGoogle;');

  const parsed=new DOMParser().parseFromString(s,'text/html');
  const scriptData=[...parsed.querySelectorAll('script')].map(el=>({
    attrs:[...el.attributes].map(a=>[a.name,a.value]),
    code:el.textContent||''
  }));
  parsed.querySelectorAll('script').forEach(el=>el.remove());

  document.documentElement.lang=parsed.documentElement.lang||'zh-TW';
  document.head.innerHTML=parsed.head.innerHTML+'<style>.footer{display:none!important}</style>';
  document.body.innerHTML=parsed.body.innerHTML;

  const appendScript=async info=>{
    const el=document.createElement('script');
    for(const [name,value] of info.attrs) el.setAttribute(name,value);
    const src=el.getAttribute('src');
    if(src){
      await new Promise((resolve,reject)=>{
        el.onload=resolve;
        el.onerror=()=>reject(new Error('script load failed: '+src));
        document.body.appendChild(el);
      });
    }else{
      el.textContent=info.code;
      document.body.appendChild(el);
    }
  };

  for(const info of scriptData){
    await appendScript(info);
  }

  // 所有 Google loader / LIFF / UI scripts 都已存在後才啟動地址系統。
  if(typeof window.initGoogle!=='function'){
    throw new Error('initGoogle missing after stable DOM boot');
  }
  await window.initGoogle();

  const dispatch=document.createElement('script');
  dispatch.src='./dispatch-address-city-district-v1.js?v=20260830-2302';
  document.body.appendChild(dispatch);
})().catch(e=>{
  console.error('FARE STABLE BOOT ERROR:',e);
  const status=document.getElementById('status');
  if(status){
    status.textContent='地址系統載入失敗：'+String(e?.message||e);
    status.classList.add('show','error');
  }else{
    document.body.innerHTML='<div style="padding:24px;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;color:#b91c1c">車資試算載入失敗，請重新開啟頁面。</div>';
  }
});
</script>
</body>
</html>
