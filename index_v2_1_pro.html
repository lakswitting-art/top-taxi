<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>TOP Taxi｜24H 預約系統</title>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

<style>
:root{
  --red:#ff2436;
  --red2:#b90016;
  --black:#07070a;
  --black2:#121217;
  --white:#fff;
  --soft:#f4f5f7;
  --line:#e4e5e9;
  --muted:#8c8d93;
  --green:#06C755;
}

*{box-sizing:border-box}

html{
  background:var(--black);
  -webkit-text-size-adjust:100%;
}

body{
  margin:0;
  min-height:100vh;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC",Arial,sans-serif;
  color:#222;
  background:
    linear-gradient(180deg,#07070a 0%,#121217 35%,#f2f3f5 35%,#f2f3f5 100%);
  padding-bottom:env(safe-area-inset-bottom);
}

/* ===== HERO ===== */
.hero{
  position:relative;
  text-align:center;
  color:#fff;
  padding:
    max(16px,env(safe-area-inset-top))
    18px
    24px;
  background:
    radial-gradient(circle at 50% 18%,rgba(255,36,54,.14),transparent 36%),
    linear-gradient(145deg,#07070a 0%,#0e0e13 55%,#1b0a0d 100%);
  overflow:hidden;
}

/* 移除原本的半圓裝飾，不使用 .hero::after */

.logo-wrap{
  position:relative;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  margin-bottom:10px;
  animation:fadeDown .55s ease both;
}

.logo-glow{
  position:absolute;
  width:104px;
  height:104px;
  border-radius:50%;
  background:rgba(255,34,51,.22);
  filter:blur(22px);
  animation:pulseGlow 2.6s ease-in-out infinite;
}

.logo{
  position:relative;
  width:94px;
  height:94px;
  object-fit:cover;
  border-radius:20px;
  border:1px solid rgba(255,255,255,.12);
  background:#050506;
  box-shadow:
    0 0 0 1px rgba(255,36,54,.38),
    0 10px 28px rgba(220,0,25,.24);
}

.brand{
  margin:0;
  font-size:27px;
  line-height:1.15;
  font-weight:900;
  letter-spacing:.4px;
  animation:fadeDown .62s ease both;
}
.brand-red{color:var(--red)}

.system-name{
  margin-top:4px;
  font-size:16px;
  font-weight:800;
  letter-spacing:2px;
  color:#f5f5f6;
  animation:fadeDown .68s ease both;
}

.hero-description{
  margin-top:10px;
  color:#aaaab0;
  font-size:12px;
  line-height:1.6;
  animation:fadeDown .74s ease both;
}

/* ===== PAGE / CARD ===== */
.page{
  width:100%;
  max-width:540px;
  margin:-6px auto 0;
  padding:0 12px max(30px,env(safe-area-inset-bottom));
}

.booking-card{
  background:rgba(255,255,255,.985);
  border-radius:22px;
  padding:20px 16px 19px;
  border:1px solid rgba(255,255,255,.75);
  box-shadow:
    0 18px 45px rgba(0,0,0,.16),
    0 2px 8px rgba(0,0,0,.04);
  animation:cardUp .5s cubic-bezier(.2,.8,.2,1) both;
}

/* ===== LINE STATUS ===== */
.connection-status{
  display:flex;
  align-items:center;
  gap:7px;
  margin-bottom:12px;
  color:#8e8f95;
  font-size:12px;
}
.status-dot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:#aaa;
}
.connection-status.ready{color:#43895b}
.connection-status.ready .status-dot{
  background:var(--green);
  box-shadow:0 0 0 4px rgba(6,199,85,.10);
}

.line-user{
  display:none;
  margin-bottom:15px;
  padding:10px 12px;
  border-radius:11px;
  background:#effff4;
  border:1px solid #caefd6;
  color:#087d39;
  font-size:13px;
  line-height:1.4;
  animation:fadeIn .35s ease both;
}

/* ===== FORM ===== */
.form-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:17px 0 15px;
}
.form-title{
  font-size:17px;
  font-weight:900;
  color:#1f1f22;
}
.form-label-small{
  color:#aaa;
  font-size:10px;
  letter-spacing:1px;
}

.row{
  display:flex;
  gap:16px; /* 日期時間不再黏在一起 */
}
.input-group{
  flex:1;
  min-width:0;
  margin-bottom:15px;
  animation:fieldIn .45s ease both;
}

label{
  display:block;
  margin-bottom:7px;
  font-size:14px;
  color:#252529;
  font-weight:800;
}

input,select{
  width:100%;
  min-height:44px; /* 比原版小 */
  padding:0 11px;
  border:1px solid var(--line);
  border-radius:11px;
  background:#fbfbfc;
  color:#222;
  font-size:15px;
  outline:none;
  transition:border .16s,background .16s,box-shadow .16s,transform .16s;
}

input:focus,select:focus{
  border-color:var(--red);
  background:#fff;
  box-shadow:0 0 0 3px rgba(255,36,54,.07);
  transform:translateY(-1px);
}

input::placeholder{color:#b1b2b7}

/* 日期 / 時間特別縮小 */
#bookDate,#bookTime{
  min-height:42px;
  height:42px;
  font-size:14px;
  padding:0 10px;
}

/* ===== BUTTON ===== */
.submit-btn{
  width:100%;
  min-height:54px;
  margin-top:4px;
  border:0;
  border-radius:14px;
  background:linear-gradient(135deg,#ff3344,#c90018);
  color:#fff;
  font-size:16px;
  font-weight:900;
  letter-spacing:.25px;
  cursor:pointer;
  box-shadow:0 10px 24px rgba(200,0,22,.24);
  transition:transform .12s,box-shadow .16s,filter .16s,opacity .16s;
  position:relative;
  overflow:hidden;
}
.submit-btn:hover{
  filter:brightness(1.04);
  box-shadow:0 12px 28px rgba(200,0,22,.30);
  transform:translateY(-1px);
}
.submit-btn:active{
  transform:scale(.985);
}
.submit-btn:disabled{
  opacity:.58;
  cursor:not-allowed;
}

/* click shine */
.submit-btn::after{
  content:"";
  position:absolute;
  top:-40%;
  left:-25%;
  width:30%;
  height:180%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.26),transparent);
  transform:rotate(18deg);
  transition:left .45s ease;
}
.submit-btn:hover::after{left:115%}

/* ===== NOTE / MESSAGE ===== */
.notice{
  margin-top:15px;
  padding-top:14px;
  border-top:1px solid #eee;
  text-align:center;
  color:#8e8f94;
  font-size:11px;
  line-height:1.75;
}

.message-box{
  display:none;
  margin-top:15px;
  border-radius:12px;
  padding:13px;
  text-align:center;
  font-size:13px;
  line-height:1.6;
}
.message-box.success{
  display:block;
  color:#087c39;
  background:#effff4;
  border:1px solid #caefd6;
  animation:successPop .42s cubic-bezier(.2,.8,.2,1) both;
}
.message-box.error{
  display:block;
  color:#bb2632;
  background:#fff0f1;
  border:1px solid #ffd2d5;
  animation:shake .28s ease both;
}

.spinner{
  display:inline-block;
  width:16px;
  height:16px;
  margin-right:7px;
  vertical-align:-3px;
  border-radius:50%;
  border:2px solid rgba(255,255,255,.35);
  border-top-color:#fff;
  animation:spin .7s linear infinite;
}

.footer{
  text-align:center;
  margin-top:16px;
  color:#999;
  font-size:10px;
  line-height:1.6;
}

/* ===== ANIMATIONS ===== */
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeDown{
  from{opacity:0;transform:translateY(-8px)}
  to{opacity:1;transform:translateY(0)}
}
@keyframes cardUp{
  from{opacity:0;transform:translateY(14px) scale(.99)}
  to{opacity:1;transform:translateY(0) scale(1)}
}
@keyframes fieldIn{
  from{opacity:0;transform:translateY(8px)}
  to{opacity:1;transform:translateY(0)}
}
@keyframes successPop{
  0%{opacity:0;transform:scale(.96)}
  70%{opacity:1;transform:scale(1.02)}
  100%{transform:scale(1)}
}
@keyframes shake{
  0%,100%{transform:translateX(0)}
  30%{transform:translateX(-3px)}
  70%{transform:translateX(3px)}
}
@keyframes pulseGlow{
  0%,100%{opacity:.65;transform:scale(.98)}
  50%{opacity:1;transform:scale(1.05)}
}

/* ===== MOBILE ===== */
@media(max-width:520px){
  .hero{
    padding:
      max(12px,env(safe-area-inset-top))
      14px
      19px;
  }

  .logo{
    width:82px;
    height:82px;
    border-radius:18px;
  }

  .logo-glow{
    width:92px;
    height:92px;
  }

  .brand{font-size:25px}
  .system-name{font-size:15px}
  .hero-description{
    font-size:11.5px;
    margin-top:8px;
  }

  .page{
    padding-left:10px;
    padding-right:10px;
  }

  .booking-card{
    padding:18px 14px 17px;
    border-radius:20px;
  }

  .row{gap:14px}

  label{font-size:13.5px}
  input,select{
    min-height:43px;
    font-size:15px;
  }

  #bookDate,#bookTime{
    height:40px;
    min-height:40px;
    font-size:13px;
    padding:0 8px;
  }

  .submit-btn{
    min-height:52px;
    font-size:15.5px;
  }
}

@media(max-width:360px){
  .row{gap:10px}
  #bookDate,#bookTime{font-size:12px}
}
</style>
</head>

<body>

<header class="hero">
  <div class="logo-wrap">
    <div class="logo-glow"></div>
    <img src="logo.png" alt="TOP Taxi Logo" class="logo">
  </div>

  <h1 class="brand"><span class="brand-red">TOP</span> Taxi</h1>
  <div class="system-name">24H 預約系統</div>
  <div class="hero-description">專業叫車・機場接送・預約接送・包車服務</div>
</header>

<main class="page">
  <div class="booking-card">

    <div id="connectionStatus" class="connection-status">
      <span class="status-dot"></span>
      <span id="connectionText">LINE 系統連線中...</span>
    </div>

    <div id="lineUser" class="line-user"></div>

    <div class="form-header">
      <div class="form-title">🚕 預約叫車</div>
      <div class="form-label-small">TOP TAXI BOOKING</div>
    </div>

    <form id="bookingForm">

      <div class="row">
        <div class="input-group">
          <label for="bookDate">📅 預約日期</label>
          <input type="date" id="bookDate" required>
        </div>

        <div class="input-group">
          <label for="bookTime">⏰ 預約時間</label>
          <input type="time" id="bookTime" required>
        </div>
      </div>

      <div class="row">
        <div class="input-group">
          <label for="passengerCount">👥 乘車人數</label>
          <select id="passengerCount">
            <option value="1人" selected>1 人</option>
            <option value="2人">2 人</option>
            <option value="3人">3 人</option>
            <option value="4人">4 人</option>
            <option value="5人以上">5 人以上</option>
          </select>
        </div>

        <div class="input-group">
          <label for="luggageCount">🧳 行李件數</label>
          <select id="luggageCount">
            <option value="無行李" selected>無行李</option>
            <option value="1-2件大行李">1-2 件大行李</option>
            <option value="3-4件大行李">3-4 件大行李</option>
            <option value="5件以上">5 件以上</option>
          </select>
        </div>
      </div>

      <div class="input-group">
        <label for="pickup">📍 上車地點</label>
        <input type="text" id="pickup" placeholder="請輸入完整地址或地標名稱" autocomplete="street-address" required>
      </div>

      <div class="input-group">
        <label for="dropoff">🏁 下車地點</label>
        <input type="text" id="dropoff" placeholder="請輸入完整地址或地標名稱" required>
      </div>

      <div class="input-group">
        <label for="memo">💡 特殊需求備註（選填）</label>
        <input type="text" id="memo" placeholder="例如：兒童安全座椅、寵物、輪椅...">
      </div>

      <button type="button" id="submitBtn" class="submit-btn" onclick="sendBooking()">
        🚕 確認送出預約
      </button>
    </form>

    <div class="notice">
      ※ 送出後預約內容會直接傳送至 TOP Taxi 客服。<br>
      ※ 系統會同步建立預約紀錄。<br>
      ※ 預約是否成立，仍以客服最終確認為準。
    </div>

    <div id="messageBox" class="message-box"></div>
  </div>

  <div class="footer">TOP Taxi © 24H 多元叫車服務</div>
</main>

<script>
const LIFF_ID = "2011008197-NjirAoUX";
const WEBHOOK_URL = "https://lakswitting.app.n8n.cloud/webhook/96798dda-c12a-4552-bcaa-e51a1166a1a8";

let lineDisplayName = "";
let lineUserId = "";
let liffInitialized = false;

function setConnectionStatus(ready,text){
  const element=document.getElementById("connectionStatus");
  const textElement=document.getElementById("connectionText");
  textElement.textContent=text;
  if(ready){element.classList.add("ready")}else{element.classList.remove("ready")}
}

function showMessage(message,type){
  const box=document.getElementById("messageBox");
  box.innerHTML=message;
  box.className="message-box "+type;
}

const dateInput=document.getElementById("bookDate");
const timeInput=document.getElementById("bookTime");

function localDate(){
  const now=new Date();
  const year=now.getFullYear();
  const month=String(now.getMonth()+1).padStart(2,"0");
  const day=String(now.getDate()).padStart(2,"0");
  return year+"-"+month+"-"+day;
}

const today=localDate();
dateInput.value=today;
dateInput.min=today;

function escapeHtml(value){
  const element=document.createElement("div");
  element.textContent=value;
  return element.innerHTML;
}

async function initializeLiff(){
  try{
    if(typeof liff==="undefined"){
      throw new Error("LIFF_SDK_NOT_LOADED");
    }

    await liff.init({liffId:LIFF_ID});
    liffInitialized=true;

    setConnectionStatus(true,"LINE 系統已連線");

    if(!liff.isLoggedIn()){
      liff.login();
      return;
    }

    try{
      const profile=await liff.getProfile();
      lineDisplayName=profile.displayName||"";
      lineUserId=profile.userId||"";

      if(lineDisplayName){
        const box=document.getElementById("lineUser");
        box.innerHTML="✅ LINE 使用者：<strong>"+escapeHtml(lineDisplayName)+"</strong>";
        box.style.display="block";
      }
    }catch(profileError){
      console.warn("LINE Profile Error",profileError);
    }
  }catch(error){
    console.error("LIFF INIT ERROR:",error);
    setConnectionStatus(false,"LINE 系統尚未連線");
    showMessage(
      "LINE 系統初始化失敗。<br>請從 TOP Taxi 官方帳號的「預約叫車」重新開啟。",
      "error"
    );
  }
}

function validateBookingTime(){
  if(!dateInput.value||!timeInput.value){return true}
  const selected=new Date(dateInput.value+"T"+timeInput.value);
  const now=new Date();

  if(selected<=now){
    alert("請選擇目前時間之後的預約時間。");
    return false;
  }
  return true;
}

async function sendBooking(){
  const button=document.getElementById("submitBtn");

  /* 點擊震動：支援的 Android / 瀏覽器會觸發，iPhone 不支援時會自動忽略 */
  try{
    if(navigator.vibrate){navigator.vibrate(20)}
  }catch(e){}

  const bookDate=dateInput.value;
  const bookTime=timeInput.value;
  const passengerCount=document.getElementById("passengerCount").value;
  const luggageCount=document.getElementById("luggageCount").value;
  const pickup=document.getElementById("pickup").value.trim();
  const dropoff=document.getElementById("dropoff").value.trim();
  const memo=document.getElementById("memo").value.trim()||"無";

  if(!bookDate||!bookTime||!pickup||!dropoff){
    alert("請完整填寫預約日期、時間、上車地點與下車地點。");
    return;
  }

  if(!validateBookingTime()){return}

  if(!liffInitialized){
    showMessage("LINE 系統尚未完成連線，請稍候幾秒後再試。","error");
    return;
  }

  if(!liff.isInClient()){
    showMessage("請從 TOP Taxi LINE 官方帳號的「預約叫車」進入本頁後再送出。","error");
    return;
  }

  button.disabled=true;
  button.innerHTML='<span class="spinner"></span>正在送出預約';

  const lineMessage=
`🚕 TOP Taxi｜24H 預約系統

📅 預約日期：${bookDate}
⏰ 預約時間：${bookTime}

👥 乘車人數：${passengerCount}
🧳 行李件數：${luggageCount}

📍 上車地點
${pickup}

🏁 下車地點
${dropoff}

💡 特殊需求
${memo}

━━━━━━━━━━━━━━
請客服協助確認此筆預約，謝謝！`;

  const bookingData={
    source:"TOP Taxi LIFF Booking",
    lineDisplayName:lineDisplayName,
    lineUserId:lineUserId,
    bookDate:bookDate,
    bookTime:bookTime,
    passengerCount:passengerCount,
    luggageCount:luggageCount,
    pickup:pickup,
    dropoff:dropoff,
    memo:memo,
    submittedAt:new Date().toISOString()
  };

  try{
    await liff.sendMessages([{type:"text",text:lineMessage}]);

    try{
      const response=await fetch(WEBHOOK_URL,{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify(bookingData)
      });

      if(!response.ok){
        console.warn("n8n HTTP:",response.status);
      }
    }catch(n8nError){
      console.error("N8N ERROR:",n8nError);
    }

    button.innerHTML="✅ 預約已送出";

    showMessage(
      "✅ 預約已成功傳送給客服。<br>TOP Taxi 客服將盡快與您確認。",
      "success"
    );

    try{
      if(navigator.vibrate){navigator.vibrate([30,40,30])}
    }catch(e){}

    setTimeout(function(){
      try{
        if(liff.isInClient()){liff.closeWindow()}
      }catch(closeError){
        console.warn(closeError);
      }
    },2000);

  }catch(error){
    console.error("SEND MESSAGE ERROR:",error);

    button.disabled=false;
    button.innerHTML="🚕 確認送出預約";

    showMessage(
      "預約尚未送出。<br>請稍後再試，或直接透過 LINE 聯絡 TOP Taxi 客服。",
      "error"
    );
  }
}

window.addEventListener("DOMContentLoaded",function(){
  initializeLiff();
});
</script>

</body>
</html>
