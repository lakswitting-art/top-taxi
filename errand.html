<!doctype html>
<html lang="zh-TW">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>TOP Taxi｜24H 跑腿服務</title></head>
<body>
<script>
(async()=>{
  const r=await fetch('./errand-shell-v2.html?v=20260901-address-prod2',{cache:'no-store'});
  if(!r.ok) throw new Error('shell load failed');
  let s=await r.text();

  // Production uses the exact boot path that passed the 2026-09-01 iPhone test:
  // keep address-core changes, remove only the duplicated wrapper-level Routes patch.
  const badStart=s.indexOf('  // 在 shell 取得 errand-base 後');
  const badEnd=s.indexOf('  const patch=`',badStart);
  if(badStart>=0&&badEnd>badStart){
    s=s.slice(0,badStart)+s.slice(badEnd);
  }

  document.open();document.write(s);document.close();
})().catch(e=>{
  console.error('ERRAND PROD BOOT ERROR:',e);
  document.body.textContent='頁面載入失敗，請重新整理';
});
</script>
</body>
</html>
