<!doctype html>
<html lang="zh-TW">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>TOP Taxi｜24H 跑腿服務</title></head>
<body>
<script>
(async()=>{
  const r=await fetch('./errand-shell-v2.html?v=20260830-1805',{cache:'no-store'});
  if(!r.ok) throw new Error('shell load failed');
  let s=await r.text();

  // 在 shell 取得 errand-base 後，把 Places 與 Routes 初始化拆開。
  // Routes 掛掉時，地址搜尋仍要正常可用；只有路線／費用試算暫停。
  const shellAnchor='let html=await response.text();';
  const shellPatch=`let html=await response.text();\n  html=html.replace(\n    "   const routes=await google.maps.importLibrary('routes');RouteClass=routes.Route;",\n    "   try{const routes=await google.maps.importLibrary('routes');RouteClass=routes.Route;}catch(routeError){RouteClass=null;console.error('ERRAND ROUTES INIT ERROR:',routeError);}"\n  );\n  if(!html.includes('ERRAND ROUTES INIT ERROR:'))throw new Error('errand routes init patch anchor not found');`;

  if(!s.includes(shellAnchor)) throw new Error('errand shell patch anchor not found');
  s=s.replace(shellAnchor,shellPatch);

  document.open();document.write(s);document.close();
})().catch(e=>{console.error(e);document.body.textContent='頁面載入失敗，請重新整理';});
</script>
</body>
</html>
